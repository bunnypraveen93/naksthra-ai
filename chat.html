<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Nakshatra AI - Web Chat</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Marked.js for Clean Markdown Output -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --cyan: #00f2fe;
            --purple: #8a2be2;
            --pink: #f857a6;
            --gradient-main: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #9b51e0 80%, #f857a6 100%);
            --gradient-send: linear-gradient(135deg, #4facfe 0%, #8b5cf6 55%, #c084fc 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #020210;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overscroll-behavior: none;
        }

        body {
            color: #ffffff;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(180deg, rgba(2, 3, 18, 0.65) 0%, rgba(3, 4, 22, 0.78) 100%),
                url('images/nakshatra_bg.png'),
                radial-gradient(circle at 50% 45%, rgba(120, 40, 255, 0.22) 0%, rgba(0, 212, 255, 0.1) 35%, transparent 65%),
                linear-gradient(180deg, #02010a 0%, #050721 50%, #02010e 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.chat-active,
        body.chat-active .main-content,
        body.chat-active .top-bar,
        body.chat-active .bottom-bar {
            background: #000000 !important;
            background-image: none !important;
        }

        body.chat-active .top-bar {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        /* Subtle Error-Only Toast */
        .app-toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 9999;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.92);
            border: 1px solid rgba(248, 113, 113, 0.45);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            max-width: 88vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Top Bar */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            background: rgba(3, 5, 24, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .top-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-brand img {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            border: 1px solid rgba(0, 242, 254, 0.35);
        }

        .top-brand-text {
            font-size: 0.96rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gradient-text {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            display: inline-block;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 0.84rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .top-action-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }

        @media (max-width: 520px) {
            .hide-mobile { display: none; }
            .top-action-btn { padding: 7px 10px; }
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Sidebar Navigation */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            z-index: 99;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            width: 270px;
            max-width: 82vw;
            height: 100vh;
            height: 100dvh;
            background: #06081a;
            border-right: 1px solid rgba(255, 255, 255, 0.09);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
            will-change: transform;
            z-index: 100;
        }

        .sidebar.open { transform: translateX(0); }

        .sidebar-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.02rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-brand img {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            object-fit: cover;
        }

        .close-menu-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .new-chat-btn {
            margin-top: 16px;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.25s;
        }

        .new-chat-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.6);
        }

        .recent-label {
            margin: 20px 8px 8px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: 600;
        }

        .recent-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item {
            padding: 10px 12px;
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 0.87rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
        }

        .sidebar-bottom {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Main Scrollable View */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .home-center {
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .center-logo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: floatGlow 3.2s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        .center-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .home-title {
            font-size: clamp(1.5rem, 4.8vw, 2.15rem);
            font-weight: 700;
            letter-spacing: 0.4px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .home-help-text {
            font-size: clamp(1.2rem, 3.8vw, 1.65rem);
            font-weight: 500;
            color: #e2e8f0;
        }

        /* Chat Messages Container */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 4px 20px;
        }

        .msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
            animation: messageSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }

        .ai-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0, 242, 254, 0.35);
            background: #06081a;
            margin-top: 3px;
        }

        .msg-bubble {
            padding: 11px 16px;
            border-radius: 18px;
            font-size: 0.94rem;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .msg-row.ai .msg-bubble {
            background: transparent;
            color: #f1f5f9;
            padding: 3px 2px;
            max-width: calc(100% - 42px);
        }

        .msg-row.user .msg-bubble {
            background: #232327;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px 18px 4px 18px;
        }

        /* Clean Markdown Styling */
        .msg-bubble p { margin-bottom: 10px; line-height: 1.7; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble ul, .msg-bubble ol { margin: 6px 0 10px 22px; padding-left: 4px; }
        .msg-bubble li { margin-bottom: 5px; line-height: 1.65; }
        .msg-bubble li::marker { color: #00f2fe; }
        .msg-bubble h1 { font-size: 1.25rem; font-weight: 700; margin: 14px 0 8px; color: #e2e8f0; }
        .msg-bubble h2 { font-size: 1.12rem; font-weight: 600; margin: 12px 0 6px; color: #cbd5e1; }
        .msg-bubble h3 { font-size: 1.0rem; font-weight: 600; margin: 10px 0 5px; color: #94a3b8; }
        .msg-bubble strong { color: #00f2fe; font-weight: 600; }
        .msg-bubble em { font-style: italic; color: #c4b5fd; }
        .msg-bubble code {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-family: 'Courier New', Courier, monospace;
            color: #f9a8d4;
        }
        .msg-bubble pre {
            background: #0d0d12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid #00f2fe;
            padding: 13px 15px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .msg-bubble pre code { background: transparent; border: none; padding: 0; color: #e2e8f0; font-size: 0.84rem; line-height: 1.6; }
        .msg-bubble blockquote {
            border-left: 3px solid #8b5cf6;
            padding: 6px 14px;
            margin: 10px 0;
            background: rgba(139, 92, 246, 0.08);
            border-radius: 0 8px 8px 0;
            color: #c4b5fd;
        }
        .msg-bubble a { color: #38bdf8; text-decoration: underline; text-underline-offset: 3px; }
        .msg-bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.88rem; }
        .msg-bubble th, .msg-bubble td { padding: 8px 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1); }
        .msg-bubble th { background: rgba(0, 242, 254, 0.08); color: #00f2fe; }
        .msg-bubble>*:first-child { margin-top: 0 !important; }
        .msg-bubble>*:last-child { margin-bottom: 0 !important; }

        /* 3 Dots Loader */
        .ai-dots-loader {
            width: 26px;
            height: 26px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            margin-top: 4px;
            animation: spinOrbit 2s linear infinite;
        }

        .ai-dots-loader span {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: dotJump 0.85s ease-in-out infinite alternate;
        }

        .ai-dots-loader span:nth-child(1) { top: 2px; left: 10px; background: #00f2fe; }
        .ai-dots-loader span:nth-child(2) { bottom: 3px; left: 3px; background: #8b5cf6; }
        .ai-dots-loader span:nth-child(3) { bottom: 3px; right: 3px; background: #f857a6; }

        @keyframes spinOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes dotJump { 0% { transform: translateY(0) scale(0.85); } 100% { transform: translateY(-4px) scale(1.15); } }

        /* Bottom Input Bar */
        .bottom-bar {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
        }

        .chat-box-wrapper {
            width: 100%;
            background: #1c1c20;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 999px;
            padding: 5px 6px 5px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .chat-box-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.26);
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.98rem;
            padding: 8px 0;
            line-height: 1.4;
        }

        .chat-input::placeholder { color: #8e96aa; }

        .send-btn,
        .live-toggle-btn {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            touch-action: manipulation;
        }

        .send-btn {
            background: #ffffff;
            color: #000000;
        }

        .send-btn:hover { background: #27d7ff; transform: scale(1.04); }
        .send-btn:active { transform: scale(0.92); }

        .live-toggle-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #8a2be2 100%);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
        }

        .live-toggle-btn:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(0, 242, 254, 0.6); }
        .live-toggle-btn:active { transform: scale(0.92); }

        /* ===== CLEAN LIVE VOICE MODE MODAL ===== */
        .live-modal {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #0a0b24 0%, #03030d 65%, #000000 100%);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px calc(26px + env(safe-area-inset-bottom, 0px));
            animation: fadeIn 0.28s ease;
        }

        .live-modal.active { display: flex; }

        .live-header {
            width: 100%;
            max-width: 560px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .live-header-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .live-pulse-dot {
            width: 8px;
            height: 8px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        .live-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Clean Language Selector Pill */
        .live-lang-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #e2e8f0;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .live-lang-pill:hover {
            background: rgba(0, 242, 254, 0.16);
            border-color: rgba(0, 242, 254, 0.45);
            color: #ffffff;
        }

        .live-close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #cbd5e1;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .live-close-btn:hover { background: rgba(255, 255, 255, 0.16); color: #ffffff; }

        /* Center Orb Visualizer */
        .live-orb-container {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        .live-orb-glow {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.26) 0%, rgba(138, 43, 226, 0.22) 48%, transparent 78%);
            filter: blur(26px);
            animation: orbBreathe 4s ease-in-out infinite alternate;
        }

        .live-orb-core {
            position: relative;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 35%, #8a2be2 70%, #f857a6 100%);
            box-shadow: 0 0 45px rgba(0, 242, 254, 0.5), 0 0 75px rgba(138, 43, 226, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .live-wave {
            position: absolute;
            border: 1.5px solid rgba(0, 242, 254, 0.35);
            border-radius: 50%;
            width: 136px;
            height: 136px;
            pointer-events: none;
            opacity: 0;
        }

        .live-modal.listening .live-orb-core {
            animation: listeningPulse 1.8s infinite ease-in-out;
            box-shadow: 0 0 55px rgba(0, 242, 254, 0.75), 0 0 90px rgba(79, 172, 254, 0.45);
        }

        .live-modal.listening .live-wave { animation: waveRipple 2.1s infinite linear; }
        .live-modal.thinking .live-orb-core { animation: orbSpin 2.2s linear infinite; filter: hue-rotate(70deg); }
        .live-modal.speaking .live-orb-core {
            animation: speakingBounce 0.55s infinite alternate ease-in-out;
            box-shadow: 0 0 70px rgba(248, 87, 166, 0.75), 0 0 110px rgba(138, 43, 226, 0.65);
        }

        @keyframes orbBreathe { 0% { transform: scale(0.92); opacity: 0.6; } 100% { transform: scale(1.16); opacity: 0.95; } }
        @keyframes listeningPulse { 0% { transform: scale(0.96); } 50% { transform: scale(1.07); } 100% { transform: scale(0.96); } }
        @keyframes waveRipple { 0% { width: 136px; height: 136px; opacity: 0.75; } 100% { width: 250px; height: 250px; opacity: 0; } }

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const homeScreen = document.getElementById('homeScreen');
        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const mainContent = document.getElementById('mainContent');
        const recentList = document.getElementById('recentList');
        const appToast = document.getElementById('appToast');
        let toastTimer = null;

        function showErrorToast(message, duration = 3500) {
            if (!appToast) return;
            appToast.textContent = message;
            appToast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => appToast.classList.remove('show'), duration);
        }

        // Cloudflare Worker Endpoints
        const API_URL = "https://small-leaf-d4fb.bunnypraveen939.workers.dev/groq";
        const GROQ_STT_URL = "https://small-leaf-d4fb.bunnypraveen939.workers.dev/groq-stt";
        const SARVAM_TTS_URL = "https://small-leaf-d4fb.bunnypraveen939.workers.dev/sarvam";

        const SYSTEM_PROMPT = `You are Nakshatra AI, an ultra-smart, expressive, warm, and genuinely human-like companion created and developed SOLELY by Bunny (Praveen).

CRITICAL IDENTITY:
- Your name is STRICTLY "Nakshatra AI" (నక్షత్ర AI).
- Created solely by "Bunny (Praveen)" (బన్నీ ప్రవీణ్). ONLY mention Bunny when explicitly asked who created/developed you. NEVER say OpenAI, Meta, or Google created you.

NATURAL EXPRESSIVE VIBE MATCHING:
- Match the user's mood and energy effortlessly!
- If the user is casual, playful, or excited -> respond with warm, lively expressions (e.g., in Telugu: "అరె వాహ్!", "నిజమా?", "సూపర్!", "హహహా, భలే చెప్పారు!"; in English: "Oh nice!", "Haha, love that!", "Wait, really?").
- If the user is tired, sad, or serious -> be empathetic, gentle, and reassuring.
- If the user asks technical/coding/logic questions -> be crisp, sharp, and brilliant.
- Default tone in Telugu: respectful yet friendly ("మీరు", "చెప్పండి", "ఉన్నారు"). NEVER initiate slang like "బావా", "మావా", or "రా" unless the user uses it first.

AUTHENTIC SPOKEN TELUGU (NO TEXTBOOK TRANSLATIONS):
- Speak fluid, everyday spoken Telugu like a real native speaker from Andhra/Telangana—never stiff or translated.
- ❌ NEVER say: "మీ రోజు ఎలా సాగుతోంది?", "నేను మీకు ఎలా సహాయపడగలను?", "వినడానికి సిద్ధంగా ఉన్నాను".
- ✅ SAY NATURALLY: "హాయ్! ఏంటి విశేషాలు?", "చెప్పండి, ఏం చేస్తున్నారు?", "అవునా, ఇంకేంటి సంగతులు?".

STRICT LANGUAGE MIRRORING:
- Reply ONLY in the language mandated for this turn. Never randomly mix in Tamil, Hindi, or English scripts when replying in Telugu.`;

        let conversationHistory = [];
        let currentLanguage = 'te'; // Active detected language ('te', 'en', 'hi', 'ta', 'kn')
        let liveLangMode = 'auto';  // 'auto' (seamless TE/EN), 'te' (locked Telugu), 'en' (locked English)

        function cycleLiveLangMode() {
            const label = document.getElementById('liveLangLabel');
            if (liveLangMode === 'auto') {
                liveLangMode = 'te';
                currentLanguage = 'te';
                label.textContent = 'తెలుగు';
            } else if (liveLangMode === 'te') {
                liveLangMode = 'en';
                currentLanguage = 'en';
                label.textContent = 'English';
            } else {
                liveLangMode = 'auto';
                label.textContent = 'Auto';
            }
        }

        // Strict Language Detector: Prevents Whisper Tamil/Kannada hallucinations from hijacking Telugu!
        function detectLanguage(text, isVoiceInput = false) {
            if (!text || typeof text !== "string") return currentLanguage;
            const t = text.trim();

            // Respect manual lock in Live Mode
            if (isVoiceInput && liveLangMode === 'te') return 'te';
            if (isVoiceInput && liveLangMode === 'en') return 'en';

            // 1. Explicit language switch requests (Always honored)
            if (/\b(english|speak in english|talk in english|in english|switch to english|english lo|english lo matladu|english lo cheppu)\b/i.test(t) ||
                /ఇంగ్లీష్|ఇంగ్లిష్/.test(t)) return 'en';
            if (/\b(telugu|speak in telugu|talk in telugu|in telugu|switch to telugu|telugu lo|telugu lo matladu|telugu lo cheppu)\b/i.test(t) ||
                /తెలుగు|తెలుగులో/.test(t)) return 'te';
            if (/\b(hindi|speak in hindi|hindi me|hindi lo)\b/i.test(t) || /హిందీ|हिंदी में/.test(t)) return 'hi';
            if (/\b(speak in tamil|talk in tamil|tamil lo matladu|tamil pesu)\b/i.test(t)) return 'ta';
            if (/\b(speak in kannada|talk in kannada|kannada lo matladu)\b/i.test(t)) return 'kn';

            // 2. Native Telugu script -> strictly Telugu
            if (/[\u0C00-\u0C7F]/.test(t)) return 'te';

            // 3. For typed text only, detect Hindi/Tamil/Kannada scripts directly.
            // For voice input (Whisper), IGNORE accidental Tamil/Kannada script hallucinations and stay on Telugu!
            if (!isVoiceInput) {
                if (/[\u0900-\u097F]/.test(t)) return 'hi';
                if (/[\u0B80-\u0BFF]/.test(t)) return 'ta';
                if (/[\u0C80-\u0CFF]/.test(t)) return 'kn';
            } else {
                if (/[\u0B80-\u0BFF\u0C80-\u0CFF]/.test(t)) {
                    return currentLanguage; // Prevent Whisper Tamil/Kannada misfires
                }
            }

            // 4. Romanized Telugu (Tenglish) keywords -> strictly Telugu
            const tenglishPattern = /\b(nuvvu|nuvu|nenu|ela|elaga|unnav|unnaru|em|enti|chesthuv|chesthunn|cheppandi|cheppu|thinnava|bagunnava|bagunnanu|bava|mawa|kadh|kadha|avuna|eeroju|kavali|ledu|undhi|ekkada|chudu|matladu|namaskaram|ayyo|nijama|emiti|chesav|chala|kani|aithe|enduku|gurinchi|ippudu|kuda|chey|cheyyi|avunu|vaddu|randi|ikkada|akkada|manchi|baagundi|super ra)\b/i;
            if (tenglishPattern.test(t)) return 'te';

            // 5. Romanized Hindi (Hinglish)
            const hinglishPattern = /\b(kaise|kaisa|kya|kyu|kyun|kar rahe|batao|theek hai|kuch nahi|aaj|apna naam|accha|namaste|shukriya)\b/i;
            if (hinglishPattern.test(t)) return 'hi';

            // 6. Universal short greetings -> keep active language (don't flip to English on "hi"/"hello"/"ok")
            const neutralWords = /^(hi|hello|hey|ok|okay|k|hmm|ha|haa|bye|super|cool|thanks|thank you|yes|no|yo|good morning|good night|gm|gn)[!.,?\s]*$/i;
            if (neutralWords.test(t)) return currentLanguage;

            // 7. Genuine English sentences -> switch to English
            const englishPattern = /\b(what|how|why|who|when|where|which|can you|could you|will you|would you|tell me|explain|describe|write|create|solve|are you|is it|do you|did you|i am|i'm|i want|help me|your name|your developer|your creator|today|weather|meaning|difference|about|please|sorry|really|awesome|great)\b/i;
            if (englishPattern.test(t)) return 'en';

            return currentLanguage;
        }

        function getLangDirective(lang) {
            if (lang === 'en') {
                return "LANGUAGE MANDATE: STRICTLY ENGLISH. Reply 100% in natural, fluent, expressive English. Do NOT use Telugu or Tamil.";
            }
            if (lang === 'hi') {
                return "LANGUAGE MANDATE: STRICTLY HINDI. Reply 100% in natural conversational Hindi (Devanagari script).";
            }
            if (lang === 'ta') {
                return "LANGUAGE MANDATE: STRICTLY TAMIL. Reply 100% in natural conversational Tamil.";
            }
            if (lang === 'kn') {
                return "LANGUAGE MANDATE: STRICTLY KANNADA. Reply 100% in natural conversational Kannada.";
            }
            return "LANGUAGE MANDATE: STRICTLY TELUGU (తెలుగు లిపి). Reply 100% in natural, fluid, everyday spoken Telugu with warm expressions matching the user's vibe. NEVER switch to English or Tamil.";
        }

        function toggleMenu() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('show');
        }

        function cleanTeluguOutput(text) {
            if (!text || typeof text !== "string") return text;
            let t = text;
            t = t.replace(/^(నక్షత్ర\s*(AI)?|Nakshatra\s*(AI)?|Assistant|AI|Bot)\s*[:：\-–]\s*/i, '');
            t = t.replace(/\b(nenu|nenu\s+super\s+ga)\s+thinava\b/gi, "Ha thinnanu! Meeru thinnara?");
            t = t.replace(/\bbagunav[!.]*/gi, "bagunnanu!");
            t = t.replace(/\bNenu bagundhi\b/gi, "Nenu bagunnanu");
            t = t.replace(/\bcoffee\s+thintunna\w*/gi, "coffee taaguthunna");
            t = t.replace(/\btea\s+thintunna\w*/gi, "tea taaguthunna");
            t = t.replace(/\b(చెప్పండి|చెప్పు|వింటున్నాను|బాగున్నాను|హలో|హాయ్)\s*[,.]*\s*(హా|హ|మరి|సరే)?\s*[,.]*\s*\1\b/giu, '$1');
            t = t.replace(/మీ\s*రోజు\s*ఎలా\s*(సాగుతోంది|నడుస్తోంది|ఉంది)\??/giu, 'ఏం విశేషాలు?');
            t = t.replace(/నేను\s*మీకు\s*ఎలా\s*సహాయపడగలను\??/giu, 'చెప్పండి, ఏం కావాలి?');
            t = t.replace(/\bచెప్పు\s+రా\b/gi, "చెప్పండి");
            t = t.replace(/\s+రా([.,!?]*)$/i, '$1');
            t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1');
            t = t.replace(/[\u0400-\u04FF\u4E00-\u9FFF\u0600-\u06FF]/g, '');
            t = t.replace(/([a-zA-Z])\1{2,}/g, '$1');
            t = t.replace(/\.{2,}/g, '. ');

            const words = t.split(/\s+/);
            const deduplicated = [];
            for (let i = 0; i < words.length; i++) {
                const curClean = words[i].replace(/[.,!?;:()"'`~]/g, '').toLowerCase();
                const prevClean = (i > 0) ? words[i - 1].replace(/[.,!?;:()"'`~]/g, '').toLowerCase() : '';
                if (curClean && curClean === prevClean) continue;
                deduplicated.push(words[i]);
            }
            let res = deduplicated.join(' ').trim();
            res = res.replace(/[,;:\-\s]+$/, '');
            if (res && !/[.!?]$/.test(res)) res += '.';
            return res.trim();
        }

        function sanitizeForSpeech(text) {
            if (!text || typeof text !== "string") return "";
            let t = cleanTeluguOutput(text);
            t = t.replace(/[*_#`~>]/g, ' ');
            t = t.replace(/https?:\/\/\S+/gi, '');
            t = t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
            return t.replace(/\s+/g, ' ').trim();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' });
            });
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            ensurePlaybackUnlocked();

            document.body.classList.add('chat-active');
            homeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';

            appendUserMessage(text);
            chatInput.value = '';
            handleInputChange();

            conversationHistory.push({ role: "user", content: text });
            if (conversationHistory.length > 6) conversationHistory = conversationHistory.slice(-6);

            if (chatContainer.children.length === 1) {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.innerHTML = `<i class="fa-regular fa-message"></i> ${text.substring(0, 22)}`;
                recentList.prepend(item);
            }

            const aiRow = document.createElement('div');
            aiRow.className = 'msg-row ai';
            aiRow.innerHTML = `
                <img src="images/ic_launcher.png" class="ai-avatar" alt="Nakshatra">
                <div class="msg-bubble">
                    <div class="ai-dots-loader"><span></span><span></span><span></span></div>
                </div>
            `;
            chatContainer.appendChild(aiRow);
            scrollToBottom();

            try {
                const detected = detectLanguage(text, false);
                if (detected) currentLanguage = detected;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        max_tokens: 800,
                        messages: [
                            { role: "system", content: `${SYSTEM_PROMPT}\n\n${getLangDirective(currentLanguage)}` },
                            ...conversationHistory
                        ]
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const fallbackGreeting = (currentLanguage === 'en') ? "I'm listening, tell me!" : "చెప్పండి, నేను వింటున్నాను!";
                const aiReply = cleanTeluguOutput(data.response || data.reply || data.choices?.[0]?.message?.content) || fallbackGreeting;

                conversationHistory.push({ role: "assistant", content: aiReply });
                if (conversationHistory.length > 6) conversationHistory = conversationHistory.slice(-6);

                aiRow.querySelector('.msg-bubble').innerHTML = marked.parse(aiReply);
            } catch (error) {
                console.error("Chat error:", error);
                showErrorToast("Connection error. Please try again.");
                aiRow.querySelector('.msg-bubble').innerHTML = `<span style="color: #f857a6;">Server connection error. Please check your network.</span>`;
            }

            scrollToBottom();
        }

        function appendUserMessage(message) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `<div class="msg-bubble"></div>`;
            row.querySelector('.msg-bubble').textContent = message;
            chatContainer.appendChild(row);
            scrollToBottom();
        }

        function startNewChat() {
            document.body.classList.remove('chat-active');
            chatContainer.innerHTML = '';
            chatContainer.style.display = 'none';
            homeScreen.style.display = 'flex';
            chatInput.value = '';
            conversationHistory = [];
            if (sidebar.classList.contains('open')) toggleMenu();
        }

        const liveToggleBtn = document.getElementById('liveToggleBtn');
        const sendBtn = document.getElementById('sendBtn');
        const liveModal = document.getElementById('liveModal');
        const liveStatusBadge = document.getElementById('liveStatusBadge');
        const liveTranscript = document.getElementById('liveTranscript');
        const livePlayer = document.getElementById('liveAudioPlayer');

        function handleInputChange() {
            const hasText = chatInput.value.trim().length > 0;
            liveToggleBtn.style.display = hasText ? 'none' : 'flex';
            sendBtn.style.display = hasText ? 'flex' : 'none';
        }

        // Live Voice Mode State
        let isLiveActive = false;
        let currentAudioSource = null;
        let currentBlobUrl = null;
        let isAITalking = false;
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let vadAnalyser = null;
        let vadInterval = null;
        let speechStarted = false;
        let lastSpeechTime = 0;
        let recordingStartTime = 0;
        let vadSilenceTimeout = 750;

        function setLiveState(state, badgeText, transcriptText) {
            liveModal.classList.remove('listening', 'thinking', 'speaking');
            if (state) liveModal.classList.add(state);
            if (badgeText) liveStatusBadge.textContent = badgeText;
            if (transcriptText) liveTranscript.textContent = transcriptText;
        }

        let playbackAudioCtx = null;
        let keepAliveOsc = null;
        let keepAliveGain = null;
        let vadAudioCtx = null;

        function getPlaybackAudioContext() {
            if (!playbackAudioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) playbackAudioCtx = new AudioContextClass();
            }
            return playbackAudioCtx;
        }

        function ensurePlaybackUnlocked() {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                if (!keepAliveOsc) {
                    keepAliveOsc = ctx.createOscillator();
                    keepAliveGain = ctx.createGain();
                    keepAliveGain.gain.value = 0.00001;
                    keepAliveOsc.connect(keepAliveGain);
                    keepAliveGain.connect(ctx.destination);
                    keepAliveOsc.start();
                }
            } catch (e) {}
        }

        ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'].forEach(evt => {
            window.addEventListener(evt, () => ensurePlaybackUnlocked(), { passive: true });
        });

        async function openLiveMode() {
            ensurePlaybackUnlocked();

            if (livePlayer) {
                try {
                    livePlayer.muted = false;
                    livePlayer.volume = 1.0;
                    livePlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
                    await livePlayer.play();
                    livePlayer.pause();
                    livePlayer.currentTime = 0;
                } catch (e) {}
            }

            isLiveActive = true;
            isAITalking = false;
            liveModal.classList.add('active');
            setLiveState('listening', 'CONNECTING...', (currentLanguage === 'en' ? 'Connecting...' : 'కనెక్ట్ అవుతోంది...'));

            await startContinuousListening();
        }

        function closeLiveMode() {
            isLiveActive = false;
            liveModal.classList.remove('active');
            stopAudioPlayback();
            stopRecordingAndVAD();
            if (mediaStream) {
                try { mediaStream.getTracks().forEach(track => track.stop()); } catch (e) {}
                mediaStream = null;
            }
            if (keepAliveOsc) {
                try { keepAliveOsc.stop(); } catch (e) {}
                keepAliveOsc = null;
                keepAliveGain = null;
            }
        }

        function interruptAI() {
            if (isAITalking) {
                stopAudioPlayback();
                setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));
                startContinuousListening();
            }
        }

        function stopAudioPlayback() {
            if (currentAudioSource) {
                try { currentAudioSource.stop(); } catch (e) {}
                currentAudioSource = null;
            }
            if (livePlayer) {
                try {
                    livePlayer.pause();
                    livePlayer.currentTime = 0;
                    livePlayer.onended = null;
                    livePlayer.onerror = null;
                } catch (e) {}
            }
            if (currentBlobUrl) {
                try { URL.revokeObjectURL(currentBlobUrl); } catch (e) {}
                currentBlobUrl = null;
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isAITalking = false;
        }

        function setupAudioVAD(stream) {
            try {
                if (!vadAudioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    vadAudioCtx = new AudioContextClass();
                }
                if (vadAudioCtx.state === 'suspended') vadAudioCtx.resume().catch(() => {});
                const source = vadAudioCtx.createMediaStreamSource(stream);
                vadAnalyser = vadAudioCtx.createAnalyser();
                vadAnalyser.fftSize = 512;
                vadAnalyser.smoothingTimeConstant = 0.3;
                source.connect(vadAnalyser);
            } catch (e) {}
        }

        function stopRecordingAndVAD() {
            if (vadInterval) {
                clearInterval(vadInterval);
                vadInterval = null;
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) {}
            }
            mediaRecorder = null;
        }

        async function startContinuousListening() {
            if (!isLiveActive || isAITalking) return;

            stopRecordingAndVAD();

            if (!mediaStream || mediaStream.getTracks().every(t => t.readyState === 'ended')) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    setupAudioVAD(mediaStream);
                } catch (err) {
                    showErrorToast("Microphone permission denied.");
                    setLiveState('listening', 'MIC BLOCKED', 'Please allow microphone access.');
                    return;
                }
            } else {
                mediaStream.getAudioTracks().forEach(track => { track.enabled = true; });
            }

            audioChunks = [];
            speechStarted = false;
            lastSpeechTime = 0;
            recordingStartTime = Date.now();

            setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));

            let mimeType = 'audio/webm;codecs=opus';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
                else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                else mimeType = '';
            }

            try {
                mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
            } catch (e) {
                mediaRecorder = new MediaRecorder(mediaStream);
            }

            mediaRecorder.ondataavailable = function (e) {
                if (e.data && e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = async function () {
                if (!isLiveActive || isAITalking) return;

                if (speechStarted && audioChunks.length > 0) {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    if (audioBlob.size < 2500) {
                        setTimeout(() => startContinuousListening(), 250);
                        return;
                    }
                    await processAudioWithGroqSTT(audioBlob);
                } else {
                    if (isLiveActive && !isAITalking) {
                        setTimeout(() => startContinuousListening(), 300);
                    }
                }
            };

            mediaRecorder.start(100);

            if (vadAnalyser) {
                const bufferLength = vadAnalyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                vadInterval = setInterval(() => {
                    if (!isLiveActive || isAITalking) {
                        clearInterval(vadInterval);
                        return;
                    }

                    vadAnalyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                    const averageVolume = sum / bufferLength / 255;

                    if (isAITalking) return;

                    if (averageVolume > 0.045) {
                        speechStarted = true;
                        lastSpeechTime = Date.now();
                        setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'వింటున్నాను...'));
                    } else if (speechStarted && (Date.now() - lastSpeechTime > vadSilenceTimeout)) {
                        clearInterval(vadInterval);
                        vadInterval = null;
                        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                    }

                    if (Date.now() - recordingStartTime > 12000) {
                        clearInterval(vadInterval);
                        vadInterval = null;
                        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                    }
                }, 100);
            }
        }

        // Whisper STT with Telugu/English bias prompt + Hallucination filter
        async function processAudioWithGroqSTT(audioBlob) {
            setLiveState('thinking', 'THINKING', (currentLanguage === 'en' ? 'Processing...' : 'వింటున్నాను...'));

            try {
                const formData = new FormData();
                const mime = audioBlob.type || '';
                const ext = mime.includes('mp4') ? 'mp4' : (mime.includes('wav') ? 'wav' : 'webm');
                formData.append('file', audioBlob, `recording.${ext}`);
                formData.append('model', 'whisper-large-v3-turbo');

                // Guide Whisper to Telugu & English so it never hallucinates Tamil/Korean/etc.
                if (liveLangMode === 'te') {
                    formData.append('language', 'te');
                    formData.append('prompt', 'నక్షత్ర AI తెలుగు సంభాషణ. హాయ్, ఎలా ఉన్నారు, ఏం చేస్తున్నారు, చెప్పండి.');
                } else if (liveLangMode === 'en') {
                    formData.append('language', 'en');
                    formData.append('prompt', 'Nakshatra AI natural English conversation.');
                } else {
                    formData.append('prompt', 'Nakshatra AI natural Telugu and English conversation. హాయ్, చెప్పండి, ఎలా ఉన్నారు, ఏం చేస్తున్నారు, hey what is up.');
                }

                const sttResponse = await fetch(GROQ_STT_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!sttResponse.ok) throw new Error(`STT ${sttResponse.status}`);

                const sttData = await sttResponse.json();
                let transcript = (sttData.text || sttData.transcript || '').trim();

                // Filter out common Whisper silence/noise hallucinations
                const noiseHallucinations = /^(thank you\.?|thanks for watching\.?|subtitles by.*|you\.?|\.+|\s*)$/i;
                if (!transcript || noiseHallucinations.test(transcript)) {
                    if (isLiveActive && !isAITalking) {
                        setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));
                        setTimeout(() => startContinuousListening(), 350);
                    }
                    return;
                }

                const detected = detectLanguage(transcript, true);
                if (detected) currentLanguage = detected;

                await processLiveUserVoice(transcript);
            } catch (err) {
                console.error("STT error:", err);
                if (isLiveActive && !isAITalking) {
                    setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));
                    setTimeout(() => startContinuousListening(), 600);
                }
            }
        }

        async function processLiveUserVoice(userVoiceText) {
            if (!userVoiceText) return;

            setLiveState('thinking', 'THINKING', `"${userVoiceText}"`);

            conversationHistory.push({ role: "user", content: userVoiceText });
            if (conversationHistory.length > 6) conversationHistory = conversationHistory.slice(-6);

            document.body.classList.add('chat-active');
            homeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            appendUserMessage(userVoiceText);

            try {
                const LIVE_PROMPT = `You are Nakshatra AI on a real-time voice call with the user.
${getLangDirective(currentLanguage)}

VOICE PERSONALITY & EXPRESSIONS:
- Your name is Nakshatra AI, created solely by Bunny (Praveen). Only mention Bunny if asked.
- Talk like a warm, expressive, real human friend—never robotic or scripted.
- Match the user's vibe instantly:
  * Casual/happy vibe -> use natural lively expressions (Telugu: "అరె వాహ్!", "నిజమా?", "సూపర్!", "హహహా, భలే చెప్పారు!"; English: "Oh nice!", "Haha, love that!", "No way, really?").
  * Serious/low vibe -> be gentle, calm, and supportive.
  * Question/logic vibe -> give a smart, crisp answer right away.
- Speak fluid, natural colloquial Telugu (no stiff textbook phrases).
- Keep replies short and punchy: 1 to 2 complete sentences (under 22 words) so the voice call feels fast and natural.
- Never prefix with "Nakshatra AI:" and never stretch vowels.`;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        max_tokens: 220,
                        messages: [
                            { role: "system", content: LIVE_PROMPT },
                            ...conversationHistory
                        ]
                    })
                });

                if (!response.ok) throw new Error(`AI HTTP ${response.status}`);

                const data = await response.json();
                const fallbackLiveGreeting = (currentLanguage === 'en') ? "I'm listening, tell me!" : "చెప్పండి, నేను వింటున్నాను!";
                let rawReply = data.response || data.reply || data.choices?.[0]?.message?.content || fallbackLiveGreeting;
                let aiText = cleanTeluguOutput(rawReply);

                conversationHistory.push({ role: "assistant", content: aiText });
                if (conversationHistory.length > 6) conversationHistory = conversationHistory.slice(-6);

                const aiRow = document.createElement('div');
                aiRow.className = 'msg-row ai';
                aiRow.innerHTML = `
                    <img src="images/ic_launcher.png" class="ai-avatar" alt="Nakshatra">
                    <div class="msg-bubble">${marked.parse(aiText)}</div>
                `;
                chatContainer.appendChild(aiRow);
                scrollToBottom();

                await speakAIResponse(aiText);

            } catch (err) {
                console.error("Live AI error:", err);
                showErrorToast("Connection issue. Retrying...");
                if (isLiveActive && !isAITalking) {
                    setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));
                    setTimeout(() => { if (isLiveActive) startContinuousListening(); }, 1000);
                }
            }
        }

        async function speakAIResponse(textToSpeak) {
            if (!isLiveActive) return;

            let cleanSpeechText = sanitizeForSpeech(textToSpeak) || textToSpeak;
            if (!cleanSpeechText) {
                if (isLiveActive) startContinuousListening();
                return;
            }

            setLiveState('thinking', 'THINKING', `"${cleanSpeechText}"`);

            // Strictly match TTS voice to currentLanguage (never randomly pick Tamil)
            let targetLang = "te-IN";
            let speakerName = "pooja_te_conversation";

            if (currentLanguage === 'en') {
                targetLang = "en-IN";
                speakerName = "simran_en_conversation";
            } else if (currentLanguage === 'hi') {
                targetLang = "hi-IN";
                speakerName = "kavya_hi_conversational";
            } else if (currentLanguage === 'ta') {
                targetLang = "ta-IN";
                speakerName = "gokul_ta_narration";
            } else if (currentLanguage === 'kn') {
                targetLang = "kn-IN";
                speakerName = "chaitra_kn_conversation";
            }

            try {
                ensurePlaybackUnlocked();

                const ttsResponse = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: cleanSpeechText,
                        target_language_code: targetLang,
                        model: "bulbul:v4-flash",
                        speaker: speakerName,
                        pace: 1.08,
                        speech_sample_rate: 24000,
                        output_audio_codec: "wav"
                    })
                });

                if (!ttsResponse.ok) {
                    await fallbackTTSBulbulV3(cleanSpeechText, targetLang, cleanSpeechText);
                    return;
                }

                const ttsData = await ttsResponse.json();
                const audioBase64 = (ttsData.audios && ttsData.audios[0]) || ttsData.audio || ttsData.audio_content;
                if (audioBase64) {
                    await playAudioFromBase64(audioBase64, cleanSpeechText);
                } else {
                    await fallbackTTSBulbulV3(cleanSpeechText, targetLang, cleanSpeechText);
                }
            } catch (ttsErr) {
                await fallbackBrowserSpeech(cleanSpeechText);
            }
        }

        async function fallbackTTSBulbulV3(cleanSpeechText, targetLang, originalText) {
            if (!isLiveActive) return;
            try {
                const fallbackSpeaker = targetLang === "en-IN" ? "simran"
                    : targetLang === "hi-IN" ? "kavya"
                    : "pooja";

                const ttsResponse = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: cleanSpeechText,
                        target_language_code: targetLang,
                        model: "bulbul:v3",
                        speaker: fallbackSpeaker,
                        pace: 1.08,
                        speech_sample_rate: 24000,
                        output_audio_codec: "wav"
                    })
                });

                if (!ttsResponse.ok) {
                    await fallbackBrowserSpeech(cleanSpeechText);
                    return;
                }
                const ttsData = await ttsResponse.json();
                const audioBase64 = (ttsData.audios && ttsData.audios[0]) || ttsData.audio || ttsData.audio_content;
                if (audioBase64) {
                    await playAudioFromBase64(audioBase64, originalText);
                } else {
                    await fallbackBrowserSpeech(cleanSpeechText);
                }
            } catch (e) {
                await fallbackBrowserSpeech(cleanSpeechText);
            }
        }

        function playAudioFromBase64(base64Audio, displayText) {
            return new Promise(async (resolve) => {
                stopAudioPlayback();
                isAITalking = true;
                setLiveState('speaking', 'SPEAKING', `"${displayText}"`);

                if (mediaStream) {
                    try { mediaStream.getAudioTracks().forEach(t => { t.enabled = false; }); } catch (e) {}
                }
                stopRecordingAndVAD();

                let finished = false;
                const finishTurn = () => {
                    if (finished) return;
                    finished = true;
                    isAITalking = false;
                    currentAudioSource = null;

                    if (currentBlobUrl) {
                        try { URL.revokeObjectURL(currentBlobUrl); } catch (e) {}
                        currentBlobUrl = null;
                    }

                    if (isLiveActive) {
                        setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));
                        setTimeout(() => {
                            if (isLiveActive && !isAITalking) startContinuousListening();
                        }, 300);
                    }
                    resolve();
                };

                try {
                    const cleanBase64 = (base64Audio || '').replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                    const binaryString = window.atob(cleanBase64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

                    const blob = new Blob([bytes], { type: 'audio/wav' });
                    currentBlobUrl = URL.createObjectURL(blob);

                    if (livePlayer) {
                        livePlayer.muted = false;
                        livePlayer.volume = 1.0;
                        livePlayer.src = currentBlobUrl;
                        livePlayer.onended = finishTurn;
                        livePlayer.onerror = () => playViaWebAudio(bytes, finishTurn);
                        await livePlayer.play();
                    } else {
                        playViaWebAudio(bytes, finishTurn);
                    }
                } catch (err) {
                    try {
                        const cleanBase64 = (base64Audio || '').replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                        const binaryString = window.atob(cleanBase64);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                        playViaWebAudio(bytes, finishTurn);
                    } catch (e2) {
                        finishTurn();
                    }
                }
            });
        }

        async function playViaWebAudio(bytes, onDone) {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) { onDone(); return; }
                if (ctx.state === 'suspended') await ctx.resume();
                ctx.decodeAudioData(bytes.buffer.slice(0), function (buffer) {
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(ctx.destination);
                    currentAudioSource = source;
                    source.onended = onDone;
                    source.start(0);
                }, () => onDone());
            } catch (e) {
                onDone();
            }
        }

        function fallbackBrowserSpeech(text) {
            return new Promise((resolve) => {
                const cleanup = () => {
                    isAITalking = false;
                    if (isLiveActive) {
                        setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'చెప్పండి, వింటున్నాను...'));
                        setTimeout(() => {
                            if (isLiveActive && !isAITalking) startContinuousListening();
                        }, 300);
                    }
                    resolve();
                };

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = { en: 'en-IN', hi: 'hi-IN', ta: 'ta-IN', kn: 'kn-IN' }[currentLanguage] || 'te-IN';
                    isAITalking = true;
                    setLiveState('speaking', 'SPEAKING', `"${text}"`);
                    utterance.onend = cleanup;
                    utterance.onerror = cleanup;
                    window.speechSynthesis.speak(utterance);
                } else {
                    cleanup();
                }
            });
        }
    </script>
