<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Nakshatra AI - Web Chat</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Marked.js for Clean Markdown Output -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --cyan: #00f2fe;
            --purple: #8a2be2;
            --pink: #f857a6;
            --gradient-main: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #9b51e0 80%, #f857a6 100%);
            --gradient-send: linear-gradient(135deg, #4facfe 0%, #8b5cf6 55%, #c084fc 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Sans Telugu', 'Noto Sans Devanagari', 'Noto Sans Tamil', 'Noto Sans Malayalam', 'Noto Sans Kannada', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .continue-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            color: #00f2fe;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .continue-pill-btn:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: rgba(0, 242, 254, 0.6);
            transform: translateY(-1px);
        }

        .continue-pill-btn:active {
            transform: scale(0.97);
        }

        .continue-pill-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Full Viewport Lock to Prevent Keyboard Jumping */
        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #020210;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overscroll-behavior: none;
        }

        body {
            color: #ffffff;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(180deg, rgba(2, 3, 18, 0.65) 0%, rgba(3, 4, 22, 0.78) 100%),
                url('images/nakshatra_bg.png'),
                radial-gradient(circle at 50% 45%, rgba(120, 40, 255, 0.22) 0%, rgba(0, 212, 255, 0.1) 35%, transparent 65%),
                linear-gradient(180deg, #02010a 0%, #050721 50%, #02010e 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.chat-active,
        body.chat-active .main-content,
        body.chat-active .top-bar,
        body.chat-active .bottom-bar {
            background: #000000 !important;
            background-image: none !important;
        }

        body.chat-active .top-bar {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        /* Subtle Error-Only Toast */
        .app-toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 99999;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.94);
            border: 1px solid rgba(248, 113, 113, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            max-width: 90vw;
            text-align: center;
            word-break: break-word;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Top Bar */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            background: rgba(3, 5, 24, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .top-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-brand img {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            border: 1px solid rgba(0, 242, 254, 0.35);
        }

        .top-brand-text {
            font-size: 0.96rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gradient-text {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            display: inline-block;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 0.84rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .top-action-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }

        @media (max-width: 520px) {
            .hide-mobile { display: none; }
            .top-action-btn { padding: 7px 10px; }
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Sidebar Navigation */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            z-index: 99;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            width: 270px;
            max-width: 82vw;
            height: 100vh;
            height: 100dvh;
            background: #06081a;
            border-right: 1px solid rgba(255, 255, 255, 0.09);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
            will-change: transform;
            z-index: 100;
        }

        .sidebar.open { transform: translateX(0); }

        .sidebar-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.02rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-brand img {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            object-fit: cover;
        }

        .close-menu-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .new-chat-btn {
            margin-top: 16px;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.25s;
        }

        .new-chat-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.6);
        }

        .recent-label {
            margin: 20px 8px 8px;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            font-weight: 600;
        }

        .recent-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-item {
            padding: 10px 12px;
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 0.87rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
        }

        .sidebar-bottom {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Main Scrollable View */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        .home-center {
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .center-logo {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: floatGlow 3.2s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        .center-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .home-title {
            font-size: clamp(1.5rem, 4.8vw, 2.15rem);
            font-weight: 700;
            letter-spacing: 0.4px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .home-help-text {
            font-size: clamp(1.2rem, 3.8vw, 1.65rem);
            font-weight: 500;
            color: #e2e8f0;
        }

        /* Chat Messages Container */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 4px 20px;
        }

        .msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
            animation: messageSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }

        .ai-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0, 242, 254, 0.35);
            background: #06081a;
            margin-top: 3px;
        }

        .msg-bubble {
            padding: 11px 16px;
            border-radius: 18px;
            font-size: 0.94rem;
            line-height: 1.6;
            max-width: 85%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .msg-row.ai .msg-bubble {
            background: transparent;
            color: #f1f5f9;
            padding: 3px 2px;
            max-width: calc(100% - 42px);
        }

        .msg-row.user .msg-bubble {
            background: #232327;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px 18px 4px 18px;
        }

        /* Clean Markdown Styling */
        .msg-bubble p { margin-bottom: 10px; line-height: 1.7; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble ul, .msg-bubble ol { margin: 6px 0 10px 22px; padding-left: 4px; }
        .msg-bubble li { margin-bottom: 5px; line-height: 1.65; }
        .msg-bubble li::marker { color: #00f2fe; }
        .msg-bubble h1 { font-size: 1.25rem; font-weight: 700; margin: 14px 0 8px; color: #e2e8f0; }
        .msg-bubble h2 { font-size: 1.12rem; font-weight: 600; margin: 12px 0 6px; color: #cbd5e1; }
        .msg-bubble h3 { font-size: 1.0rem; font-weight: 600; margin: 10px 0 5px; color: #94a3b8; }
        .msg-bubble strong { color: #00f2fe; font-weight: 600; }
        .msg-bubble em { font-style: italic; color: #c4b5fd; }
        .msg-bubble code {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-family: 'Courier New', Courier, monospace;
            color: #f9a8d4;
        }
        .msg-bubble pre {
            background: #0d0d12;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 3px solid #00f2fe;
            padding: 13px 15px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .msg-bubble pre code { background: transparent; border: none; padding: 0; color: #e2e8f0; font-size: 0.84rem; line-height: 1.6; }
        .msg-bubble blockquote {
            border-left: 3px solid #8b5cf6;
            padding: 6px 14px;
            margin: 10px 0;
            background: rgba(139, 92, 246, 0.08);
            border-radius: 0 8px 8px 0;
            color: #c4b5fd;
        }
        .msg-bubble a { color: #38bdf8; text-decoration: underline; text-underline-offset: 3px; }
        .msg-bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.88rem; }
        .msg-bubble th, .msg-bubble td { padding: 8px 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.1); }
        .msg-bubble th { background: rgba(0, 242, 254, 0.08); color: #00f2fe; }
        .msg-bubble>*:first-child { margin-top: 0 !important; }
        .msg-bubble>*:last-child { margin-bottom: 0 !important; }

        /* 3 Dots Loader */
        .ai-dots-loader {
            width: 26px;
            height: 26px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            margin-top: 4px;
            animation: spinOrbit 2s linear infinite;
        }

        .ai-dots-loader span {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: dotJump 0.85s ease-in-out infinite alternate;
        }

        .ai-dots-loader span:nth-child(1) { top: 2px; left: 10px; background: #00f2fe; }
        .ai-dots-loader span:nth-child(2) { bottom: 3px; left: 3px; background: #8b5cf6; }
        .ai-dots-loader span:nth-child(3) { bottom: 3px; right: 3px; background: #f857a6; }

        @keyframes spinOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes dotJump { 0% { transform: translateY(0) scale(0.85); } 100% { transform: translateY(-4px) scale(1.15); } }

        /* Bottom Input Bar */
        .bottom-bar {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
        }

        .chat-box-wrapper {
            width: 100%;
            background: #1c1c20;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 999px;
            padding: 5px 6px 5px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .chat-box-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.26);
        }

        .chat-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.98rem;
            padding: 8px 0;
            line-height: 1.4;
        }

        .chat-input::placeholder { color: #8e96aa; }

        .send-btn,
        .live-toggle-btn {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            touch-action: manipulation;
        }

        .send-btn {
            background: #ffffff;
            color: #000000;
        }

        .send-btn:hover { background: #27d7ff; transform: scale(1.04); }
        .send-btn:active { transform: scale(0.92); }

        .live-toggle-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #8a2be2 100%);
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
        }

        .live-toggle-btn:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(0, 242, 254, 0.6); }
        .live-toggle-btn:active { transform: scale(0.92); }

        /* ===== CLEAN LIVE VOICE MODE MODAL ===== */
        .live-modal {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 42%, #0a0b24 0%, #03030d 65%, #000000 100%);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px calc(26px + env(safe-area-inset-bottom, 0px));
            animation: fadeIn 0.28s ease;
        }

        .live-modal.active { display: flex; }

        .live-header {
            width: 100%;
            max-width: 560px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .live-header-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .live-pulse-dot {
            width: 8px;
            height: 8px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.85); opacity: 0.6; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        .live-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-lang-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #e2e8f0;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .live-lang-pill:hover {
            background: rgba(0, 242, 254, 0.16);
            border-color: rgba(0, 242, 254, 0.45);
            color: #ffffff;
        }

        .live-close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #cbd5e1;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .live-close-btn:hover { background: rgba(255, 255, 255, 0.16); color: #ffffff; }

        /* Center Orb Visualizer */
        .live-orb-container {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

        .live-orb-glow {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.26) 0%, rgba(138, 43, 226, 0.22) 48%, transparent 78%);
            filter: blur(26px);
            animation: orbBreathe 4s ease-in-out infinite alternate;
        }

        .live-orb-core {
            position: relative;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 35%, #8a2be2 70%, #f857a6 100%);
            box-shadow: 0 0 45px rgba(0, 242, 254, 0.5), 0 0 75px rgba(138, 43, 226, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .live-wave {
            position: absolute;
            border: 1.5px solid rgba(0, 242, 254, 0.35);

        function cleanTeluguOutput(text) {
            if (!text || typeof text !== "string") return text;
            let t = text;
            t = t.replace(/^(నక్షత్ర\s*(AI)?|Nakshatra\s*(AI)?|Assistant|AI|Bot)\s*[:：\-–]\s*/i, '');
            t = t.replace(/\b(nenu|nenu\s+super\s+ga)\s+thinava\b/gi, "Ha thinnanu! Meeru thinnara?");
            t = t.replace(/\bbagunav[!.]*/gi, "bagunnanu!");
            t = t.replace(/\bNenu bagundhi\b/gi, "Nenu bagunnanu");
            t = t.replace(/\bcoffee\s+thintunna\w*/gi, "coffee taaguthunna");
            t = t.replace(/\btea\s+thintunna\w*/gi, "tea taaguthunna");
            t = t.replace(/\b(చెప్పండి|చెప్పు|వింటున్నాను|బాగున్నాను|హలో|హాయ్)\s*[,.]*\s*(హా|హ|మరి|సరే)?\s*[,.]*\s*\1\b/giu, '$1');
            t = t.replace(/చెప్పండి,?\s*నేను\s*వింటున్నాను[!.]*/giu, 'ఏం విశేషాలు?');
            t = t.replace(/నేను\s*వింటున్నాను[!.]*/giu, 'చెప్పండి.');
            t = t.replace(/మీ\s*రోజు\s*ఎలా\s*(సాగుతోంది|నడుస్తోంది|ఉంది)\??/giu, 'ఏం విశేషాలు?');
            t = t.replace(/నేను\s*మీకు\s*ఎలా\s*సహాయపడగలను\??/giu, 'ఏం కావాలి?');
            t = t.replace(/\bచెప్పు\s+రా\b/gi, "చెప్పండి");
            t = t.replace(/\s+రా([.,!?]*)$/i, '$1');
            t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1');
            t = t.replace(/(ఆ|ఈ|ఊ|ఏ|ఓ)\1+/gu, '$1');
            t = t.replace(/([ా-ౌ])(ఆ|ఈ|ఊ|ఏ|ఓ)/gu, '$1');
            t = t.replace(/[\u0400-\u04FF\u4E00-\u9FFF\u0600-\u06FF]/g, '');
            t = t.replace(/([a-zA-Z])\1{2,}/g, '$1');
            t = t.replace(/\.{2,}/g, '. ');

            const words = t.split(/\s+/);
            const deduplicated = [];
            for (let i = 0; i < words.length; i++) {
                const curClean = words[i].replace(/[.,!?;:()"'`~]/g, '').toLowerCase();
                const prevClean = (i > 0) ? words[i - 1].replace(/[.,!?;:()"'`~]/g, '').toLowerCase() : '';
                if (curClean && curClean === prevClean) continue;
                deduplicated.push(words[i]);
            }
            let res = deduplicated.join(' ').trim();
            res = res.replace(/[,;:\-\s]+$/, '');
            if (res && !/[.!?]$/.test(res)) res += '.';
            return res.trim();
        }

        function sanitizeForSpeech(text) {

            t = t.replace(/!+/g, '.');
            t = t.replace(/\.{2,}/g, ', ');
            t = t.replace(/[—–\-;]/g, ' ');
            t = t.replace(/\b(చెప్పం|చూడం|చేయం|మాట్లాడం|వినం)డీ+\b/gu, '$1డి');
            t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1');
            t = t.replace(/(ఆ|ఈ|ఊ|ఏ|ఓ)\1+/gu, '$1');
            t = t.replace(/([ా-ౌ])(ఆ|ఈ|ఊ|ఏ|ఓ)/gu, '$1');
            t = t.replace(/(^|\s)(ఆహ్+|ఓహ్+|హమ్మ్+|ఉమ్మ్+|ఆ{2,}|ఓ{2,}|aaa+|ooo+|ahh+|ohh+|umm+|hmm+)(\s|$|[.,!?])/giu, '$1$3');
            return t.replace(/\s+/g, ' ').trim();
        }

        function manageConversationHistory(history, maxTurns = 8) {
            const maxMsgs = maxTurns * 2;
            let trimmed = history.slice(-maxMsgs);
            let assistantCount = 0;
            for (let i = trimmed.length - 1; i >= 0; i--) {
                if (trimmed[i].role === "assistant") {
                    assistantCount++;
                    if (assistantCount > 2) {
                        const sentences = trimmed[i].content.match(/[^.!?।]+[.!?।]+|[^.!?।]+$/g) || [trimmed[i].content];
                        if (sentences.length > 3) {
                            trimmed[i].content = sentences.slice(0, 3).join(" ").trim() + "...";
                        }
                    }
                }
            }
            return trimmed;
        }

        function mergeContinuationText(original, continuation, maxOverlap = 80) {
            if (!continuation) return original;
            const o = original.trimEnd();
            const c = continuation.trimStart();
            for (let len = Math.min(maxOverlap, o.length, c.length); len > 3; len--) {
                const endSlice = o.slice(-len);
                const startSlice = c.slice(0, len);
                if (endSlice === startSlice) {
                    return o + c.slice(len);
                }
            }
            return o + " " + c;
        }

        function isReplyCutOff(text) {
            if (!text || typeof text !== "string") return false;
            const t = text.trim();
            if (t.endsWith("```")) return false;
            return !/[.?!।]$/.test(t);
        }

        function ensurePlaybackUnlocked() {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                if (!keepAliveOsc) {
                    keepAliveOsc = ctx.createOscillator();
                    keepAliveGain = ctx.createGain();
                    keepAliveGain.gain.value = 0.00001;
                    keepAliveOsc.connect(keepAliveGain);
                    keepAliveGain.connect(ctx.destination);
                    keepAliveOsc.start();
                }
            } catch (e) {}
        }

        function encodePCMToWav16k(chunks, inputSampleRate) {
            let totalLen = 0;
            for (let i = 0; i < chunks.length; i++) totalLen += chunks[i].length;
            const merged = new Float32Array(totalLen);
            let offset = 0;
            for (let i = 0; i < chunks.length; i++) {
                merged.set(chunks[i], offset);
                offset += chunks[i].length;
            }

            const targetRate = 16000;
            let samples;
            if (inputSampleRate === targetRate) {
                samples = merged;
            } else {
                const ratio = inputSampleRate / targetRate;
                const newLength = Math.max(1, Math.round(merged.length / ratio));
                samples = new Float32Array(newLength);
                let offsetResult = 0;
                let offsetBuffer = 0;
                while (offsetResult < newLength) {
                    const nextOffsetBuffer = Math.min(merged.length, Math.round((offsetResult + 1) * ratio));
                    let accum = 0, count = 0;
                    for (let i = offsetBuffer; i < nextOffsetBuffer; i++) {
                        accum += merged[i];
                        count++;
                    }
                    samples[offsetResult] = count > 0 ? accum / count : 0;
                    offsetResult++;
                    offsetBuffer = nextOffsetBuffer;
                }
            }

            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeStr = (pos, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(pos + i, str.charCodeAt(i));
            };

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true);
            view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, samples.length * 2, true);

            let idx = 44;
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                idx += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

            if (micSourceNode) {

            liveModal.classList.remove('active');
            stopAudioPlayback();
            teardownWavRecorder();
            if (mediaStream) {
                try { mediaStream.getTracks().forEach(track => track.stop()); } catch (e) {}
                mediaStream = null;
            }
            if (keepAliveOsc) {
                try { keepAliveOsc.stop(); } catch (e) {}

        function stopAudioPlayback() {

            if (livePlayer) {
                try {
                    livePlayer.pause();
                    livePlayer.currentTime = 0;
                    livePlayer.onended = null;
                    livePlayer.onerror = null;
                } catch (e) {}
            }
            if (currentBlobUrl) {
                try { URL.revokeObjectURL(currentBlobUrl); } catch (e) {}
                currentBlobUrl = null;
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isAITalking = false;
        }

        async function startContinuousListening() {
            if (!isLiveActive || isAITalking) return;

            isProcessingTurn = false;
            pcmChunks = [];
            preSpeechBuffer = [];
            speechStarted = false;
            lastSpeechTime = 0;
            speechStartTime = 0;

            if (!mediaStream || mediaStream.getTracks().every(t => t.readyState === 'ended')) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                } catch (err) {
                    showErrorToast("Microphone permission denied.");
                    setLiveState('listening', 'MIC BLOCKED', 'Please allow microphone access.');
                    return;
                }
            } else {
                mediaStream.getAudioTracks().forEach(track => { track.enabled = true; });
            }

            if (!recorderCtx || recorderCtx.state === 'closed') {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                recorderCtx = new AudioContextClass();
                micSourceNode = recorderCtx.createMediaStreamSource(mediaStream);
                processorNode = recorderCtx.createScriptProcessor(4096, 1, 1);
                silentGainNode = recorderCtx.createGain();
                silentGainNode.gain.value = 0;

                micSourceNode.connect(processorNode);
                processorNode.connect(silentGainNode);
                silentGainNode.connect(recorderCtx.destination);
            } else if (recorderCtx.state === 'suspended') {
                await recorderCtx.resume().catch(() => {});
            }

            setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'ఏంటి విశేషాలు?'));

            processorNode.onaudioprocess = (event) => {
                if (!isLiveActive || isAITalking || isProcessingTurn) return;

                const input = event.inputBuffer.getChannelData(0);
                const copy = new Float32Array(input.length);
                copy.set(input);

                let sum = 0;
                for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                const rms = Math.sqrt(sum / copy.length);
                const now = Date.now();

                if (rms > RMS_THRESHOLD) {
                    if (!speechStarted) {
                        speechStarted = true;
                        speechStartTime = now;
                        pcmChunks = [...preSpeechBuffer];
                        preSpeechBuffer = [];
                        setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'వింటున్నాను...'));
                    }
                    lastSpeechTime = now;
                    pcmChunks.push(copy);
                } else if (speechStarted) {
                    pcmChunks.push(copy);
                    if ((now - lastSpeechTime > SILENCE_TIMEOUT_MS) || (now - speechStartTime > MAX_TURN_MS)) {
                        isProcessingTurn = true;
                        const captured = pcmChunks;
                        const sampleRate = recorderCtx.sampleRate;
                        pcmChunks = [];
                        speechStarted = false;

                        const durationSec = (captured.length * 4096) / sampleRate;
                        if (durationSec < 0.25) {
                            isProcessingTurn = false;
                            return;
                        }

                        const wavBlob = encodePCMToWav16k(captured, sampleRate);
                        processWavWithSTT(wavBlob);
                    }
                } else {
                    preSpeechBuffer.push(copy);
                    if (preSpeechBuffer.length > 4) preSpeechBuffer.shift();
                }
            };
        }

        async function callSarvamSTT(wavBlob, modelName, langCode) {
            const formData = new FormData();
            formData.append('file', wavBlob, 'recording.wav');

            formData.append('language_code', langCode);

            const res = await fetch(SARVAM_STT_URL, { method: 'POST', body: formData });
            if (!res.ok) {
                const errTxt = await res.text();
                throw new Error(`Sarvam ${res.status}: ${errTxt.slice(0, 80)}`);
            }
            return await res.json();
        }

        async function processWavWithSTT(wavBlob) {
            setLiveState('thinking', 'THINKING', (currentLanguage === 'en' ? 'Thinking...' : 'ఆలోచిస్తున్నాను...'));

                    const sttRes = await fetch(GROQ_STT_URL, { method: 'POST', body: formData });

                    const sttData = await sttRes.json();
                    transcript = (sttData.text || '').trim();
                } else {

                    const langParam = liveLangMode === 'te' ? 'te-IN' : 'unknown';
                    try {

                        sttData = await callSarvamSTT(wavBlob, 'saarika:v2.5', 'te-IN');
                    }

                    transcript = (sttData.transcript || sttData.text || '').trim();

                const noiseHallucinations = /^(thank you\.?|thanks for watching\.?|subtitles by.*|you\.?|\.+|\s*)$/i;
                if (!transcript || noiseHallucinations.test(transcript)) {
                    if (isLiveActive && !isAITalking) {

                const detected = detectLanguage(transcript, true);
                if (detected) currentLanguage = detected;

                await processLiveUserVoice(transcript);
            } catch (err) {

                showErrorToast(`Voice Error: ${err.message}`, 4500);
                if (isLiveActive && !isAITalking) {

                }

        }

                targetLang = "ml-IN";
                speakerName = "sangeetha_ml_conversational";
            } else if (currentLanguage === 'kn' || /[\u0C80-\u0CFF]/.test(cleanSpeechText)) {
                targetLang = "kn-IN";
                speakerName = "chaitra_kn_conversation";
            }

            try {
                ensurePlaybackUnlocked();

                const ttsResponse = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: cleanSpeechText,
                        target_language_code: targetLang,
                        model: ttsModel,
                        speaker: speakerName,
                        pace: 1.05,
                        speech_sample_rate: 24000,
                        output_audio_codec: "wav"
                    })
                });

                if (!ttsResponse.ok) {
                    await fallbackTTSBulbulV3(cleanSpeechText, targetLang, cleanSpeechText);
                    return;
                }

                const ttsData = await ttsResponse.json();
                const audioBase64 = (ttsData.audios && ttsData.audios[0]) || ttsData.audio || ttsData.audio_content;
                if (audioBase64) {
                    await playAudioFromBase64(audioBase64, cleanSpeechText);
                } else {
                    await fallbackTTSBulbulV3(cleanSpeechText, targetLang, cleanSpeechText);
                }
            } catch (ttsErr) {
                await fallbackBrowserSpeech(cleanSpeechText);
            }
        }

        async function fallbackTTSBulbulV3(cleanSpeechText, targetLang, originalText) {
            if (!isLiveActive) return;
            try {
                const fallbackSpeaker = targetLang === "en-IN" ? "simran"
                    : targetLang === "hi-IN" ? "kavya"
                    : "kavitha";

                const ttsResponse = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: cleanSpeechText,
                        target_language_code: targetLang,
                        model: "bulbul:v3",
                        speaker: fallbackSpeaker,
                        pace: 1.05,
                        speech_sample_rate: 24000,
                        output_audio_codec: "wav"
                    })
                });

                if (!ttsResponse.ok) {
                    await fallbackBrowserSpeech(cleanSpeechText);
                    return;
                }
                const ttsData = await ttsResponse.json();
                const audioBase64 = (ttsData.audios && ttsData.audios[0]) || ttsData.audio || ttsData.audio_content;
                if (audioBase64) {
                    await playAudioFromBase64(audioBase64, originalText);
                } else {
                    await fallbackBrowserSpeech(cleanSpeechText);
                }
            } catch (e) {
                await fallbackBrowserSpeech(cleanSpeechText);
            }
        }

        function playAudioFromBase64(base64Audio, displayText) {
            return new Promise(async (resolve) => {
                stopAudioPlayback();
                isAITalking = true;
                setLiveState('speaking', 'SPEAKING', `"${displayText}"`);

                if (mediaStream) {
                    try { mediaStream.getAudioTracks().forEach(t => { t.enabled = false; }); } catch (e) {}
                }

                // Suspend mic AudioContext while AI speaks so playback never stutters
                if (recorderCtx && recorderCtx.state === 'running') {
                    recorderCtx.suspend().catch(() => {});
                }

                let finished = false;
                const finishTurn = () => {
                    if (finished) return;
                    finished = true;
                    isAITalking = false;
                    currentAudioSource = null;

                    if (currentBlobUrl) {
                        try { URL.revokeObjectURL(currentBlobUrl); } catch (e) {}
                        currentBlobUrl = null;
                    }

                    if (isLiveActive) {
                        setTimeout(() => {
                            if (isLiveActive && !isAITalking) startContinuousListening();
                        }, 300);
                    }
                    resolve();
                };

                try {
                    const cleanBase64 = (base64Audio || '').replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                    const binaryString = window.atob(cleanBase64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

                    const blob = new Blob([bytes], { type: 'audio/wav' });
                    currentBlobUrl = URL.createObjectURL(blob);

                    if (livePlayer) {
                        livePlayer.muted = false;
                        livePlayer.volume = 1.0;
                        livePlayer.src = currentBlobUrl;
                        livePlayer.onended = finishTurn;
                        livePlayer.onerror = () => playViaWebAudio(bytes, finishTurn);
                        await livePlayer.play();
                    } else {
                        playViaWebAudio(bytes, finishTurn);
                    }
                } catch (err) {
                    try {
                        const cleanBase64 = (base64Audio || '').replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                        const binaryString = window.atob(cleanBase64);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                        playViaWebAudio(bytes, finishTurn);
                    } catch (e2) {
                        finishTurn();
                    }
                }
            });
        }

        async function playViaWebAudio(bytes, onDone) {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) { onDone(); return; }
                if (ctx.state === 'suspended') await ctx.resume();
                ctx.decodeAudioData(bytes.buffer.slice(0), function (buffer) {
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(ctx.destination);
                    currentAudioSource = source;
                    source.onended = onDone;
                    source.start(0);
                }, () => onDone());
            } catch (e) {
                onDone();
            }
        }

        function fallbackBrowserSpeech(text) {
            return new Promise((resolve) => {
                const cleanup = () => {
                    isAITalking = false;
                    if (isLiveActive) {
                        setTimeout(() => {
                            if (isLiveActive && !isAITalking) startContinuousListening();
                        }, 300);
                    }
                    resolve();
                };

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = { en: 'en-IN', hi: 'hi-IN', ta: 'ta-IN', kn: 'kn-IN' }[currentLanguage] || 'te-IN';
                    isAITalking = true;
                    setLiveState('speaking', 'SPEAKING', `"${text}"`);
                    utterance.onend = cleanup;
                    utterance.onerror = cleanup;
                    window.speechSynthesis.speak(utterance);
                } else {
                    cleanup();
                }
            });
        }
    </script>
