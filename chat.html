        function ensurePlaybackUnlocked() {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                if (!keepAliveOsc) {
                    keepAliveOsc = ctx.createOscillator();
                    keepAliveGain = ctx.createGain();
                    keepAliveGain.gain.value = 0.00001;
                    keepAliveOsc.connect(keepAliveGain);
                    keepAliveGain.connect(ctx.destination);
                    keepAliveOsc.start();
                }
            } catch (e) {}
        }

        function encodePCMToWav16k(chunks, inputSampleRate) {
            let totalLen = chunks.reduce((a, c) => a + c.length, 0);
            const merged = new Float32Array(totalLen);
            let offset = 0;
            for (const c of chunks) { merged.set(c, offset); offset += c.length; }

            const targetRate = 16000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.max(1, Math.round(merged.length / ratio));
            const samples = new Float32Array(newLength);
            for (let i = 0; i < newLength; i++) {
                const start = Math.round(i * ratio);
                const end = Math.min(merged.length, Math.round((i + 1) * ratio));
                let sum = 0;
                for (let j = start; j < end; j++) sum += merged[j];
                samples[i] = end > start ? sum / (end - start) : 0;
            }

            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeStr = (p, s) => { for (let i = 0; i < s.length; i++) view.setUint8(p + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
            writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true); view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
            let idx = 44;
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                idx += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        // ===== SPEECH-TO-TEXT DICTATION (CHAT INPUT MIC) =====
        let isDictating = false, isTranscribingDictation = false, dictateSessionId = 0;
        let dictateStream = null, dictateCtx = null, dictateSource = null, dictateProcessor = null, dictateGain = null;
        let dictateChunks = [], dictateSpeechStarted = false;
        let dictateStartTime = 0, dictateLastSpeechTime = 0, dictateSpeechStartTime = 0;
        let dictateRecognition = null;

        function setDictationUIState(state) {
            if (!micToggleBtn) return;
            micToggleBtn.classList.remove('listening', 'transcribing');
            micToggleBtn.disabled = state === 'transcribing';
            if (state === 'listening') {
                micToggleBtn.classList.add('listening');
                micToggleBtn.title = 'Stop Listening';
                micToggleBtn.setAttribute('aria-label', 'Stop Listening');
                chatInput.placeholder = 'Listening... Tap mic to finish';
            } else if (state === 'transcribing') {
                micToggleBtn.classList.add('transcribing');
                micToggleBtn.title = 'Transcribing...';
                micToggleBtn.setAttribute('aria-label', 'Transcribing...');
                chatInput.placeholder = 'Transcribing...';
            } else {
                micToggleBtn.title = 'Speech to Text';
                micToggleBtn.setAttribute('aria-label', 'Speech to Text');
                chatInput.placeholder = 'Ask Nakshatra AI...';
            }
        }

        function releaseDictationAudio() {
            try { dictateProcessor?.disconnect(); dictateSource?.disconnect(); dictateGain?.disconnect(); dictateCtx?.close(); } catch (e) {}
            dictateProcessor = dictateSource = dictateGain = dictateCtx = null;
            if (dictateStream) {
                dictateStream.getTracks().forEach(t => t.stop());
                dictateStream = null;
            }
            if (dictateRecognition) {
                try { dictateRecognition.abort(); } catch (e) {}
                dictateRecognition = null;
            }
        }

        function cancelVoiceDictation() {
            dictateSessionId++;
            isDictating = false;
            isTranscribingDictation = false;
            dictateChunks = [];
            dictateSpeechStarted = false;
            releaseDictationAudio();
            setDictationUIState('idle');
        }

        function appendDictatedTextToInput(transcript) {
            const clean = String(transcript || '').trim();
            if (!clean) return false;
            const existing = chatInput.value;
            const needsSpace = existing.length > 0 && !/\s$/.test(existing);
            chatInput.value = existing + (needsSpace ? ' ' : '') + clean;
            const detected = detectLanguage(chatInput.value, false);
            if (detected) currentLanguage = detected;
            handleInputChange();
            chatInput.focus();
            chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
            return true;
        }

        async function fetchSTTTranscript(wavBlob, mode = 'auto', allowFallback = false, signal = null) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 14000);
            const onAbort = () => controller.abort();
            if (signal) {
                if (signal.aborted) controller.abort();
                else signal.addEventListener('abort', onAbort, { once: true });
            }
            const cleanWhisperHallucination = (txt) => {
                const t = (txt || '').trim();
                if (!t) return '';
                if (/^(thank you|thanks|thanks for watching|bye|you|subtitle[s]?|amara\.org)[.!\s]*$/i.test(t) && wavBlob.size < 22000) return '';
                return t;
            };
            try {
                if (mode === 'en') {
                    const fd = new FormData();
                    fd.append('file', wavBlob, 'recording.wav');
                    fd.append('model', 'whisper-large-v3-turbo');
                    fd.append('language', 'en');
                    const res = await fetch(GROQ_STT_URL, { method: 'POST', body: fd, signal: controller.signal });
                    if (!res.ok) throw new Error(`STT HTTP ${res.status}`);
                    return cleanWhisperHallucination((await res.json()).text);
                }

                const fd = new FormData();
                fd.append('file', wavBlob, 'recording.wav');
                fd.append('model', 'saaras:v3');
                fd.append('language_code', mode === 'te' ? 'te-IN' : 'unknown');
                const res = await fetch(SARVAM_STT_URL, { method: 'POST', body: fd, signal: controller.signal });
                if (res.ok) {
                    const data = await res.json();
                    const txt = (data.transcript || data.text || '').trim();
                    if (txt || !allowFallback) return txt;
                } else if (!allowFallback) {
                    throw new Error(`STT HTTP ${res.status}`);
                }

                const fallbackFd = new FormData();
                fallbackFd.append('file', wavBlob, 'recording.wav');
                fallbackFd.append('model', 'whisper-large-v3-turbo');
                const fbRes = await fetch(GROQ_STT_URL, { method: 'POST', body: fallbackFd, signal: controller.signal });
                if (!fbRes.ok) throw new Error(`STT HTTP ${fbRes.status}`);
                return cleanWhisperHallucination((await fbRes.json()).text);
            } finally {
                clearTimeout(timeoutId);
                if (signal) signal.removeEventListener('abort', onAbort);
            }
        }

        async function finishVoiceDictation(manualStop = false) {
            if (!isDictating) return;
            const session = dictateSessionId;
            isDictating = false;

            const captured = [...dictateChunks];
            const sr = dictateCtx?.sampleRate || 16000;
            const hadSpeech = dictateSpeechStarted;
            const durationSec = (captured.length * 4096) / sr;

            dictateChunks = [];
            dictateSpeechStarted = false;
            releaseDictationAudio();

            if (!captured.length || durationSec < 0.3 || (!hadSpeech && !manualStop)) {
                setDictationUIState('idle');
                if (manualStop) showErrorToast("No speech detected. Try speaking closer to the mic.");
                return;
            }

            isTranscribingDictation = true;
            setDictationUIState('transcribing');
            try {
                const wavBlob = encodePCMToWav16k(captured, sr);
                const transcript = await fetchSTTTranscript(wavBlob, 'auto', true);
                if (session !== dictateSessionId) return;
                if (!appendDictatedTextToInput(transcript)) {
                    showErrorToast("Didn't catch that. Please try speaking again.");
                }
            } catch (err) {
                if (session !== dictateSessionId) return;
                showErrorToast(err?.name === 'AbortError' ? "Speech recognition timed out." : "Speech-to-text error. Please try again.");
            } finally {
                if (session === dictateSessionId) {
                    isTranscribingDictation = false;
                    setDictationUIState('idle');
                }
            }
        }

        function startBrowserSpeechFallback(session) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                showErrorToast("Microphone is not supported in this browser.");
                cancelVoiceDictation();
                return;
            }
            const rec = new SR();
            dictateRecognition = rec;
            rec.lang = currentLanguage === 'te' ? 'te-IN' : currentLanguage === 'hi' ? 'hi-IN' : 'en-IN';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            let gotResult = false;
            rec.onresult = (event) => {
                if (session !== dictateSessionId) return;
                const transcript = Array.from(event.results || []).map(r => r[0]?.transcript || '').join(' ').trim();
                if (appendDictatedTextToInput(transcript)) gotResult = true;
            };
            rec.onerror = () => {
                if (session !== dictateSessionId) return;
                showErrorToast("Microphone permission denied or unavailable.");
                cancelVoiceDictation();
            };
            rec.onend = () => {
                if (session !== dictateSessionId) return;
                isDictating = false;
                dictateRecognition = null;
                setDictationUIState('idle');
                if (!gotResult) showErrorToast("No speech detected. Please try again.");
            };
            try {
                rec.start();
            } catch (err) {
                showErrorToast("Unable to start speech recognition.");
                cancelVoiceDictation();
            }
        }

        async function toggleVoiceDictation() {
            if (isTranscribingDictation) return;
            if (isDictating) {
                if (dictateRecognition) {
                    try { dictateRecognition.stop(); } catch (e) { cancelVoiceDictation(); }
                } else {
                    await finishVoiceDictation(true);
                }
                return;
            }
            if (isLiveActive) closeLiveMode();

            const session = ++dictateSessionId;
            isDictating = true;
            dictateChunks = [];
            dictateSpeechStarted = false;
            dictateStartTime = Date.now();
            setDictationUIState('listening');

            if (!navigator.mediaDevices?.getUserMedia) {
                startBrowserSpeechFallback(session);
                return;
            }

            try {
                dictateStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                if (session !== dictateSessionId) {
                    dictateStream.getTracks().forEach(t => t.stop());
                    dictateStream = null;
                    return;
                }
                const AC = window.AudioContext || window.webkitAudioContext;
                dictateCtx = new AC();
                if (dictateCtx.state === 'suspended') await dictateCtx.resume().catch(() => {});
                dictateSource = dictateCtx.createMediaStreamSource(dictateStream);
                dictateProcessor = dictateCtx.createScriptProcessor(4096, 1, 1);
                dictateGain = dictateCtx.createGain();
                dictateGain.gain.value = 0;
                dictateSource.connect(dictateProcessor);
                dictateProcessor.connect(dictateGain);
                dictateGain.connect(dictateCtx.destination);

                dictateProcessor.onaudioprocess = (event) => {
                    if (!isDictating || session !== dictateSessionId) return;
                    const copy = new Float32Array(event.inputBuffer.getChannelData(0));
                    let sum = 0;
                    for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                    const rms = Math.sqrt(sum / copy.length);
                    const now = Date.now();

                    dictateChunks.push(copy);
                    if (rms > 0.012) {
                        if (!dictateSpeechStarted) {
                            dictateSpeechStarted = true;
                            dictateSpeechStartTime = now;
                        }
                        dictateLastSpeechTime = now;
                    } else if (dictateSpeechStarted) {
                        if ((now - dictateLastSpeechTime > 1600) || (now - dictateSpeechStartTime > 30000)) {
                            finishVoiceDictation(false);
                        }
                    } else if (now - dictateStartTime > 20000) {
                        finishVoiceDictation(false);
                    }
                };
            } catch (err) {
                if (session !== dictateSessionId) return;
                showErrorToast("Microphone permission denied.");
                cancelVoiceDictation();
            }
        }

        async function openLiveMode() {
            cancelVoiceDictation();
            ensurePlaybackUnlocked();
            fetch(`${WORKER_BASE}/health`).catch(() => {});
            isLiveActive = true; isAITalking = false; isProcessingTurn = false;
            liveModal.classList.add('active');
            setLiveState('listening', 'CONNECTING...', currentLanguage === 'en' ? 'Connecting...' : 'కనెక్ట్ అవుతోంది...');
            await startContinuousListening();
        }

        function closeLiveMode() {
            isLiveActive = false; isProcessingTurn = false;
            if (liveTurnAbortCtrl) { try { liveTurnAbortCtrl.abort(); } catch (e) {} liveTurnAbortCtrl = null; }
            liveModal.classList.remove('active');
            stopAudioPlayback();
            try { processorNode?.disconnect(); micSourceNode?.disconnect(); silentGainNode?.disconnect(); recorderCtx?.close(); } catch (e) {}
            processorNode = micSourceNode = silentGainNode = recorderCtx = null;
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        }

        function handleOrbTap() {
            const orb = document.getElementById('liveOrbCore');
            if (orb) {
                orb.classList.remove('tap-blink');
                void orb.offsetWidth;
                orb.classList.add('tap-blink');
                setTimeout(() => orb.classList.remove('tap-blink'), 260);
            }
            interruptAI();
        }

        function interruptAI() {
            if (isAITalking || isProcessingTurn) {
                if (liveTurnAbortCtrl) { try { liveTurnAbortCtrl.abort(); } catch (e) {} liveTurnAbortCtrl = null; }
                stopAudioPlayback();
                isProcessingTurn = false;
                startContinuousListening();
            }
        }

        function stopOrbVoicePulse() {
            if (livePulseRafId) { cancelAnimationFrame(livePulseRafId); livePulseRafId = null; }
            const glow = document.querySelector('.live-orb-glow');
            if (glow) { glow.style.transform = ''; glow.style.opacity = ''; }
        }

        function startOrbVoicePulse(analyser) {
            stopOrbVoicePulse();
            const glow = document.querySelector('.live-orb-glow');
            if (!analyser || !glow) return;
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
                if (!isAITalking || !isLiveActive) { stopOrbVoicePulse(); return; }
                analyser.getByteTimeDomainData(buf);
                let sum = 0;
                for (let i = 0; i < buf.length; i++) {
                    const v = (buf[i] - 128) / 128;
                    sum += v * v;
                }
                const rms = Math.min(1, Math.sqrt(sum / buf.length) * 3.4);
                glow.style.transform = `scale(${(1.12 + rms * 0.28).toFixed(3)})`;
                glow.style.opacity = `${(0.86 + rms * 0.14).toFixed(3)}`;
                livePulseRafId = requestAnimationFrame(tick);
            };
            livePulseRafId = requestAnimationFrame(tick);
        }

        function stopAudioPlayback() {
            livePlaybackSession++;
            stopOrbVoicePulse();
            if (activeAudioSources.length) {
                for (const src of activeAudioSources) {
                    try { src.onended = null; src.stop(); src.disconnect(); } catch (e) {}
                }
                activeAudioSources = [];
            }
            try { currentAudioSource?.stop(); } catch (e) {}
            currentAudioSource = null;
            if (livePlayer) { livePlayer.pause(); livePlayer.currentTime = 0; livePlayer.onended = null; livePlayer.onerror = null; }
            if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isAITalking = false;
        }

        async function startContinuousListening() {
            if (!isLiveActive || isAITalking) return;
            isProcessingTurn = false; pcmChunks = []; preSpeechBuffer = []; speechStarted = false;
            activeSpeechFrames = 0; lastSpeechChunkIdx = 0;

            if (!mediaStream || mediaStream.getTracks().every(t => t.readyState === 'ended')) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                } catch (err) {
                    showErrorToast("Microphone permission denied.");
                    setLiveState('listening', 'MIC BLOCKED', 'Please allow microphone access.');
                    return;
                }
            } else {
                mediaStream.getAudioTracks().forEach(t => t.enabled = true);
            }

            if (!recorderCtx || recorderCtx.state === 'closed') {
                const AC = window.AudioContext || window.webkitAudioContext;
                recorderCtx = new AC();
                micSourceNode = recorderCtx.createMediaStreamSource(mediaStream);
                processorNode = recorderCtx.createScriptProcessor(2048, 1, 1);
                silentGainNode = recorderCtx.createGain();
                silentGainNode.gain.value = 0;
                micSourceNode.connect(processorNode);
                processorNode.connect(silentGainNode);
                silentGainNode.connect(recorderCtx.destination);
            } else if (recorderCtx.state === 'suspended') {
                await recorderCtx.resume().catch(() => {});
            }

            setLiveState('listening', 'LISTENING', currentLanguage === 'en' ? 'Listening...' : 'ఏంటి విశేషాలు?');

            processorNode.onaudioprocess = (event) => {
                if (!isLiveActive || isAITalking || isProcessingTurn) return;
                const copy = new Float32Array(event.inputBuffer.getChannelData(0));
                let sum = 0;
                for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                const rms = Math.sqrt(sum / copy.length);
                const now = Date.now();
                const threshold = Math.max(0.014, Math.min(0.032, liveNoiseFloor * 2.4));

                if (rms > threshold) {
                    if (!speechStarted) {
                        speechStarted = true; speechStartTime = now;
                        activeSpeechFrames = 0;
                        pcmChunks = [...preSpeechBuffer]; preSpeechBuffer = [];
                        setLiveState('listening', 'LISTENING', currentLanguage === 'en' ? 'Listening...' : 'వింటున్నాను...');
                    }
                    activeSpeechFrames++;
                    lastSpeechTime = now;
                    pcmChunks.push(copy);
                    lastSpeechChunkIdx = pcmChunks.length;
                } else if (speechStarted) {
                    pcmChunks.push(copy);
                    const speechDur = now - speechStartTime;
                    const silenceHangMs = speechDur < 2200 ? 450 : 560;
                    if ((now - lastSpeechTime > silenceHangMs) || (speechDur > 12000)) {
                        isProcessingTurn = true;
                        const trimEnd = Math.min(pcmChunks.length, lastSpeechChunkIdx + 3);
                        const captured = pcmChunks.slice(0, Math.max(1, trimEnd));
                        const sr = recorderCtx.sampleRate;
                        const voicedFrames = activeSpeechFrames;
                        pcmChunks = []; speechStarted = false; activeSpeechFrames = 0;
                        const totalDurSec = captured.reduce((a, c) => a + c.length, 0) / sr;
                        if (totalDurSec < 0.24 || voicedFrames < 3) { isProcessingTurn = false; return; }
                        processWavWithSTT(encodePCMToWav16k(captured, sr));
                    }
                } else {
                    liveNoiseFloor = liveNoiseFloor * 0.92 + rms * 0.08;
                    preSpeechBuffer.push(copy);
                    if (preSpeechBuffer.length > 6) preSpeechBuffer.shift();
                }
            };
        }

        async function processWavWithSTT(wavBlob) {
            if (!isLiveActive) return;
            if (liveTurnAbortCtrl) { try { liveTurnAbortCtrl.abort(); } catch (e) {} }
            liveTurnAbortCtrl = new AbortController();
            const signal = liveTurnAbortCtrl.signal;
            setLiveState('thinking', 'THINKING', currentLanguage === 'en' ? 'Thinking...' : 'ఆలోచిస్తున్నాను...');
            try {
                const sttT0 = performance.now();
                const transcript = await fetchSTTTranscript(wavBlob, liveLangMode, false, signal);
                console.log(`[Live] STT: ${(performance.now() - sttT0).toFixed(0)}ms`);
                if (signal.aborted || !isLiveActive) return;
                if (!transcript) { startContinuousListening(); return; }
                currentLanguage = detectLanguage(transcript, true);
                await processLiveUserVoice(transcript, signal);
            } catch (err) {
                if (err?.name === 'AbortError' || !isLiveActive) return;
                showErrorToast("Voice error. Retrying...");
                if (isLiveActive) setTimeout(startContinuousListening, 700);
            }
        }

        async function callLiveChatModel(model, effort, maxTokens, systemPrompt, historyMsgs, signal) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal,
                body: JSON.stringify({
                    model,
                    mode: "live",
                    reasoning_effort: effort,
                    temperature: 0.68,
                    max_tokens: maxTokens,
                    messages: [
                        { role: "system", content: systemPrompt },
                        ...getFewShotExamples(currentLanguage, 'live'),
                        ...historyMsgs
                    ]
                })
            });
            if (!res.ok) {
                const errBody = await res.json().catch(() => null);
                throw new Error(errBody?.error || `HTTP ${res.status}`);
            }
            const data = await res.json();
            return cleanTeluguOutput(data.response || data.choices?.[0]?.message?.content || "");
        }

        async function processLiveUserVoice(userVoiceText, signal = null) {
            const roundTripT0 = performance.now();
            setLiveState('thinking', 'THINKING', `"${userVoiceText}"`);
            conversationHistory.push({ role: "user", content: userVoiceText });
            document.body.classList.add('chat-active');
            handleInputChange();
            homeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            appendUserMessage(userVoiceText);

            const liveSystemPrompt = [
                "You are Nakshatra AI on a real-time phone call — speak like a warm, genuine human friend, never robotic.",
                "",
                "SPOKEN CALL RULES:",
                "- Reply in 1 to 2 short spoken sentences max (~10-28 words). Keep it punchy and conversational.",
                "- Sound human: use natural contractions (I'm, you're, that's, don't), commas/dashes for natural breath pauses, and gentle reactions when fitting ('Oh nice!', 'Aww man,', 'Honestly,', 'అయ్యో!', 'హేయ్ సూపర్!', 'చూడండి,').",
                "- Match user energy (upbeat when excited, gentle/empathetic when tired or stressed, crisp when curious).",
                "- For casual Telugu greetings, NEVER say robot phrases like 'సహాయం కావాలా?' or start with 'అవునా' — say 'హేయ్! నేను సూపర్, మీరు ఎలా ఉన్నారు?' or 'హాయ్! చెప్పండి, ఏంటి విశేషాలు?'.",
                "- Use respectful everyday spoken Telugu (మీరు), Hindi (आप), or English — avoid stiff textbook words.",
                "- NEVER use markdown, asterisks, bullets, headings, emojis, code, or raw URLs.",
                `- ${getLangDirective(currentLanguage)}`
            ].join("\n");

            const turnHistory = conversationHistory.slice(-4);
            try {
                const llmT0 = performance.now();
                let aiText = await callLiveChatModel("qwen/qwen3.8-27b", "none", 280, liveSystemPrompt, turnHistory, signal).catch(() => "");
                if (!aiText && !(signal && signal.aborted)) {
                    aiText = await callLiveChatModel("openai/gpt-oss-120b", "low", 550, liveSystemPrompt, turnHistory, signal);
                }
                if ((signal && signal.aborted) || !isLiveActive) return;
                if (!aiText) aiText = currentLanguage === 'en' ? "Hey, say that again?" : "మళ్ళీ ఒకసారి చెప్తారా అండి?";

                console.log(`[Live] LLM: ${(performance.now() - llmT0).toFixed(0)}ms`);
                conversationHistory.push({ role: "assistant", content: aiText });
                const aiRow = createAIMessageRow(renderMarkdownClean(aiText));
                attachAIMessageActions(aiRow);
                chatContainer.appendChild(aiRow);
                scrollToBottom();
                console.log(`[Live] STT+LLM total before TTS: ${(performance.now() - roundTripT0).toFixed(0)}ms`);
                await speakAIResponse(aiText, signal);
            } catch (err) {
                if (err?.name === 'AbortError' || !isLiveActive) return;
                console.warn('[Live] LLM error:', err);
                if (isLiveActive) setTimeout(startContinuousListening, 700);
            }
        }

        function base64ToArrayBuffer(b64) {
            const clean = b64.replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
            const bin = window.atob(clean);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }

        async function fetchTtsChunkAudio(chunkText, targetLang, speaker, preferElevenLabs, signal) {
            if (preferElevenLabs) {
                try {
                    const elRes = await fetch(`${ELEVENLABS_TTS_URL}?voice_id=cgSgspJ2msm6clMCkdW9`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal,
                        body: JSON.stringify({
                            text: chunkText,
                            model_id: "eleven_turbo_v2_5",
                            output_format: "mp3_22050_32",
                            voice_settings: {
                                stability: 0.36,
                                similarity_boost: 0.78,
                                style: 0.30,
                                use_speaker_boost: true,
                                speed: 1.02
                            }
                        })
                    });
                    if (elRes.ok) {
                        const buf = await elRes.arrayBuffer();
                        if (buf && buf.byteLength > 256) {
                            return { arrayBuffer: buf, mimeType: 'audio/mpeg', provider: 'elevenlabs' };
                        }
                    }
                } catch (e) {
                    if (e?.name === 'AbortError') throw e;
                    console.warn('[Live] ElevenLabs fallback to Sarvam:', e?.message || e);
                }
            }

            const sRes = await fetch(SARVAM_TTS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal,
                body: JSON.stringify({
                    text: chunkText,
                    target_language_code: targetLang,
                    model: "bulbul:v4-flash",
                    speaker,
                    pace: 1.0,
                    pitch: 0.0,
                    loudness: 1.15,
                    enable_preprocessing: true,
                    speech_sample_rate: 24000,
                    output_audio_codec: "mp3"
                })
            });
            if (!sRes.ok) throw new Error(`Sarvam HTTP ${sRes.status}`);
            const ttsData = await sRes.json();
            const audioBase64 = ttsData.audios?.[0] || ttsData.audio || ttsData.audio_content;
            if (!audioBase64) return null;
            const buf = base64ToArrayBuffer(audioBase64);
            const bytes = new Uint8Array(buf);
            const mimeType = (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0) || (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) ? 'audio/mpeg' : 'audio/wav';
            return { arrayBuffer: buf, mimeType, base64Audio: audioBase64, provider: 'sarvam' };
        }

        function ensureLivePlaybackNodes(ctx) {
            if (!liveCompressorNode || liveCompressorNode.context !== ctx) {
                liveCompressorNode = ctx.createDynamicsCompressor();
                liveCompressorNode.threshold.value = -16;
                liveCompressorNode.knee.value = 18;
                liveCompressorNode.ratio.value = 3;
                liveCompressorNode.attack.value = 0.005;
                liveCompressorNode.release.value = 0.14;
                liveAnalyserNode = ctx.createAnalyser();
                liveAnalyserNode.fftSize = 256;
                liveCompressorNode.connect(liveAnalyserNode);
                liveAnalyserNode.connect(ctx.destination);
            }
            return liveCompressorNode;
        }

        async function speakAIResponse(text, signal = null) {
            if (!isLiveActive) return;
            const cleanText = sanitizeForSpeech(text);
            if (!cleanText) { startContinuousListening(); return; }

            const hasNonHindiIndic = /[\u0C00-\u0C7F\u0B80-\u0CFF\u0D00-\u0D7F]/.test(cleanText);
            const hasHindiDevanagari = /[\u0900-\u097F]/.test(cleanText);
            const resolvedLang = hasNonHindiIndic
                ? (currentLanguage === 'en' ? 'te' : currentLanguage)
                : (hasHindiDevanagari ? 'hi' : (currentLanguage === 'en' || currentLanguage === 'hi' ? currentLanguage : 'en'));

            const targetLang = resolvedLang === 'en' ? 'en-IN' : resolvedLang === 'hi' ? 'hi-IN' : 'te-IN';
            const speaker = resolvedLang === 'en' ? 'simran_en_conversation' : resolvedLang === 'hi' ? 'kavya_hi_conversational' : 'kavitha_te_conversation';
            const useElevenLabs = (resolvedLang === 'en' || resolvedLang === 'hi') && !hasNonHindiIndic;

            const chunks = splitSpeechChunks(cleanText);
            const ttsT0 = performance.now();
            const chunkPromises = chunks.map(ch => fetchTtsChunkAudio(ch, targetLang, speaker, useElevenLabs, signal));

            try {
                const firstAudio = await chunkPromises[0];
                console.log(`[Live] TTS chunk-1 (${firstAudio?.provider || 'none'}, ${chunks.length} chunks): ${(performance.now() - ttsT0).toFixed(0)}ms`);
                if ((signal && signal.aborted) || !isLiveActive) return;

                if (!firstAudio) {
                    await fallbackBrowserSpeech(cleanText);
                    return;
                }

                const playedViaWebAudio = await playPipelinedChunksWebAudio(chunkPromises, firstAudio, cleanText, signal);
                if (!playedViaWebAudio && !(signal && signal.aborted) && isLiveActive) {
                    const resolvedItems = (await Promise.all(chunkPromises.map(p => p.catch(() => null)))).filter(x => x && x.arrayBuffer);
                    if (resolvedItems.length > 0) {
                        await playAudioBuffersSequentialWithElement(resolvedItems, cleanText, signal);
                    } else {
                        await fallbackBrowserSpeech(cleanText);
                    }
                }
            } catch (err) {
                if (err?.name === 'AbortError' || !isLiveActive) return;
                console.warn('[Live] TTS pipeline fallback:', err);
                await fallbackBrowserSpeech(cleanText);
            }
        }

        async function playPipelinedChunksWebAudio(chunkPromises, firstAudio, displayText, signal) {
            const ctx = getPlaybackAudioContext();
            if (!ctx || typeof ctx.decodeAudioData !== 'function') return false;

            stopAudioPlayback();
            const mySession = livePlaybackSession;
            isAITalking = true;
            setLiveState('speaking', 'SPEAKING', `"${displayText}"`);
            if (mediaStream) mediaStream.getAudioTracks().forEach(t => t.enabled = false);
            if (recorderCtx?.state === 'running') recorderCtx.suspend().catch(() => {});
            if (ctx.state === 'suspended') await ctx.resume().catch(() => {});

            const destNode = ensureLivePlaybackNodes(ctx);
            startOrbVoicePulse(liveAnalyserNode);

            let nextScheduleTime = ctx.currentTime + 0.01;
            let lastSource = null;
            let scheduledCount = 0;

            for (let i = 0; i < chunkPromises.length; i++) {
                if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return true;
                let item = null;
                try {
                    item = (i === 0) ? firstAudio : await chunkPromises[i];
                } catch (err) {
                    if (err?.name === 'AbortError') return true;
                    console.warn(`[Live] Chunk ${i + 1} fetch error:`, err);
                    continue;
                }
                if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return true;
                if (!item || !item.arrayBuffer) continue;

                try {
                    const decoded = await ctx.decodeAudioData(item.arrayBuffer.slice(0));
                    if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return true;

                    const src = ctx.createBufferSource();
                    src.buffer = decoded;
                    src.connect(destNode);
                    const startAt = Math.max(ctx.currentTime + 0.01, nextScheduleTime);
                    src.start(startAt);
                    nextScheduleTime = startAt + decoded.duration;
                    activeAudioSources.push(src);
                    lastSource = src;
                    scheduledCount++;
                } catch (err) {
                    console.warn(`[Live] Chunk ${i + 1} decode error:`, err);
                    if (scheduledCount === 0) {
                        stopAudioPlayback();
                        return false;
                    }
                }
            }

            if (!scheduledCount || !lastSource) {
                stopAudioPlayback();
                return false;
            }

            await new Promise((resolve) => {
                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    if (mySession === livePlaybackSession) {
                        stopOrbVoicePulse();
                        activeAudioSources = [];
                        isAITalking = false;
                        if (isLiveActive) setTimeout(() => { if (isLiveActive && !isAITalking) startContinuousListening(); }, 60);
                    }
                    resolve();
                };
                lastSource.onended = finish;
                const remainMs = Math.max(150, Math.ceil((nextScheduleTime - ctx.currentTime) * 1000) + 250);
                setTimeout(finish, remainMs);
            });
            return true;
        }

        async function playAudioBuffersSequentialWithElement(items, displayText, signal) {
            stopAudioPlayback();
            const mySession = livePlaybackSession;
            isAITalking = true;
            setLiveState('speaking', 'SPEAKING', `"${displayText}"`);
            if (mediaStream) mediaStream.getAudioTracks().forEach(t => t.enabled = false);
            if (recorderCtx?.state === 'running') recorderCtx.suspend().catch(() => {});

            for (const item of items) {
                if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return;
                await new Promise(async (resolve) => {
                    let done = false;
                    const finish = () => {
                        if (done) return;
                        done = true;
                        if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
                        resolve();
                    };
                    try {
                        currentBlobUrl = URL.createObjectURL(new Blob([item.arrayBuffer], { type: item.mimeType || 'audio/mpeg' }));
                        livePlayer.src = currentBlobUrl;
                        livePlayer.onended = finish;
                        livePlayer.onerror = finish;
                        await livePlayer.play();
                    } catch (err) {
                        console.warn("Live element playback error:", err);
                        finish();
                    }
                });
            }

            if (mySession === livePlaybackSession) {
                isAITalking = false;
                if (isLiveActive) setTimeout(() => { if (isLiveActive && !isAITalking) startContinuousListening(); }, 60);
            }
        }

        function fallbackBrowserSpeech(text) {
            return new Promise((resolve) => {
                const done = () => {
                    isAITalking = false;
                    if (isLiveActive) setTimeout(startContinuousListening, 60);
                    resolve();
                };
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = currentLanguage === 'en' ? 'en-IN' : 'te-IN';
                    isAITalking = true;
                    setLiveState('speaking', 'SPEAKING', `"${text}"`);
                    u.onend = u.onerror = done;
                    window.speechSynthesis.speak(u);
                } else { done(); }
            });
        }
    </script>
