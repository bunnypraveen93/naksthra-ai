        function stopOrbVoicePulse() {
            if (livePulseRafId) { cancelAnimationFrame(livePulseRafId); livePulseRafId = null; }
            const glow = document.querySelector('.live-orb-glow');
            if (glow) { glow.style.transform = ''; glow.style.opacity = ''; }
        }

        function startOrbVoicePulse(analyser) {
            stopOrbVoicePulse();
            const glow = document.querySelector('.live-orb-glow');
            if (!analyser || !glow) return;
            const buf = new Uint8Array(analyser.frequencyBinCount);
            const tick = () => {
                if (!isAITalking || !isLiveActive) { stopOrbVoicePulse(); return; }
                analyser.getByteTimeDomainData(buf);
                let sum = 0;
                for (let i = 0; i < buf.length; i++) {
                    const v = (buf[i] - 128) / 128;
                    sum += v * v;
                }
                const rms = Math.min(1, Math.sqrt(sum / buf.length) * 3.4);
                glow.style.transform = `scale(${(1.12 + rms * 0.28).toFixed(3)})`;
                glow.style.opacity = `${(0.86 + rms * 0.14).toFixed(3)}`;
                livePulseRafId = requestAnimationFrame(tick);
            };
            livePulseRafId = requestAnimationFrame(tick);
        }

        function stopAudioPlayback() {
            livePlaybackSession++;
            stopOrbVoicePulse();
            if (activeAudioSources.length) {
                for (const src of activeAudioSources) {
                    try { src.onended = null; src.stop(); src.disconnect(); } catch (e) {}
                }
                activeAudioSources = [];
            }
            try { currentAudioSource?.stop(); } catch (e) {}
            currentAudioSource = null;
            if (livePlayer) { livePlayer.pause(); livePlayer.currentTime = 0; livePlayer.onended = null; livePlayer.onerror = null; }
            if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isAITalking = false;
        }

        async function startContinuousListening() {
            if (!isLiveActive || isAITalking) return;
            isProcessingTurn = false; pcmChunks = []; preSpeechBuffer = []; speechStarted = false;
            activeSpeechFrames = 0; lastSpeechChunkIdx = 0;

            if (!mediaStream || mediaStream.getTracks().every(t => t.readyState === 'ended')) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                } catch (err) {
                    showErrorToast("Microphone permission denied.");
                    setLiveState('listening', 'MIC BLOCKED', 'Please allow microphone access.');
                    return;
                }
            } else {
                mediaStream.getAudioTracks().forEach(t => t.enabled = true);
            }

            if (!recorderCtx || recorderCtx.state === 'closed') {
                const AC = window.AudioContext || window.webkitAudioContext;
                recorderCtx = new AC();
                micSourceNode = recorderCtx.createMediaStreamSource(mediaStream);
                processorNode = recorderCtx.createScriptProcessor(2048, 1, 1);
                silentGainNode = recorderCtx.createGain();
                silentGainNode.gain.value = 0;
                micSourceNode.connect(processorNode);
                processorNode.connect(silentGainNode);
                silentGainNode.connect(recorderCtx.destination);
            } else if (recorderCtx.state === 'suspended') {
                await recorderCtx.resume().catch(() => {});
            }

            setLiveState('listening', 'LISTENING', currentLanguage === 'te' ? TELUGU_LIVE_STATUS_TEXT.listeningIdle : 'Listening...');

            processorNode.onaudioprocess = (event) => {
                if (!isLiveActive || isAITalking || isProcessingTurn) return;
                const copy = new Float32Array(event.inputBuffer.getChannelData(0));
                let sum = 0;
                for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                const rms = Math.sqrt(sum / copy.length);
                const now = Date.now();
                const threshold = Math.max(0.015, Math.min(0.034, liveNoiseFloor * 2.5));

                if (rms > threshold) {
                    if (!speechStarted) {
                        speechStarted = true; speechStartTime = now;
                        activeSpeechFrames = 0;
                        pcmChunks = [...preSpeechBuffer]; preSpeechBuffer = [];
                        setLiveState('listening', 'LISTENING', currentLanguage === 'te' ? TELUGU_LIVE_STATUS_TEXT.listeningActive : 'Listening...');
                    }
                    activeSpeechFrames++;
                    lastSpeechTime = now;
                    pcmChunks.push(copy);
                    lastSpeechChunkIdx = pcmChunks.length;
                } else if (speechStarted) {
                    pcmChunks.push(copy);
                    const speechDur = now - speechStartTime;
                    const silenceHangMs = speechDur < 2200 ? 450 : 560;
                    if ((now - lastSpeechTime > silenceHangMs) || (speechDur > 12000)) {
                        isProcessingTurn = true;
                        const trimEnd = Math.min(pcmChunks.length, lastSpeechChunkIdx + 3);
                        const captured = pcmChunks.slice(0, Math.max(1, trimEnd));
                        const sr = recorderCtx.sampleRate;
                        const voicedFrames = activeSpeechFrames;
                        pcmChunks = []; speechStarted = false; activeSpeechFrames = 0;
                        const totalDurSec = captured.reduce((a, c) => a + c.length, 0) / sr;
                        const voicedDurationMs = (voicedFrames * 2048 / sr) * 1000;
                        const minVoicedFrames = sr <= 20000 ? 2 : 4;
                        if (totalDurSec < 0.30 || voicedFrames < minVoicedFrames || voicedDurationMs < 160) {
                            isProcessingTurn = false;
                            return;
                        }
                        processWavWithSTT(encodePCMToWav16k(captured, sr));
                    }
                } else {
                    liveNoiseFloor = liveNoiseFloor * 0.92 + rms * 0.08;
                    preSpeechBuffer.push(copy);
                    if (preSpeechBuffer.length > 6) preSpeechBuffer.shift();
                }
            };
        }

        async function processWavWithSTT(wavBlob) {
            if (!isLiveActive) return;
            if (liveTurnAbortCtrl) { try { liveTurnAbortCtrl.abort(); } catch (e) {} }

                if (signal.aborted || !isLiveActive) return;
                if (!transcript || /^[\s.,!?…\-–—~"'`।]+$/u.test(transcript)) { startContinuousListening(); return; }
                const prevLang = lastLiveTurnLang || currentLanguage || 'en';
                const turnLang = resolveLiveTurnLanguage(transcript, sttResult);

        }

        function isLiveReplyLanguageMismatch(replyText, targetLang) {
            const t = String(replyText || '').trim();
            if (!t || !targetLang) return false;
            const latinWords = t.match(/[a-zA-Z]+/g) || [];
            const scriptRegexMap = {
                te: /[\u0C00-\u0C7F]/g,
                hi: /[\u0900-\u097F]/g,
                mr: /[\u0900-\u097F]/g,
                ta: /[\u0B80-\u0BFF]/g,
                kn: /[\u0C80-\u0CFF]/g,
                ml: /[\u0D00-\u0D7F]/g,
                bn: /[\u0980-\u09FF]/g,
                gu: /[\u0A80-\u0AFF]/g,
                pa: /[\u0A00-\u0A7F]/g,
                or: /[\u0B00-\u0B7F]/g
            };
            if (scriptRegexMap[targetLang]) {
                const targetCount = (t.match(scriptRegexMap[targetLang]) || []).length;
                return targetCount === 0 && latinWords.length >= 2;
            }
            if (targetLang === 'en') {
                const nonLatinCount = (t.match(/[\u0900-\u0DFF\u0600-\u06FF\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/g) || []).length;
                return (nonLatinCount >= 4 && latinWords.length < 4) || (nonLatinCount > latinWords.length * 3);
            }
            return false;
        }

        function resolveTtsVoice(txt, hintLang) {
            const base = hintLang || 'en';
            const ranges = { te: /[\u0C00-\u0C7F]/g, hi: /[\u0900-\u097F]/g, ta: /[\u0B80-\u0BFF]/g, ml: /[\u0D00-\u0D7F]/g, kn: /[\u0C80-\u0CFF]/g, bn: /[\u0980-\u09FF]/g, gu: /[\u0A80-\u0AFF]/g, pa: /[\u0A00-\u0A7F]/g, or: /[\u0B00-\u0B7F]/g };
            let best = null, bestN = 0;
            for (const [c, re] of Object.entries(ranges)) { const n = (txt.match(re) || []).length; if (n > bestN) { bestN = n; best = c; } }
            const latin = (txt.match(/[a-zA-Z]/g) || []).length;
            const indicLangs = ['te', 'hi', 'mr', 'ta', 'ml', 'kn', 'bn', 'gu', 'pa', 'or'];
            let lang = base;
            if (bestN >= 2) lang = (best === 'hi' && base === 'mr') ? 'mr' : best;
            else if (bestN === 0 && latin >= 3 && indicLangs.includes(base)) lang = 'en';
            const langMap = { en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN', te: 'te-IN', ta: 'ta-IN', ml: 'ml-IN', kn: 'kn-IN', bn: 'bn-IN', gu: 'gu-IN', pa: 'pa-IN', or: 'od-IN' };
            const regional = ['ta', 'ml', 'kn', 'mr', 'bn', 'gu', 'pa', 'or'].includes(lang);
            return {
                lang,
                targetLang: langMap[lang] || 'en-IN',
                model: regional ? 'bulbul:v3' : 'bulbul:v4-flash',
                speaker: regional ? 'kavitha' : (lang === 'en' ? 'simran_en_conversation' : lang === 'hi' ? 'kavya_hi_conversational' : 'kavitha_te_conversation'),
                useEl: false /* Sarvam only, as in your setup */
            };
        }

        async function streamLiveChatModel(model, effort, maxTokens, systemPrompt, historyMsgs, signal, turnLang, prevLang, sttMeta, onDelta) {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal,
                body: JSON.stringify({
                    model, mode: "live", stream: true, reasoning_effort: effort, temperature: 0.72, max_tokens: maxTokens,
                    language: turnLang, prev_language: prevLang || turnLang, script_preference: "native",
                    city: nakshatraClientLocation.city || null,
                    location: (nakshatraClientLocation.lat !== null && nakshatraClientLocation.lon !== null)
                        ? { lat: nakshatraClientLocation.lat, lon: nakshatraClientLocation.lon, city: nakshatraClientLocation.city || null }
                        : null,
                    stt_meta: sttMeta ? { languageCode: sttMeta.languageCode || null, languageProbability: Number(sttMeta.languageProbability || 0) } : null,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata",
                    messages: [{ role: "system", content: systemPrompt }, ...getFewShotExamples(turnLang, 'live'), ...historyMsgs]
                })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const contentType = (res.headers.get('content-type') || '').toLowerCase();
            if (contentType.includes('application/json') || !res.body) {
                const jsonData = await res.json().catch(() => null);
                const full = cleanTeluguOutput(jsonData?.response || jsonData?.choices?.[0]?.message?.content || '');
                if (full) onDelta(full);
                return full;
            }
            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let acc = '', carry = '', inThink = false;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                carry += dec.decode(value, { stream: true });
                const lines = carry.split('\n');
                carry = lines.pop();
                for (const ln of lines) {
                    const s = ln.trim();
                    if (!s.startsWith('data:')) continue;
                    const p = s.slice(5).trim();
                    if (p === '[DONE]') continue;
                    try {
                        let d = JSON.parse(p).choices?.[0]?.delta?.content || '';
                        if (!d) continue;
                        if (d.includes('<think>')) { inThink = true; d = d.split('<think>')[0]; }
                        if (inThink) {
                            if (d.includes('</think>')) { inThink = false; d = d.split('</think>').slice(1).join(''); }
                            else continue;
                        }
                        if (d) { acc += d; onDelta(d); }
                    } catch (e) {}
                }
            }
            return cleanTeluguOutput(acc);
        }

        // Sentence-by-sentence TTS pipeline: starts speaking while the LLM is still generating
        function createLiveSpeaker(signal, hintLang) {
            const ctx = getPlaybackAudioContext();
            stopAudioPlayback();
            const mySession = livePlaybackSession;
            let buf = '', voice = null, count = 0, cancelled = false, began = false;
            const spoken = new Set();
            let nextTime = 0, lastSource = null, scheduled = 0, chain = Promise.resolve();
            const dead = () => cancelled || mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted);

            function begin() {
                if (began) return;
                began = true;
                isAITalking = true;
                setLiveState('speaking', 'SPEAKING', '');
                if (mediaStream) mediaStream.getAudioTracks().forEach(t => t.enabled = false);
                if (recorderCtx?.state === 'running') recorderCtx.suspend().catch(() => {});
                startOrbVoicePulse(ensureLivePlaybackNodes(ctx));
                nextTime = ctx.currentTime + 0.03;
            }

            function emit(seg) {
                const clean = sanitizeForSpeech(seg);
                if (!clean || !ctx || dead()) return;
                const spokenKey = clean.toLowerCase().replace(/\s+/g, ' ');
                if (spoken.has(spokenKey)) return;
                spoken.add(spokenKey);
                if (!voice) voice = resolveTtsVoice(clean, hintLang);
                const v = voice;
                const p = fetchTtsChunkAudio(clean, v.targetLang, v.speaker, v.useEl, signal, v.model).catch(() => null);
                chain = chain.then(async () => {
                    const item = await p;
                    if (!item || !item.arrayBuffer || dead()) return;
                    let decoded;
                    try { decoded = await ctx.decodeAudioData(item.arrayBuffer.slice(0)); } catch (e) { return; }
                    if (dead()) return;
                    if (ctx.state === 'suspended') await ctx.resume().catch(() => {});
                    begin();
                    const src = ctx.createBufferSource();
                    src.buffer = decoded;
                    src.connect(ensureLivePlaybackNodes(ctx));
                    const startAt = Math.max(ctx.currentTime + 0.01, nextTime);
                    src.start(startAt);
                    nextTime = startAt + decoded.duration;
                    activeAudioSources.push(src);
                    lastSource = src;
                    scheduled++;
                });
            }

            function drain(final) {
                while (true) {
                    const minLen = count === 0 ? 24 : 45;
                    const re = /[.!?\u0964\u2026]+["')\]]*(?=\s)/g;
                    let m, cut = -1;
                    while ((m = re.exec(buf))) {
                        const end = m.index + m[0].length;
                        if (end >= minLen) { cut = end; break; }
                    }
                    if (cut < 0 && !final && count === 0 && buf.length >= 70) {
                        const c = buf.lastIndexOf(',');
                        if (c >= 30) cut = c + 1;
                    }
                    if (cut < 0) break;
                    emit(buf.slice(0, cut));
                    buf = buf.slice(cut).replace(/^\s+/, '');
                    count++;
                }
                if (final && buf.trim()) { emit(buf); buf = ''; count++; }
            }

            return {
                push(d) { buf += d; drain(false); },
                end() { drain(true); },
                cancel() { cancelled = true; },
                async finish(fullText) {
                    await chain;
                    if (dead()) return;
                    if (!scheduled || !lastSource) {
                        stopAudioPlayback();
                        await fallbackBrowserSpeech(sanitizeForSpeech(fullText), hintLang);
                        return;
                    }
                    await new Promise((resolve) => {
                        let settled = false;
                        const done = () => {
                            if (settled) return;
                            settled = true;
                            if (mySession === livePlaybackSession) {
                                stopOrbVoicePulse();
                                activeAudioSources = [];
                                isAITalking = false;
                                if (isLiveActive) setTimeout(() => { if (isLiveActive && !isAITalking) startContinuousListening(); }, 140);
                            }
                            resolve();
                        };
                        lastSource.onended = done;
                        setTimeout(done, Math.max(150, Math.ceil((nextTime - ctx.currentTime) * 1000) + 250));
                    });
                }
            };
        }

        function base64ToArrayBuffer(b64) {
            const clean = b64.replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
            const bin = window.atob(clean);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes.buffer;
        }

        async function fetchTtsChunkAudio(chunkText, targetLang, speaker, preferElevenLabs, signal, sarvamModel = "bulbul:v4-flash") {
            if (preferElevenLabs) {
                try {
                    const elRes = await fetch(`${ELEVENLABS_TTS_URL}?voice_id=EXAVITQu4vr4xnSDxMaL`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal,
                        body: JSON.stringify({
                            text: chunkText,
                            model_id: "eleven_multilingual_v2",
                            voice_settings: {
                                stability: 0.30,
                                similarity_boost: 0.78,
                                style: 0.45,
                                use_speaker_boost: true,
                                speed: 0.97
                            }
                        })
                    });
                    if (elRes.ok) {
                        const buf = await elRes.arrayBuffer();
                        if (buf && buf.byteLength > 256) {
                            return { arrayBuffer: buf, mimeType: 'audio/mpeg', provider: 'elevenlabs' };
                        }
                    }
                } catch (e) {
                    if (e?.name === 'AbortError') throw e;
                    console.warn('[Live] ElevenLabs fallback to Sarvam:', e?.message || e);
                }
            }

            const sRes = await fetch(SARVAM_TTS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal,
                body: JSON.stringify({
                    text: chunkText,
                    target_language_code: targetLang,
                    model: sarvamModel,
                    speaker,
                    pace: 1.0,
                    pitch: 0.0,
                    loudness: 1.1,
                    enable_preprocessing: true,
                    speech_sample_rate: 24000,
                    output_audio_codec: "mp3"
                })
            });
            if (!sRes.ok) throw new Error(`Sarvam HTTP ${sRes.status}`);
            const ttsData = await sRes.json();
            const audioBase64 = ttsData.audios?.[0] || ttsData.audio || ttsData.audio_content;
            if (!audioBase64) return null;
            const buf = base64ToArrayBuffer(audioBase64);
            const bytes = new Uint8Array(buf);
            const mimeType = (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0) || (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) ? 'audio/mpeg' : 'audio/wav';
            return { arrayBuffer: buf, mimeType, base64Audio: audioBase64, provider: 'sarvam' };
        }

        function ensureLivePlaybackNodes(ctx) {
            if (!liveAnalyserNode || liveAnalyserNode.context !== ctx) {
                liveAnalyserNode = ctx.createAnalyser();
                liveAnalyserNode.fftSize = 256;
                liveAnalyserNode.connect(ctx.destination);
            }
            return liveAnalyserNode;
        }

        async function speakAIResponse(text, signal = null, hintLang = null) {
            if (!isLiveActive) return;
            const cleanText = sanitizeForSpeech(text);
            if (!cleanText) { startContinuousListening(); return; }

            const baseLang = hintLang || lastLiveTurnLang || currentLanguage || 'en';
            const scriptCounts = {
                te: (cleanText.match(/[\u0C00-\u0C7F]/g) || []).length,
                hi: (cleanText.match(/[\u0900-\u097F]/g) || []).length,
                ta: (cleanText.match(/[\u0B80-\u0BFF]/g) || []).length,
                ml: (cleanText.match(/[\u0D00-\u0D7F]/g) || []).length,
                kn: (cleanText.match(/[\u0C80-\u0CFF]/g) || []).length,
                bn: (cleanText.match(/[\u0980-\u09FF]/g) || []).length,
                gu: (cleanText.match(/[\u0A80-\u0AFF]/g) || []).length,
                pa: (cleanText.match(/[\u0A00-\u0A7F]/g) || []).length,
                or: (cleanText.match(/[\u0B00-\u0B7F]/g) || []).length
            };
            let bestIndic = null, bestIndicCount = 0;
            for (const [code, cnt] of Object.entries(scriptCounts)) {
                if (cnt > bestIndicCount) { bestIndicCount = cnt; bestIndic = code; }
            }
            const latinAlphaCount = (cleanText.match(/[a-zA-Z]/g) || []).length;
            let resolvedLang = baseLang;
            if (bestIndicCount >= 3 && (bestIndicCount >= latinAlphaCount * 0.25 || latinAlphaCount < 10)) {
                resolvedLang = (bestIndic === 'hi' && baseLang === 'mr') ? 'mr' : bestIndic;
            } else if (bestIndicCount >= 2 && latinAlphaCount < 6) {
                resolvedLang = (bestIndic === 'hi' && baseLang === 'mr') ? 'mr' : bestIndic;
            } else {
                const replySig = analyzeLanguageSignal(cleanText, false, null, baseLang);
                if (['es', 'fr', 'de', 'te', 'hi', 'ta', 'kn', 'ml'].includes(replySig.lang) && replySig.strength !== 'weak') {
                    resolvedLang = replySig.lang;
                } else if (['te', 'hi', 'mr', 'ta', 'ml', 'kn', 'bn', 'gu', 'pa', 'or'].includes(baseLang)
                    && bestIndicCount === 0 && latinAlphaCount >= 3 && replySig.lang === 'en') {
                    // Never feed pure English text into Indic TTS voices (e.g. te-IN)
                    resolvedLang = 'en';
                }
            }

            const targetLangMap = {
                en: 'en-IN', hi: 'hi-IN', mr: 'mr-IN', te: 'te-IN',
                ta: 'ta-IN', ml: 'ml-IN', kn: 'kn-IN', bn: 'bn-IN',
                gu: 'gu-IN', pa: 'pa-IN', or: 'od-IN'
            };
            const targetLang = targetLangMap[resolvedLang] || 'en-IN';
            const isRegionalV3 = ['ta', 'ml', 'kn', 'mr', 'bn', 'gu', 'pa', 'or'].includes(resolvedLang);
            const sarvamModel = isRegionalV3 ? 'bulbul:v3' : 'bulbul:v4-flash';
            const speaker = isRegionalV3
                ? 'kavitha'
                : (resolvedLang === 'en' ? 'simran_en_conversation' : resolvedLang === 'hi' ? 'kavya_hi_conversational' : 'kavitha_te_conversation');
            const useElevenLabs = ['en', 'hi', 'es', 'fr', 'de'].includes(resolvedLang) && !/[\u0C00-\u0C7F\u0980-\u0DFF]/.test(cleanText);

            const chunks = splitSpeechChunks(cleanText);
            const ttsT0 = performance.now();
            const chunkPromises = chunks.map(ch => fetchTtsChunkAudio(ch, targetLang, speaker, useElevenLabs, signal, sarvamModel));

            try {
                const firstAudio = await chunkPromises[0];
                console.log(`[Live] TTS chunk-1 (${firstAudio?.provider || 'none'}, lang=${resolvedLang}, ${chunks.length} chunks): ${(performance.now() - ttsT0).toFixed(0)}ms`);
                if ((signal && signal.aborted) || !isLiveActive) return;

                if (!firstAudio) {
                    await fallbackBrowserSpeech(cleanText, resolvedLang);
                    return;
                }

                const playedViaWebAudio = await playPipelinedChunksWebAudio(chunkPromises, firstAudio, cleanText, signal);
                if (!playedViaWebAudio && !(signal && signal.aborted) && isLiveActive) {
                    const resolvedItems = (await Promise.all(chunkPromises.map(p => p.catch(() => null)))).filter(x => x && x.arrayBuffer);
                    if (resolvedItems.length > 0) {
                        await playAudioBuffersSequentialWithElement(resolvedItems, cleanText, signal);
                    } else {
                        await fallbackBrowserSpeech(cleanText, resolvedLang);
                    }
                }
            } catch (err) {
                if (err?.name === 'AbortError' || !isLiveActive) return;
                console.warn('[Live] TTS pipeline fallback:', err);
                await fallbackBrowserSpeech(cleanText, resolvedLang);
            }
        }

        async function playPipelinedChunksWebAudio(chunkPromises, firstAudio, displayText, signal) {
            const ctx = getPlaybackAudioContext();
            if (!ctx || typeof ctx.decodeAudioData !== 'function') return false;

            stopAudioPlayback();
            const mySession = livePlaybackSession;
            isAITalking = true;
            setLiveState('speaking', 'SPEAKING', `"${displayText}"`);
            if (mediaStream) mediaStream.getAudioTracks().forEach(t => t.enabled = false);
            if (recorderCtx?.state === 'running') recorderCtx.suspend().catch(() => {});
            if (ctx.state === 'suspended') await ctx.resume().catch(() => {});

            const destNode = ensureLivePlaybackNodes(ctx);
            startOrbVoicePulse(liveAnalyserNode);

            let nextScheduleTime = ctx.currentTime + 0.01;
            let lastSource = null;
            let scheduledCount = 0;

            for (let i = 0; i < chunkPromises.length; i++) {
                if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return true;
                let item = null;
                try {
                    item = (i === 0) ? firstAudio : await chunkPromises[i];
                } catch (err) {
                    if (err?.name === 'AbortError') return true;
                    console.warn(`[Live] Chunk ${i + 1} fetch error:`, err);
                    continue;
                }
                if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return true;
                if (!item || !item.arrayBuffer) continue;

                try {
                    const decoded = await ctx.decodeAudioData(item.arrayBuffer.slice(0));
                    if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return true;

                    const src = ctx.createBufferSource();
                    src.buffer = decoded;
                    src.connect(destNode);
                    const startAt = Math.max(ctx.currentTime + 0.01, nextScheduleTime);
                    src.start(startAt);
                    nextScheduleTime = startAt + decoded.duration;
                    activeAudioSources.push(src);
                    lastSource = src;
                    scheduledCount++;
                } catch (err) {
                    console.warn(`[Live] Chunk ${i + 1} decode error:`, err);
                    if (scheduledCount === 0) {
                        stopAudioPlayback();
                        return false;
                    }
                }
            }

            if (!scheduledCount || !lastSource) {
                stopAudioPlayback();
                return false;
            }

            await new Promise((resolve) => {
                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    if (mySession === livePlaybackSession) {
                        stopOrbVoicePulse();
                        activeAudioSources = [];
                        isAITalking = false;
                        if (isLiveActive) setTimeout(() => { if (isLiveActive && !isAITalking) startContinuousListening(); }, 220);
                    }
                    resolve();
                };
                lastSource.onended = finish;
                const remainMs = Math.max(150, Math.ceil((nextScheduleTime - ctx.currentTime) * 1000) + 250);
                setTimeout(finish, remainMs);
            });
            return true;
        }

        async function playAudioBuffersSequentialWithElement(items, displayText, signal) {
            stopAudioPlayback();
            const mySession = livePlaybackSession;
            isAITalking = true;
            setLiveState('speaking', 'SPEAKING', `"${displayText}"`);
            if (mediaStream) mediaStream.getAudioTracks().forEach(t => t.enabled = false);
            if (recorderCtx?.state === 'running') recorderCtx.suspend().catch(() => {});

            for (const item of items) {
                if (mySession !== livePlaybackSession || !isLiveActive || (signal && signal.aborted)) return;
                await new Promise(async (resolve) => {
                    let done = false;
                    const finish = () => {
                        if (done) return;
                        done = true;
                        if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
                        resolve();
                    };
                    try {
                        currentBlobUrl = URL.createObjectURL(new Blob([item.arrayBuffer], { type: item.mimeType || 'audio/mpeg' }));
                        livePlayer.src = currentBlobUrl;
                        livePlayer.onended = finish;
                        livePlayer.onerror = finish;
                        await livePlayer.play();
                    } catch (err) {
                        console.warn("Live element playback error:", err);
                        finish();
                    }
                });
            }

            if (mySession === livePlaybackSession) {
                isAITalking = false;
                if (isLiveActive) setTimeout(() => { if (isLiveActive && !isAITalking) startContinuousListening(); }, 220);
            }
        }

        function fallbackBrowserSpeech(text, lang = currentLanguage) {
            return new Promise((resolve) => {
                const done = () => {
                    isAITalking = false;
                    if (isLiveActive) setTimeout(startContinuousListening, 220);
                    resolve();
                };
                if ('speechSynthesis' in window) {
                    const localeMap = {
                        en: 'en-IN', te: 'te-IN', hi: 'hi-IN', mr: 'mr-IN',
                        ta: 'ta-IN', ml: 'ml-IN', kn: 'kn-IN', bn: 'bn-IN',
                        gu: 'gu-IN', pa: 'pa-IN', or: 'or-IN',
                        es: 'es-ES', fr: 'fr-FR', de: 'de-DE', ar: 'ar-SA',
                        ja: 'ja-JP', ko: 'ko-KR', zh: 'zh-CN'
                    };
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = localeMap[lang] || 'en-IN';
                    isAITalking = true;
                    setLiveState('speaking', 'SPEAKING', `"${text}"`);
                    u.onend = u.onerror = done;
                    window.speechSynthesis.speak(u);
                } else { done(); }
            });
        }
    </script>
