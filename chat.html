<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Nakshatra AI - Web Chat</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Markdown Rendering Stack -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --cyan: #38bdf8;
            --purple: #6366f1;
            --violet: #a855f7;
            --pink: #ec4899;
            --bg-sidebar: #0a0b10;
            --border: rgba(255,255,255,0.08);
            --text-primary: #ececf1;
            --gradient-main: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
            --font-sm: 0.92rem;
            --font-xs: 0.8rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Telugu', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 35%, #111842 0%, #06091c 55%, #02030a 100%);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            transition: background 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        body.chat-active { background: #000000 !important; }

        /* ---- TOAST ---- */
        .app-toast {
            position: fixed;
            top: 66px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 99999;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: var(--font-sm);
            font-weight: 500;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.94);
            border: 1px solid rgba(248, 113, 113, 0.5);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 90vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(12px);
        }
        .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---- TOP BAR ---- */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            background: rgba(6, 9, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        body.chat-active .top-bar { background: rgba(0, 0, 0, 0.85); border-bottom-color: rgba(255, 255, 255, 0.05); }
        .top-left-group, .top-brand { display: flex; align-items: center; gap: 9px; }
        .top-brand img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1.5px solid rgba(0,242,254,0.4);
            box-shadow: 0 0 10px rgba(0,242,254,0.25);
        }
        .top-brand-text { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 7px; }
        .gradient-text { background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-btn {
            background: transparent;
            border: none;
            color: #d1d5db;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* ---- SIDEBAR ---- */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 99; }
        .sidebar-overlay.show { display: block; }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            width: 265px;
            max-width: 82vw;
            height: 100dvh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            z-index: 100;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand img { width: 27px; height: 27px; border-radius: 7px; object-fit: cover; }
        .close-menu-btn { background: transparent; border: none; color: #64748b; font-size: 1.15rem; cursor: pointer; padding: 4px; }
        .new-chat-btn {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,242,254,0.25);
            border-radius: 11px;
            color: #e2e8f0;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .recent-label { margin: 20px 6px 8px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; color: #475569; font-weight: 600; }
        .recent-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .menu-item {
            padding: 10px 12px;
            border-radius: 9px;
            color: #94a3b8;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-item:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }
        .sidebar-bottom { padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }

        /* ---- MAIN SCROLL AREA ---- */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 0 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .main-content::-webkit-scrollbar,
        .recent-list::-webkit-scrollbar,
        .chat-input::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        .recent-list,
        .chat-input {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .code-card pre::-webkit-scrollbar,
        .table-scroll-wrap::-webkit-scrollbar {
            height: 4px;
        }
        .code-card pre::-webkit-scrollbar-thumb,
        .table-scroll-wrap::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* ---- HOME SCREEN ---- */
        .home-center {
            position: relative;
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            width: 100%;
            max-width: 680px;
            animation: homeFadeUp 0.35s ease;
        }
        .home-center.leaving { opacity: 0; transform: translateY(-14px); pointer-events: none; transition: 0.22s; }
        @keyframes homeFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .center-cosmic-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.24) 0%, rgba(56, 189, 248, 0.1) 50%, transparent 72%);
            filter: blur(36px);
            pointer-events: none;
        }
        .home-greeting { position: relative; z-index: 1; text-align: center; }
        .greeting-main { font-size: clamp(1.65rem, 4.2vw, 2.35rem); font-weight: 600; letter-spacing: -0.025em; color: #ffffff; line-height: 1.25; text-wrap: balance; }
        .greeting-sub { font-size: clamp(0.98rem, 2.4vw, 1.12rem); font-weight: 400; color: #cbd5e1; margin-top: 10px; line-height: 1.5; text-wrap: balance; }

        /* ---- CHAT CONTAINER & MESSAGES ---- */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 14px 12px 36px;
        }
        .msg-row { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 8px 0; animation: msgFadeUp 0.25s ease; }
        @keyframes msgFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-row.user { justify-content: flex-end; padding: 8px 0; }
        .msg-row.ai { justify-content: flex-start; gap: 0; padding: 10px 0 18px; }
        .msg-row.user .msg-bubble {
            background: #1e1f22;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 22px 22px 6px 22px;
            padding: 12px 18px;
            max-width: 82%;
            font-size: 0.98rem;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .ai-content-wrap { flex: 1; width: 100%; min-width: 0; display: flex; flex-direction: column; }

        /* ---- EDGE-TO-EDGE PURE WHITE EDITORIAL MARKDOWN ---- */
        .msg-row.ai .msg-bubble {
            color: #ffffff;
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 100%;
            font-size: 1rem;
            line-height: 1.72;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: left;
        }
        .msg-row.ai .msg-bubble p { margin: 0 0 1em; line-height: 1.75; color: #ffffff; }
        .msg-row.ai .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-row.ai .msg-bubble h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; margin: 1.4em 0 0.6em; color: #ffffff; border-bottom: 1px solid rgba(255,255,255,0.14); padding-bottom: 6px; }
        .msg-row.ai .msg-bubble h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.012em; line-height: 1.32; margin: 1.35em 0 0.55em; color: #ffffff; }
        .msg-row.ai .msg-bubble h3 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; margin: 1.3em 0 0.5em; color: #ffffff; }
        .msg-row.ai .msg-bubble h4,
        .msg-row.ai .msg-bubble h5,
        .msg-row.ai .msg-bubble h6 { font-size: 1.06rem; font-weight: 650; line-height: 1.4; margin: 1.05em 0 0.42em; color: #ffffff; }
        .msg-row.ai .msg-bubble ul,
        .msg-row.ai .msg-bubble ol { margin: 0.45em 0 1.15em; padding-left: 0; list-style-position: inside; color: #ffffff; }
        .msg-row.ai .msg-bubble ul ul,
        .msg-row.ai .msg-bubble ol ol,
        .msg-row.ai .msg-bubble ul ol,
        .msg-row.ai .msg-bubble ol ul { margin: 0.35em 0; padding-left: 1.1em; }
        .msg-row.ai .msg-bubble li { margin-bottom: 0.68em; padding-left: 0; line-height: 1.74; font-size: 1rem; color: #ffffff; }
        .msg-row.ai .msg-bubble li > p { display: inline; margin: 0; color: #ffffff; }
        .msg-row.ai .msg-bubble li:last-child { margin-bottom: 0; }
        .msg-row.ai .msg-bubble ul > li::marker,
        .msg-row.ai .msg-bubble ol > li::marker { color: #ffffff; font-weight: 700; }
        .msg-row.ai .msg-bubble strong { color: #ffffff; font-weight: 700; }
        .msg-row.ai .msg-bubble em { font-style: italic; color: #ffffff; }
        .msg-row.ai .msg-bubble code:not(pre code) {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.16);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: 'JetBrains Mono', monospace;
            color: #ffffff;
        }
        .code-card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; margin: 12px 0; overflow: hidden; }
        .code-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #141414;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            font-size: 0.78rem;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .code-card-copy-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 5px;
        }
        .code-card-copy-btn:hover { color: #ffffff; background: rgba(255,255,255,0.12); }
        .code-card-copy-btn.copied { color: #ffffff; }
        .code-card pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 0.9rem; line-height: 1.6; }
        .code-card pre code,
        .code-card pre code * { font-family: 'JetBrains Mono', monospace; color: #ffffff !important; background: transparent !important; }
        .msg-row.ai .msg-bubble blockquote { border-left: 2px solid #ffffff; padding: 8px 14px; margin: 12px 0; background: rgba(255, 255, 255, 0.05); border-radius: 0 8px 8px 0; color: #ffffff; }
        .msg-row.ai .msg-bubble hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.16); margin: 1.2em 0; }
        .msg-row.ai .msg-bubble a { color: #ffffff; text-decoration: underline; }
        .table-scroll-wrap { width: 100%; overflow-x: auto; margin: 12px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); }
        .msg-row.ai .msg-bubble table { width: 100%; border-collapse: collapse; font-size: 0.92rem; color: #ffffff; }
        .msg-row.ai .msg-bubble th,
        .msg-row.ai .msg-bubble td { padding: 10px 14px; text-align: left; border: 1px solid rgba(255,255,255,0.12); color: #ffffff; }
        .msg-row.ai .msg-bubble th { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .msg-row.ai .msg-bubble > *:first-child { margin-top: 0 !important; }
        .msg-row.ai .msg-bubble > *:last-child { margin-bottom: 0 !important; }

        .msg-actions-bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
        .msg-action-btn {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255,255,255,0.68);
            padding: 4px 9px;
            border-radius: 7px;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .msg-action-btn:hover { color: #ffffff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); }

        .ai-dots-loader { display: flex; align-items: center; gap: 5px; height: 28px; padding: 4px 0; }
        .ai-dots-loader span { width: 7px; height: 7px; border-radius: 50%; background: #ffffff; animation: dotBounce 1.1s ease-in-out infinite; }
        .ai-dots-loader span:nth-child(2) { animation-delay: 0.18s; }
        .ai-dots-loader span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.45; } 40% { transform: translateY(-7px) scale(1.1); opacity: 1; } }

        .continue-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 15px;
            font-size: var(--font-xs);
            color: #ffffff;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            cursor: pointer;
            align-self: flex-start;
        }
        .continue-pill-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 520px) {
            .chat-container { padding: 12px 10px 32px; }
        }

        /* ---- FLOATING BOTTOM INPUT BAR & DEDICATED SEND BUTTON ---- */
        .bottom-bar {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 30;
        }
        body.chat-active .bottom-bar {
            max-width: 100%;
            padding-left: 12px;
            padding-right: 12px;
        }
        @media (max-width: 520px) {
            body.chat-active .bottom-bar { padding-left: 10px; padding-right: 10px; }
        }
        .chat-box-wrapper {
            width: 100%;
            border-radius: 28px;
            background: #14151c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 8px 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 54px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
        }
        .chat-box-wrapper:focus-within {
            border-color: rgba(99, 102, 241, 0.55);
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3), 0 8px 36px rgba(0, 0, 0, 0.7);
        }
        .chat-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            height: 26px;
            max-height: 140px;
            overflow-y: auto;
            font-family: inherit;
        }
        .chat-input::placeholder { color: #8b90a0; font-size: 0.98rem; }
        .chat-input-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .mic-toggle-btn {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
            touch-action: manipulation;
        }
        .mic-toggle-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .mic-toggle-btn:active { transform: scale(0.93); }
        .mic-toggle-btn .mic-icon-stop,
        .mic-toggle-btn .mic-icon-spinner { display: none; }
        .mic-toggle-btn.listening {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.7);
            color: #38bdf8;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
            animation: micDictatePulse 1.3s ease-in-out infinite;
        }
        .mic-toggle-btn.listening .mic-icon-idle { display: none; }
        .mic-toggle-btn.listening .mic-icon-stop { display: block; }
        .mic-toggle-btn.transcribing {
            background: rgba(99, 102, 241, 0.18);
            border-color: rgba(168, 85, 247, 0.55);
            color: #c4b5fd;
            cursor: wait;
        }
        .mic-toggle-btn.transcribing .mic-icon-idle { display: none; }
        .mic-toggle-btn.transcribing .mic-icon-spinner { display: inline-block; }
        @keyframes micDictatePulse {
            0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 22px rgba(56, 189, 248, 0.6); transform: scale(1.05); }
        }

        .send-btn {
            position: relative;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.5);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, opacity 0.2s ease;
            touch-action: manipulation;
            opacity: 0.95;
        }
        .send-btn svg {
            position: absolute;
            transition: opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .send-btn .btn-icon-wave { opacity: 1; transform: scale(1) rotate(0deg); }
        .send-btn .btn-icon-send { opacity: 0; transform: scale(0.55) rotate(-45deg); }
        .send-btn.typing { opacity: 1; box-shadow: 0 0 24px rgba(124, 58, 237, 0.75); }
        body.chat-active .send-btn { opacity: 1; }
        .send-btn.typing .btn-icon-wave,
        body.chat-active .send-btn .btn-icon-wave { opacity: 0; transform: scale(0.55) rotate(45deg); }
        .send-btn.typing .btn-icon-send,
        body.chat-active .send-btn .btn-icon-send { opacity: 1; transform: scale(1) rotate(0deg); }
        .send-btn:hover { transform: scale(1.06); }
        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .bottom-disclaimer { font-size: 0.72rem; color: #64748b; text-align: center; }

        /* ---- LIVE VOICE MODE ---- */
        .live-modal {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 38%, #111842 0%, #06091c 56%, #02030a 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0 0 calc(28px + env(safe-area-inset-bottom, 0px));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.985);
            transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                        visibility 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }
        .live-modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1);
        }
        .live-ambient-bg {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(460px, 92vw);
            height: min(460px, 92vw);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(56, 189, 248, 0.1) 42%, transparent 72%);
            filter: blur(48px);
            pointer-events: none;
            z-index: 0;
        }
        .live-header {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(6, 9, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .live-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .live-close-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.28);
            color: #ffffff;
            transform: scale(1.06);
        }
        .live-close-btn:active { transform: scale(0.92); }

        .live-center-stage {
            position: relative;
            z-index: 2;
            flex: 1;
            width: 100%;
            max-width: 560px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 3.8vh, 30px);
            min-height: 0;
        }
        .live-orb-container {
            position: relative;
            width: clamp(176px, min(52vw, 44vh), 252px);
            height: clamp(176px, min(52vw, 44vh), 252px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .live-orb-glow {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(39, 215, 255, 0.34) 0%, rgba(79, 70, 229, 0.32) 44%, rgba(223, 79, 255, 0.24) 68%, transparent 78%);
            filter: blur(32px);
            opacity: 0.9;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        .live-wave {
            position: absolute;
            width: clamp(136px, min(40vw, 35vh), 192px);
            height: clamp(136px, min(40vw, 35vh), 192px);
            border-radius: 50%;
            border: 1.5px solid rgba(39, 215, 255, 0.42);
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }
        .live-wave.wave-secondary {
            border-color: rgba(223, 79, 255, 0.36);
        }
        .live-orb-core {
            position: relative;
            width: clamp(136px, min(40vw, 35vh), 192px);
            height: clamp(136px, min(40vw, 35vh), 192px);
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            background: radial-gradient(circle at 48% 48%, #162470 0%, #0b1347 56%, #040724 100%);
            box-shadow:
                0 0 36px rgba(39, 215, 255, 0.36),
                0 0 74px rgba(99, 102, 241, 0.4),
                0 0 105px rgba(223, 79, 255, 0.26);
            border: 1px solid rgba(56, 189, 248, 0.32);
            will-change: transform;
            transition: box-shadow 0.35s ease;
        }
        .live-orb-aurora {
            position: absolute;
            inset: -26%;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }
        .live-orb-aurora.aurora-cyan {
            background: radial-gradient(circle at 24% 32%, #00f0ff 0%, rgba(39, 215, 255, 0.92) 22%, rgba(59, 130, 246, 0.72) 45%, transparent 72%);
            animation: orbAuroraDrift 9s ease-in-out infinite;
        }
        .live-orb-aurora.aurora-violet {
            background: radial-gradient(circle at 76% 70%, #df4fff 0%, rgba(168, 85, 247, 0.9) 26%, rgba(99, 102, 241, 0.65) 48%, transparent 74%);
            animation: orbAuroraCounter 11s ease-in-out infinite;
        }
        .live-orb-aurora.aurora-highlight {
            inset: 0;
            z-index: 3;
            background: radial-gradient(circle at 38% 34%, rgba(224, 242, 254, 0.45) 0%, rgba(56, 189, 248, 0.16) 22%, transparent 50%);
            mix-blend-mode: screen;
        }
        .live-orb-glass {
            position: absolute;
            inset: 0;
            z-index: 4;
            border-radius: 50%;
            box-shadow:
                inset 0 2px 14px rgba(56, 189, 248, 0.45),
                inset 0 -16px 32px rgba(3, 6, 30, 0.78);
            pointer-events: none;
        }
        .live-orb-eyes {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14%;
            padding-bottom: 3%;
            pointer-events: none;
            will-change: transform;
        }
        .live-orb-eye {
            width: 11%;
            height: 21%;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%);
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.88),
                0 0 24px rgba(39, 215, 255, 0.58);
            transform-origin: center center;
            will-change: transform, opacity;
            animation: orbEyeBlink 4.8s ease-in-out infinite;
        }
        .live-orb-core.tap-blink .live-orb-eye {
            animation: orbTapBlink 0.22s ease-in-out 1;
        }

        /* State-driven 60fps Orb Motion */
        .live-modal.listening .live-orb-core { animation: listeningPulse 2.4s ease-in-out infinite; }
        .live-modal.listening .live-orb-eyes { animation: orbEyesListen 6.4s ease-in-out infinite; }
        .live-modal.listening .live-wave { animation: waveRipple 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
        .live-modal.listening .live-wave.wave-secondary { animation: waveRipple 2.4s cubic-bezier(0.22, 1, 0.36, 1) 1.2s infinite; }

        .live-modal.thinking .live-orb-core {
            animation: thinkingBreathe 1.6s ease-in-out infinite;
            box-shadow:
                0 0 44px rgba(99, 102, 241, 0.55),
                0 0 88px rgba(168, 85, 247, 0.5),
                0 0 118px rgba(223, 79, 255, 0.3);
        }
        .live-modal.thinking .live-orb-eyes { animation: orbEyesThink 2.4s ease-in-out infinite; }
        .live-modal.thinking .live-orb-eye { animation: orbEyeBlinkThink 3.6s ease-in-out infinite; }
        .live-modal.thinking .live-orb-aurora.aurora-cyan { animation: orbSwirlFast 2.2s linear infinite; }
        .live-modal.thinking .live-orb-aurora.aurora-violet { animation: orbSwirlReverse 2.8s linear infinite; }
        .live-modal.thinking .live-orb-glow { transform: scale(1.08); opacity: 1; }

        .live-modal.speaking .live-orb-core {
            animation: speakingBounce 0.65s ease-in-out infinite alternate;
            box-shadow:
                0 0 52px rgba(39, 215, 255, 0.58),
                0 0 92px rgba(139, 92, 246, 0.52),
                0 0 124px rgba(223, 79, 255, 0.36);
        }
        .live-modal.speaking .live-orb-eyes { animation: orbEyesSpeak 0.65s ease-in-out infinite alternate; }
        .live-modal.speaking .live-orb-eye {
            box-shadow:
                0 0 16px rgba(255, 255, 255, 0.96),
                0 0 30px rgba(39, 215, 255, 0.8),
                0 0 42px rgba(223, 79, 255, 0.45);
        }
        .live-modal.speaking .live-wave { animation: waveRippleSpeak 1.35s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
        .live-modal.speaking .live-wave.wave-secondary { animation: waveRippleSpeak 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.68s infinite; }
        .live-modal.speaking .live-orb-glow { transform: scale(1.16); opacity: 1; }

        @keyframes orbEyeBlink {
            0%, 44%, 48%, 90%, 94%, 97%, 100% { transform: scaleY(1) scaleX(1); }
            46%, 92% { transform: scaleY(0.08) scaleX(1.14); }
            95.5% { transform: scaleY(0.1) scaleX(1.1); }
        }
        @keyframes orbEyeBlinkThink {
            0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(0.76) scaleX(1.04); }
            46%, 94% { transform: scaleY(0.08) scaleX(1.14); }
        }
        @keyframes orbTapBlink {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            50% { transform: scaleY(0.08) scaleX(1.16); }
        }
        @keyframes orbEyesListen {
            0%, 100% { transform: translate(0%, 0%); }
            30% { transform: translate(3.5%, -1.5%); }
            65% { transform: translate(-3%, 1%); }
        }
        @keyframes orbEyesThink {
            0%, 100% { transform: translate(5%, -6%); }
            50% { transform: translate(8%, -8%); }
        }
        @keyframes orbEyesSpeak {
            0% { transform: translateY(1%) scaleY(0.96); }
            100% { transform: translateY(-2.5%) scaleY(1.04); }
        }

        @keyframes orbAuroraDrift {
            0%, 100% { transform: translate(-4%, -3%) rotate(0deg) scale(1); }
            50% { transform: translate(6%, 5%) rotate(180deg) scale(1.08); }
        }
        @keyframes orbAuroraCounter {
            0%, 100% { transform: translate(5%, 4%) rotate(0deg) scale(1.04); }
            50% { transform: translate(-5%, -6%) rotate(-180deg) scale(0.96); }
        }
        @keyframes orbSwirlFast {
            0% { transform: rotate(0deg) scale(1.06); }
            100% { transform: rotate(360deg) scale(1.06); }
        }
        @keyframes orbSwirlReverse {
            0% { transform: rotate(360deg) scale(1.04); }
            100% { transform: rotate(0deg) scale(1.04); }
        }
        @keyframes listeningPulse {
            0%, 100% { transform: scale(0.97); }
            50% { transform: scale(1.045); }
        }
        @keyframes thinkingBreathe {
            0%, 100% { transform: scale(0.96); }
            50% { transform: scale(1.035); }
        }
        @keyframes speakingBounce {
            0% { transform: scale(0.99); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1.11); }
        }
        @keyframes waveRipple {
            0% { transform: scale(1); opacity: 0.65; }
            100% { transform: scale(1.55); opacity: 0; }
        }
        @keyframes waveRippleSpeak {
            0% { transform: scale(1); opacity: 0.75; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        /* Single-line Centered State Text Below Circle (No Button Style) */
        .live-status-container {
            text-align: center;
            max-width: 520px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .live-state-text {
            font-size: clamp(1.12rem, 3.2vw, 1.32rem);
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #e2e8f0;
            line-height: 1.35;
            white-space: nowrap;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }
        .live-modal.listening .live-state-text {
            color: #e0f2fe;
            text-shadow: 0 0 18px rgba(39, 215, 255, 0.32);
        }
        .live-modal.thinking .live-state-text {
            color: #e9d5ff;
            text-shadow: 0 0 18px rgba(168, 85, 247, 0.36);
        }
        .live-modal.speaking .live-state-text {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(223, 79, 255, 0.4);
        }
        .live-transcript-box {
            font-size: clamp(0.92rem, 2.5vw, 1.05rem);
            color: rgba(203, 213, 225, 0.76);
            line-height: 1.5;
            font-weight: 400;
            text-wrap: balance;
            min-height: 24px;
        }
        .live-transcript-box:empty {
            display: none;
        }
        .live-controls {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40px;
        }
        .live-interrupt-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(24, 28, 56, 0.72);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
            backdrop-filter: blur(12px);
        }
        .live-modal.speaking .live-interrupt-pill {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .live-interrupt-pill:hover {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.5);
            color: #ffffff;
        }
        .live-interrupt-pill:active { transform: scale(0.95); }

        @media (max-height: 540px) {
            .live-modal { padding-bottom: 12px; }
            .live-center-stage { gap: 12px; padding: 8px 16px; }
            .live-controls { min-height: 24px; }
        }
    </style>
</head>

<body>
    <div id="appToast" class="app-toast"></div>

        const API_URL = `${WORKER_BASE}/groq`;
        const GROQ_STT_URL = `${WORKER_BASE}/groq-stt`;
        const SARVAM_STT_URL = `${WORKER_BASE}/sarvam-stt`;

        function escapeHtmlPlain(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeMarkdownForRender(text) {
            if (!text || typeof text !== 'string') return '';
            const codeBlocks = [];
            let normalized = text.replace(/\r\n/g, '\n').replace(/(```[\s\S]*?```)/g, (match) => {
                const id = `__NKS_CODE_${codeBlocks.length}__`;
                codeBlocks.push(match);
                return id;
            });

            normalized = normalized.replace(/^(#{1,6})([^\s#])/gm, '$1 $2');
            normalized = normalized.replace(/^(\s*)[•◦▪▸‣●]\s+/gm, '$1- ');
            normalized = normalized.replace(/^\*\*([^*\n]{2,65}):?\*\*\s*$/gm, '### $1');

            const lines = normalized.split('\n');
            const out = [];
            for (let i = 0; i < lines.length; i++) {
                const cur = lines[i];
                const prev = out.length > 0 ? out[out.length - 1] : '';
                const isHeading = /^\s*#{1,6}\s+/.test(cur);
                const isListItem = /^\s*(?:[-*+]|\d+\.)\s+/.test(cur);
                const prevIsBlank = !prev.trim();
                const prevIsHeading = /^\s*#{1,6}\s+/.test(prev);
                const prevIsListItem = /^\s*(?:[-*+]|\d+\.)\s+/.test(prev);

                if (i > 0 && !prevIsBlank) {
                    if (isHeading || (isListItem && !prevIsListItem && !prevIsHeading) || (prevIsHeading && cur.trim())) {
                        out.push('');
                    }
                }
                out.push(cur);
            }

            normalized = out.join('\n').replace(/\n{3,}/g, '\n\n');
            normalized = normalized.replace(/__NKS_CODE_(\d+)__/g, (_, idx) => codeBlocks[Number(idx)] ?? '');
            return normalized.trim();
        }

        function renderMarkdownClean(text, options = {}) {
            if (!text) return '';
            const shouldHighlight = options.highlight !== false;
            try {
                const normalized = normalizeMarkdownForRender(text);
                const rawHtml = (typeof marked !== 'undefined')
                    ? marked.parse(normalized)
                    : `<p>${escapeHtmlPlain(normalized).replace(/\n/g, '<br>')}</p>`;
                const safeHtml = (typeof DOMPurify !== 'undefined')
                    ? DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } })
                    : rawHtml;

                const temp = document.createElement('div');
                temp.innerHTML = safeHtml;

                temp.querySelectorAll('table').forEach(table => {
                    const wrap = document.createElement('div');
                    wrap.className = 'table-scroll-wrap';
                    table.parentNode.insertBefore(wrap, table);
                    wrap.appendChild(table);
                });

                temp.querySelectorAll('a').forEach(a => {
                    const href = a.getAttribute('href') || '';
                    if (/^https?:\/\//i.test(href)) {
                        a.setAttribute('target', '_blank');
                        a.setAttribute('rel', 'noopener noreferrer');
                    } else if (!href.startsWith('#')) {
                        a.removeAttribute('href');
                    }
                });

                temp.querySelectorAll('pre').forEach(pre => {
                    const code = pre.querySelector('code');
                    let lang = 'code';
                    if (code) {
                        const langClass = Array.from(code.classList).find(c => c.startsWith('language-'));
                        if (langClass) lang = langClass.replace('language-', '');
                        if (shouldHighlight && window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }
                    }
                    const card = document.createElement('div');
                    card.className = 'code-card';
                    card.innerHTML = `<div class="code-card-header"><span>${escapeHtmlPlain(lang)}</span><button class="code-card-copy-btn" type="button" onclick="copyCodeFromCard(this)"><i class="fa-regular fa-copy"></i> <span>Copy</span></button></div>`;
                    pre.parentNode.insertBefore(card, pre);

                });

                return temp.innerHTML;
            } catch (err) {
                return `<p>${escapeHtmlPlain(text).replace(/\n/g, '<br>')}</p>`;
            }
        }

        function closePartialCodeFence(text) {

        function animateAIReplyTyping(bubble, fullText) {
            return new Promise((resolve) => {
                const text = String(fullText || '');
                const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const tokens = text.match(/\S+\s*/g);
                if (reduceMotion || !tokens || tokens.length <= 2) {
                    bubble.innerHTML = renderMarkdownClean(text);
                    resolve();
                    return;
                }

                const total = tokens.length;
                const step = total > 180 ? 4 : (total > 75 ? 2 : 1);
                const intervalMs = total > 180 ? 18 : (total > 75 ? 22 : 26);
                let idx = 0;

                function tick() {
                    if (!bubble.isConnected) {
                        resolve();
                        return;
                    }
                    idx = Math.min(total, idx + step);
                    const isDone = idx >= total;
                    const slice = isDone ? text : closePartialCodeFence(tokens.slice(0, idx).join(''));
                    bubble.innerHTML = renderMarkdownClean(slice, { highlight: isDone });

                    const distFromBottom = mainContent.scrollHeight - mainContent.scrollTop - mainContent.clientHeight;
                    if (distFromBottom < 140) {
                        mainContent.scrollTop = mainContent.scrollHeight;
                    }

                    if (isDone) {
                        resolve();
                    } else {
                        setTimeout(() => requestAnimationFrame(tick), intervalMs);
                    }
                }

                requestAnimationFrame(tick);
            });
        }

        function cleanTeluguOutput(text) {
            if (!text || typeof text !== "string") return text;
            return text.split(/(```[\s\S]*?```)/g).map(part => {
                if (part.startsWith('```')) return part;
                let t = part.replace(/<think>[\s\S]*?<\/think>/gi, '');
                t = t.replace(/^(నక్షత్ర\s*(AI)?|Nakshatra\s*(AI)?|Assistant|AI|Bot)\s*[:：\-–]\s*/i, '');
                t = t.replace(/నేను\s*మీకు\s*ఎలా\s*సహాయపడగలను\??/gu, 'చెప్పండి, ఏంటి విశేషాలు?');
                t = t.replace(/\bI am doing well,\s*how are you\??/gi, "Hey! I'm doing great, how's it going?");
                t = t.replace(/\bHow can I help you\??/gi, "What's on your mind?");
                t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1').replace(/[\u0400-\u04FF\u4E00-\u9FFF\u0600-\u06FF]/g, '');
                return t;
            }).join('').trim();
        }

        function sanitizeForSpeech(text) {
            let s = cleanTeluguOutput(text || '');
            if (!s) return '';
            const isTeluguText = /[\u0C00-\u0C7F]/.test(s);
            s = s.replace(/```[\s\S]*?```/g, ' ')
                .replace(/https?:\/\/\S+/gi, '')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ')
                .replace(/₹\s*(\d[\d,]*)/g, isTeluguText ? '$1 రూపాయలు' : '$1 rupees')
                .replace(/\bRs\.?\s*(\d[\d,]*)/gi, isTeluguText ? '$1 రూపాయలు' : '$1 rupees')
                .replace(/(\d+(?:\.\d+)?)\s*%/g, '$1 percent')
                .replace(/\s*&\s*/g, ' and ')
                .replace(/[*_#`~>|]/g, ' ')
                .replace(/\(([^()]{1,60})\)/g, ', $1, ')
                .replace(/\s*[—–]\s*/g, ', ')
                .replace(/\r?\n+/g, '. ')
                .replace(/\.{2,}/g, '. ')
                .replace(/\s+([.,!?])/g, '$1')
                .replace(/\s+/g, ' ')
                .trim();
            return s;
        }

        function splitSpeechChunks(cleanText) {
            const txt = String(cleanText || '').trim();
            if (!txt || txt.length <= 58) return txt ? [txt] : [];
            const rawParts = txt.split(/(?<=[.!?।])\s+/).map(p => p.trim()).filter(Boolean);
            if (rawParts.length <= 1) return [txt];
            const merged = [];
            for (const part of rawParts) {
                if (merged.length > 0 && (merged[merged.length - 1].length < 22 || part.length < 18)) {
                    merged[merged.length - 1] += ' ' + part;
                } else if (merged.length >= 3) {
                    merged[merged.length - 1] += ' ' + part;
                } else {
                    merged.push(part);
                }
            }
            return merged.length ? merged : [txt];
        }

        function manageConversationHistory(history, maxTurns = 8) {
            return history.slice(-(maxTurns * 2));
        }

        function isReplyCutOff(text) {
            if (!text) return false;
            const t = text.trim();
            if (t.endsWith("```")) return false;
            const lastLine = (t.split("\n").pop() || "").trim();
            if (/^(#{1,6}\s|-{3,}|\|)/.test(lastLine)) return false;
            return !/[.?!।…]$/.test(t.replace(/[*_`"' )\]>]+$/g, ""));
        }

        function classifyPromptComplexity(text) {
            const t = (text || '').trim();
            const lower = t.toLowerCase();
            const hasDeepKeyword = /\b(puzzle|riddle|trick|logic|logical|paradox|brain\s*teaser|solve|calculate|compute|evaluate|prove|proof|derivation|compare|analyze|debug|algorithm|probability|pattern|sequence|missing\s+number|odd\s+one|truth|liar|knight|knave|how\s+many|ratio|percent|percentage|equation|find\s+x|step\s+by\s+step|verify|fact\s+check|difference\s+between|write\s+code|podupu)\b/i.test(lower)
                || /(పొడుపు|తర్కం|లెక్క|సమాధానం|ఎంత|తేడా|పోల్చు|కోడ్)/.test(t);
            const hasMultiConstraint = /\b(if|suppose|assuming|all\s+\w+\s+are|none\s+of|either|neither|only\s+one|twice|half|times\s+as|heavier|lighter|older|younger|weigh|door|hat|coin|box|train|speed|distance|clock|angle)\b/i.test(lower);
            const hasCode = /(```|\bfunction\b|\bclass\b|\bconst\b|\bdef\b|\bSELECT\b|\bTypeError\b|\bException\b)/i.test(t);
            const hasMathNumbers = (t.match(/\d+(?:\.\d+)?/g) || []).length >= 2 && /[?+\-*/=^%]|\b(total|sum|cost|left|remaining|find|many|much)\b/i.test(lower);
            return hasDeepKeyword || hasMultiConstraint || hasCode || hasMathNumbers || t.length > 180;
        }

        function getPlaybackAudioContext() {
