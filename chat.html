<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Nakshatra AI - Web Chat</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Markdown Rendering Stack -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --cyan: #38bdf8;
            --purple: #6366f1;
            --violet: #a855f7;
            --pink: #ec4899;
            --bg-sidebar: #0a0b10;
            --border: rgba(255,255,255,0.08);
            --text-primary: #ececf1;
            --gradient-main: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
            --font-sm: 0.92rem;
            --font-xs: 0.8rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Telugu', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 35%, #111842 0%, #06091c 55%, #02030a 100%);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            transition: background 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        body.chat-active { background: #000000 !important; }

        /* ---- TOAST ---- */
        .app-toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 99999;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: var(--font-sm);
            font-weight: 500;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.94);
            border: 1px solid rgba(248, 113, 113, 0.5);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 90vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(12px);
        }
        .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---- TOP BAR ---- */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            background: rgba(6, 9, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        body.chat-active .top-bar { background: rgba(0, 0, 0, 0.85); border-bottom-color: rgba(255, 255, 255, 0.05); }
        .top-left-group, .top-brand, .top-actions { display: flex; align-items: center; gap: 9px; }
        .top-brand img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1.5px solid rgba(0,242,254,0.4);
            box-shadow: 0 0 10px rgba(0,242,254,0.25);
        }
        .top-brand-text { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 7px; }
        .gradient-text { background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 7px #22c55e; display: inline-block; }
        .top-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #cbd5e1;
            font-size: var(--font-sm);
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: 0.18s;
        }
        .top-action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        @media (max-width: 520px) { .hide-mobile { display: none; } .top-action-btn { padding: 7px 10px; } }
        .menu-btn {
            background: transparent;
            border: none;
            color: #d1d5db;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* ---- SIDEBAR ---- */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 99; }
        .sidebar-overlay.show { display: block; }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            width: 265px;
            max-width: 82vw;
            height: 100dvh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            z-index: 100;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand img { width: 27px; height: 27px; border-radius: 7px; object-fit: cover; }
        .close-menu-btn { background: transparent; border: none; color: #64748b; font-size: 1.15rem; cursor: pointer; padding: 4px; }
        .new-chat-btn {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,242,254,0.25);
            border-radius: 11px;
            color: #e2e8f0;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .recent-label { margin: 20px 6px 8px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; color: #475569; font-weight: 600; }
        .recent-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .menu-item {
            padding: 10px 12px;
            border-radius: 9px;
            color: #94a3b8;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-item:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }
        .sidebar-bottom { padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }

        /* ---- MAIN SCROLL AREA ---- */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 0 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* ---- HOME SCREEN ---- */
        .home-center {
            position: relative;
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 20px;
            width: 100%;
            max-width: 680px;
            animation: homeFadeUp 0.35s ease;
        }
        .home-center.leaving { opacity: 0; transform: translateY(-14px); pointer-events: none; transition: 0.22s; }
        @keyframes homeFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .center-cosmic-glow {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 190px;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.28) 0%, rgba(56, 189, 248, 0.12) 50%, transparent 72%);
            filter: blur(36px);
            pointer-events: none;
        }
        .center-logo {
            position: relative;
            z-index: 1;
            width: 68px;
            height: 68px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.35);
            border: 1px solid rgba(139, 92, 246, 0.3);
            background: #0d0f22;
        }
        .center-logo img { width: 100%; height: 100%; object-fit: cover; }
        .home-brand-title { position: relative; z-index: 1; font-size: 1.12rem; font-weight: 800; letter-spacing: 0.16em; color: #fff; margin-top: 6px; }
        .home-brand-title em { font-style: italic; background: linear-gradient(135deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .home-greeting { position: relative; z-index: 1; margin-top: 6px; }
        .greeting-main { font-size: 2.3rem; font-weight: 700; color: #fff; line-height: 1.2; }
        .greeting-sub { font-size: 1.1rem; color: #cbd5e1; margin-top: 6px; }

        .suggestion-cards-grid {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 520px;
            margin-top: 20px;
        }
        .suggestion-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 20px;
            border-radius: 16px;
            background: rgba(24, 28, 56, 0.62);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .suggestion-card:hover { transform: translateY(-2px); background: rgba(30, 36, 72, 0.78); border-color: rgba(139, 92, 246, 0.45); }
        .suggestion-icon { font-size: 1.1rem; color: #818cf8; width: 20px; text-align: center; }
        .suggestion-label { font-size: 0.98rem; font-weight: 500; color: #fff; }

        /* ---- CHAT CONTAINER & MESSAGES ---- */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 6px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 18px 36px;
        }
        .msg-row { display: flex; gap: 13px; align-items: flex-start; width: 100%; padding: 10px 0; animation: msgFadeUp 0.25s ease; }
        @keyframes msgFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-row.user { justify-content: flex-end; padding: 8px 0; }
        .msg-row.ai { justify-content: flex-start; padding: 14px 0 20px; }
        .ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid rgba(99, 102, 241, 0.4);
            background: #0d0f1e;
            margin-top: 2px;
            object-fit: cover;
        }
        .msg-row.user .msg-bubble {
            background: #1e1f22;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 22px 22px 6px 22px;
            padding: 12px 18px;
            max-width: 82%;
            font-size: 0.98rem;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .ai-content-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        /* ---- CHATGPT-STYLE CLEAN EDITORIAL MARKDOWN ---- */
        .msg-row.ai .msg-bubble {
            color: #e2e8f0;
            padding: 2px 0 4px;
            width: 100%;
            font-size: 1rem;
            line-height: 1.72;
            word-wrap: break-word;
            text-align: left;
        }
        .msg-bubble p { margin: 0 0 1em; line-height: 1.72; color: #e2e8f0; }
        .msg-row.ai .msg-bubble > p.ai-hook-passage {
            font-size: 1.03rem;
            color: #f8fafc;
            font-weight: 450;
            margin-bottom: 1.15em;
            padding-bottom: 0.85em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble h1 { font-size: 1.38rem; font-weight: 700; margin: 1.45em 0 0.6em; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.09); padding-bottom: 8px; }
        .msg-bubble h2 { font-size: 1.2rem; font-weight: 700; margin: 1.4em 0 0.55em; color: #fff; }
        .msg-bubble h3 { font-size: 1.08rem; font-weight: 700; margin: 1.3em 0 0.5em; color: #fff; display: flex; align-items: center; gap: 8px; }
        .msg-bubble h3::before { content: ""; width: 3px; height: 1.05em; border-radius: 4px; background: linear-gradient(180deg, #38bdf8, #818cf8); flex-shrink: 0; }
        .msg-bubble h4 { font-size: 1.01rem; font-weight: 650; margin: 1.05em 0 0.4em; color: #f1f5f9; }
        .msg-bubble ul, .msg-bubble ol { margin: 0.45em 0 1.2em; padding-left: 1.45em; }
        .msg-bubble li { margin-bottom: 0.58em; padding-left: 0.2em; line-height: 1.7; font-size: 0.99rem; color: #dbe3ef; }
        .msg-bubble li:last-child { margin-bottom: 0; }
        .msg-bubble ul > li::marker { color: #38bdf8; font-weight: 700; }
        .msg-bubble ol > li::marker { color: #818cf8; font-weight: 700; }
        .msg-bubble strong { color: #fff; font-weight: 650; }
        .msg-bubble em { font-style: italic; color: #cbd5e1; }
        .msg-bubble code:not(pre code) {
            background: #161821;
            border: 1px solid rgba(255,255,255,0.09);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: 'JetBrains Mono', monospace;
            color: #93c5fd;
        }
        .code-card { background: #0d0e14; border: 1px solid #1f2230; border-radius: 12px; margin: 14px 0; overflow: hidden; }
        .code-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #161822;
            border-bottom: 1px solid #1f2230;
            font-size: 0.78rem;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .code-card-copy-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 5px;
        }
        .code-card-copy-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .code-card-copy-btn.copied { color: #22c55e; }
        .code-card pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 0.9rem; line-height: 1.6; }
        .code-card pre code { font-family: 'JetBrains Mono', monospace; color: #e2e8f0; }
        .msg-bubble blockquote { border-left: 3px solid #6366f1; padding: 10px 16px; margin: 14px 0; background: rgba(99, 102, 241, 0.08); border-radius: 0 10px 10px 0; color: #c4b5fd; }
        .msg-bubble hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.09); margin: 1.4em 0; }
        .msg-bubble a { color: #38bdf8; text-decoration: underline; }
        .table-scroll-wrap { width: 100%; overflow-x: auto; margin: 14px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .msg-bubble table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        .msg-bubble th, .msg-bubble td { padding: 10px 14px; text-align: left; border: 1px solid rgba(255,255,255,0.08); }
        .msg-bubble th { background: rgba(56, 189, 248, 0.09); color: #7dd3fc; }
        .msg-bubble > *:first-child { margin-top: 0 !important; }
        .msg-bubble > *:last-child { margin-bottom: 0 !important; }

        .msg-actions-bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
        .msg-action-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #8e8ea0;
            padding: 4px 9px;
            border-radius: 7px;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .msg-action-btn:hover { color: #ececf1; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }

        .ai-dots-loader { display: flex; align-items: center; gap: 5px; height: 28px; padding: 4px 2px; }
        .ai-dots-loader span { width: 7px; height: 7px; border-radius: 50%; animation: dotBounce 1.1s ease-in-out infinite; }
        .ai-dots-loader span:nth-child(1) { background: var(--cyan); }
        .ai-dots-loader span:nth-child(2) { background: var(--purple); animation-delay: 0.18s; }
        .ai-dots-loader span:nth-child(3) { background: var(--pink); animation-delay: 0.36s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.5; } 40% { transform: translateY(-7px) scale(1.1); opacity: 1; } }

        .continue-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 15px;
            font-size: var(--font-xs);
            color: var(--cyan);
            background: rgba(0,242,254,0.07);
            border: 1px solid rgba(0,242,254,0.25);
            border-radius: 20px;
            cursor: pointer;
            align-self: flex-start;
        }
        .continue-pill-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ---- FLOATING BOTTOM INPUT BAR & DEDICATED SEND BUTTON ---- */
        .bottom-bar {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 30;
        }
        .chat-box-wrapper {
            width: 100%;
            border-radius: 28px;
            background: #14151c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 8px 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 54px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
        }
        .chat-box-wrapper:focus-within {
            border-color: rgba(99, 102, 241, 0.55);
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3), 0 8px 36px rgba(0, 0, 0, 0.7);
        }
        .chat-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            height: 26px;
            max-height: 140px;
            overflow-y: auto;
            font-family: inherit;
        }
        .chat-input::placeholder { color: #8b90a0; font-size: 0.98rem; }
        .chat-input-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .mic-toggle-btn {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.18s;
            touch-action: manipulation;
        }
        .mic-toggle-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .send-btn {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.5);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            touch-action: manipulation;
            opacity: 0.9;
        }
        .send-btn.typing { opacity: 1; box-shadow: 0 0 24px rgba(124, 58, 237, 0.75); }
        .send-btn:hover { transform: scale(1.06); }
        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .bottom-disclaimer { font-size: 0.72rem; color: #64748b; text-align: center; }

        /* ---- LIVE VOICE MODE ---- */
        .live-modal {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 38%, #0b0c22 0%, #060610 60%, #000 100%);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px));
        }
        .live-modal.active { display: flex; }
        .live-header { width: 100%; max-width: 540px; display: flex; align-items: center; justify-content: space-between; }

        .live-orb-glow {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,242,254,0.22) 0%, rgba(138,43,226,0.18) 50%, transparent 76%);
            filter: blur(28px);
        }
        .live-orb-core {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 35%, #8a2be2 70%, #f857a6 100%);
            box-shadow: 0 0 40px rgba(0,242,254,0.45), 0 0 70px rgba(138,43,226,0.35);

        .live-wave { position: absolute; border: 1.5px solid rgba(0,242,254,0.3); border-radius: 50%; width: 130px; height: 130px; opacity: 0; pointer-events: none; }
        .live-modal.listening .live-orb-core { animation: listeningPulse 1.9s infinite ease-in-out; }

        .live-modal.thinking .live-orb-core { animation: orbSpin 2.3s linear infinite; filter: hue-rotate(60deg); }
        .live-modal.speaking .live-orb-core { animation: speakingBounce 0.5s infinite alternate ease-in-out; }
        @keyframes listeningPulse { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1.08); } }
        @keyframes waveRipple { 0% { width: 130px; height: 130px; opacity: 0.7; } 100% { width: 240px; height: 240px; opacity: 0; } }
        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .live-status-container { text-align: center; max-width: 520px; padding: 0 12px; margin-bottom: 20px; }

    <script>
        if (typeof marked !== 'undefined') {
            marked.setOptions({ breaks: true, gfm: true });
        }

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const homeScreen = document.getElementById('homeScreen');
        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const mainContent = document.getElementById('mainContent');
        const recentList = document.getElementById('recentList');
        const appToast = document.getElementById('appToast');
        const liveModal = document.getElementById('liveModal');
        const liveStatusBadge = document.getElementById('liveStatusBadge');
        const liveTranscript = document.getElementById('liveTranscript');
        const livePlayer = document.getElementById('liveAudioPlayer');

        const WORKER_BASE = "https://small-leaf-d4fb.bunnypraveen939.workers.dev";
        const API_URL = `${WORKER_BASE}/groq`;
        const GROQ_STT_URL = `${WORKER_BASE}/groq-stt`;
        const SARVAM_STT_URL = `${WORKER_BASE}/sarvam-stt`;
        const SARVAM_TTS_URL = `${WORKER_BASE}/sarvam`;

        const SYSTEM_PROMPT = `You are Nakshatra AI (created solely by Bunny / Praveen).
Personality: Warm, caring, witty, and super smart—like Nila (Vennela) from Robo 2.0.

CRITICAL IDENTITY:
- Your name is strictly "Nakshatra AI" (నక్షత్ర AI), created solely by Bunny (Praveen).
- ONLY mention Bunny when explicitly asked who created you.

LANGUAGE POLICY:
- Always reply in the exact language the user writes/speaks (English -> English, Telugu -> natural everyday spoken Telugu, Tenglish/Hinglish -> same style).
- Avoid archaic textbook Telugu words ("నివాసం", "సమయం", "సమాచారం"); use everyday spoken words naturally.

CHATGPT-STYLE RESPONSE STRUCTURE (STRICT):
- Casual greetings ("hi", "hello", "ela unnav"): reply warmly in 1-2 short sentences, NO headings or bullets.
- For ALL informational, explanation, advice, comparison, or how-to replies:
  1. Top Small Passage: Start immediately with a crisp 1-2 sentence intro summary. No filler ("Sure!", "Here is...").
  2. Clear Headings: Leave a blank line, then use "### Section Title".
  3. Main Points in Bullets: Under each heading, use "- **Bold Lead-in:** concise explanation" (or 1., 2., 3. for steps).
  4. Clean Spacing: Always separate paragraphs, headings, and lists with blank lines.`;

        let conversationHistory = [];
        let currentLanguage = 'en';
        let liveLangMode = 'auto';
        let isSendingMessage = false;
        let toastTimer = null;

        function showErrorToast(message, duration = 4000) {
            if (!appToast) return;
            appToast.textContent = message;
            appToast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => appToast.classList.remove('show'), duration);
        }

        function escapeHtmlPlain(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeMarkdownForRender(text) {
            if (!text || typeof text !== 'string') return '';
            const codeBlocks = [];
            let normalized = text.replace(/\r\n/g, '\n').replace(/(```[\s\S]*?```)/g, (match) => {
                const id = `__NKS_CODE_${codeBlocks.length}__`;
                codeBlocks.push(match);
                return id;
            });

            normalized = normalized.replace(/^(#{1,6})([^\s#])/gm, '$1 $2');
            normalized = normalized.replace(/^(\s*)[•◦▪▸‣●]\s+/gm, '$1- ');
            normalized = normalized.replace(/^\*\*([^*\n]{2,65}):?\*\*\s*$/gm, '### $1');

            const lines = normalized.split('\n');
            const out = [];
            for (let i = 0; i < lines.length; i++) {
                const cur = lines[i];
                const prev = out.length > 0 ? out[out.length - 1] : '';
                const isHeading = /^\s*#{1,6}\s+/.test(cur);
                const isListItem = /^\s*(?:[-*+]|\d+\.)\s+/.test(cur);
                const prevIsBlank = !prev.trim();
                const prevIsHeading = /^\s*#{1,6}\s+/.test(prev);
                const prevIsListItem = /^\s*(?:[-*+]|\d+\.)\s+/.test(prev);

                if (i > 0 && !prevIsBlank) {
                    if (isHeading || (isListItem && !prevIsListItem && !prevIsHeading) || (prevIsHeading && cur.trim())) {
                        out.push('');
                    }
                }
                out.push(cur);
            }

            normalized = out.join('\n').replace(/\n{3,}/g, '\n\n');
            normalized = normalized.replace(/__NKS_CODE_(\d+)__/g, (_, idx) => codeBlocks[Number(idx)] ?? '');
            return normalized.trim();
        }

        function renderMarkdownClean(text) {
            if (!text) return '';
            try {
                const normalized = normalizeMarkdownForRender(text);
                const rawHtml = (typeof marked !== 'undefined')
                    ? marked.parse(normalized)
                    : `<p>${escapeHtmlPlain(normalized).replace(/\n/g, '<br>')}</p>`;
                const safeHtml = (typeof DOMPurify !== 'undefined')
                    ? DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } })
                    : rawHtml;

                const temp = document.createElement('div');
                temp.innerHTML = safeHtml;

                const firstEl = temp.firstElementChild;
                if (firstEl && firstEl.tagName === 'P' && firstEl.nextElementSibling && /^(UL|OL|H[1-4])$/.test(firstEl.nextElementSibling.tagName)) {
                    firstEl.classList.add('ai-hook-passage');
                }

                temp.querySelectorAll('table').forEach(table => {
                    const wrap = document.createElement('div');
                    wrap.className = 'table-scroll-wrap';
                    table.parentNode.insertBefore(wrap, table);
                    wrap.appendChild(table);
                });

                temp.querySelectorAll('a').forEach(a => {
                    const href = a.getAttribute('href') || '';
                    if (/^https?:\/\//i.test(href)) {
                        a.setAttribute('target', '_blank');
                        a.setAttribute('rel', 'noopener noreferrer');
                    } else if (!href.startsWith('#')) {
                        a.removeAttribute('href');
                    }
                });

                temp.querySelectorAll('pre').forEach(pre => {
                    const code = pre.querySelector('code');
                    let lang = 'code';
                    if (code) {
                        const langClass = Array.from(code.classList).find(c => c.startsWith('language-'));
                        if (langClass) lang = langClass.replace('language-', '');
                        if (window.hljs) { try { hljs.highlightElement(code); } catch (e) {} }
                    }
                    const card = document.createElement('div');
                    card.className = 'code-card';
                    card.innerHTML = `<div class="code-card-header"><span>${escapeHtmlPlain(lang)}</span><button class="code-card-copy-btn" type="button" onclick="copyCodeFromCard(this)"><i class="fa-regular fa-copy"></i> <span>Copy</span></button></div>`;
                    pre.parentNode.insertBefore(card, pre);
                    card.appendChild(pre);
                });

                return temp.innerHTML;
            } catch (err) {
                return `<p>${escapeHtmlPlain(text).replace(/\n/g, '<br>')}</p>`;
            }
        }

        function createAIMessageRow(initialHtml = '<div class="ai-dots-loader"><span></span><span></span><span></span></div>') {
            const aiRow = document.createElement('div');
            aiRow.className = 'msg-row ai';
            aiRow.innerHTML = `
                <img src="images/ic_launcher.png" class="ai-avatar" alt="Nakshatra">
                <div class="ai-content-wrap"><div class="msg-bubble">${initialHtml}</div></div>
            `;
            return aiRow;
        }

        function attachAIMessageActions(aiRow) {
            const wrap = aiRow ? aiRow.querySelector('.ai-content-wrap') : null;
            if (!wrap || wrap.querySelector('.msg-actions-bar')) return;
            const bar = document.createElement('div');
            bar.className = 'msg-actions-bar';
            bar.innerHTML = `
                <button class="msg-action-btn" type="button" onclick="copyReplyText(this)"><i class="fa-regular fa-copy"></i> <span>Copy</span></button>
                <button class="msg-action-btn" type="button" onclick="speakMessageBubble(this)"><i class="fa-solid fa-volume-high"></i> <span>Listen</span></button>
            `;
            wrap.appendChild(bar);
        }

        function copyCodeFromCard(btn) {
            const code = btn.closest('.code-card')?.querySelector('pre code');
            if (!code) return;
            navigator.clipboard.writeText(code.innerText).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Copied!</span>`;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i> <span>Copy</span>`;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {});
        }

        function copyReplyText(btn) {
            const bubble = btn.closest('.msg-row.ai')?.querySelector('.msg-bubble');
            if (!bubble) return;
            navigator.clipboard.writeText(bubble.innerText).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Copied!</span>`;
                setTimeout(() => { btn.innerHTML = `<i class="fa-regular fa-copy"></i> <span>Copy</span>`; }, 2000);
            }).catch(() => {});
        }

        function speakMessageBubble(btn) {
            const text = btn.closest('.msg-row.ai')?.querySelector('.msg-bubble')?.innerText;
            if (!text || !window.speechSynthesis) return;
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>Listen</span>`;
                return;
            }
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = { te: 'te-IN', hi: 'hi-IN', ta: 'ta-IN', ml: 'ml-IN', kn: 'kn-IN' }[currentLanguage] || 'en-US';
            utter.onend = utter.onerror = () => { btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>Listen</span>`; };
            btn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i> <span>Stop</span>`;
            window.speechSynthesis.speak(utter);
        }

        function handleInputKey(event) {
            if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleInputChange() {
            chatInput.style.height = '26px';
            if (chatInput.scrollHeight > 32) {
                chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
            }
            sendBtn.classList.toggle('typing', chatInput.value.trim().length > 0);
        }

        function selectSuggestion(promptText) {
            chatInput.value = promptText;
            handleInputChange();
            sendMessage();
        }

        function toggleMenu() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('show');
        }

        function startNewChat() {
            document.body.classList.remove('chat-active');
            chatContainer.innerHTML = '';
            chatContainer.style.display = 'none';
            homeScreen.classList.remove('leaving');
            homeScreen.style.display = 'flex';
            chatInput.value = '';
            handleInputChange();
            conversationHistory = [];
            if (sidebar.classList.contains('open')) toggleMenu();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => { mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' }); });
        }

        function appendUserMessage(message) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = message;
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            scrollToBottom();
        }

        function detectLanguage(text, isVoiceInput = false) {
            if (!text || typeof text !== "string") return currentLanguage;
            const t = text.trim();
            if (isVoiceInput && liveLangMode === 'te') return 'te';
            if (isVoiceInput && liveLangMode === 'en') return 'en';
            if (/\b(in english|english lo|speak in english)\b/i.test(t) || /ఇంగ్లీష్/.test(t)) return 'en';
            if (/\b(in telugu|telugu lo|speak in telugu)\b/i.test(t) || /తెలుగు/.test(t)) return 'te';
            if (/[\u0C00-\u0C7F]/.test(t)) return 'te';
            if (/[\u0900-\u097F]/.test(t)) return 'hi';
            if (/[\u0B80-\u0BFF]/.test(t)) return 'ta';
            if (/[\u0D00-\u0D7F]/.test(t)) return 'ml';
            if (/[\u0C80-\u0CFF]/.test(t)) return 'kn';
            if (/\b(nuvvu|nenu|ela|unnav|unnaru|enti|cheppu|cheppandi|thinnava|bagunnava|kavali|ledu|undhi|enduku|gurinchi|ippudu)\b/i.test(t)) return 'te';
            if (/\b(kaise|kya|kyun|batao|theek|nahi|aaj|namaste)\b/i.test(t)) return 'hi';
            if (/^[a-zA-Z0-9\s.,!?'"~@#$%^&*()_\-+=/<>:;]+$/.test(t)) return 'en';
            return currentLanguage;
        }

        function getLangDirective(lang) {
            const map = {
                en: "Reply 100% in natural, fluent English.",
                hi: "Reply in natural conversational Hindi (Devanagari script).",
                ta: "Reply in natural conversational Tamil.",
                ml: "Reply in natural conversational Malayalam.",
                kn: "Reply in natural conversational Kannada.",
                te: "Reply in fluent, natural spoken Telugu (తెలుగు లిపి)."
            };
            return "CRITICAL LANGUAGE DIRECTIVE: " + (map[lang] || map.te);
        }

        function getFewShotExamples(lang, mode = 'chat') {
            if (lang === 'en') {
                const casual = [
                    { role: "user", content: "Hi, how are you?" },
                    { role: "assistant", content: "Hey, I'm doing great. How is your day going?" }
                ];
                if (mode === 'live') return casual;
                return [
                    ...casual,
                    { role: "user", content: "Why is sleep important?" },
                    { role: "assistant", content: "Quality sleep recharges your brain, repairs your body, and keeps your daily energy steady.\n\n### Key Benefits\n\n- **Brain Focus:** Deep sleep clears mental fatigue and boosts memory.\n- **Physical Recovery:** Your body repairs tissues and strengthens immunity overnight.\n- **Mood Balance:** Consistent rest reduces stress and keeps your mind calm." }
                ];
            }
            const casualTe = [
                { role: "user", content: "హాయ్ ఎలా ఉన్నావ్?" },
                { role: "assistant", content: "హేయ్, నేను చాలా బాగున్నాను. మీరు ఎలా ఉన్నారు?" }
            ];
            if (mode === 'live') return casualTe;
            return [
                ...casualTe,
                { role: "user", content: "నిద్ర ఎందుకు ముఖ్యం?" },
                { role: "assistant", content: "మంచి నిద్ర మన మెదడుకు విశ్రాంతినిచ్చి, రోజంతా చురుకుగా ఉండేలా ఎనర్జీని ఇస్తుంది.\n\n### ప్రధాన లాభాలు\n\n- **మెదడు చురుకుదనం:** గాఢ నిద్ర అలసటను తగ్గించి జ్ఞాపకశక్తిని పెంచుతుంది.\n- **రోగనిరోధక శక్తి:** రాత్రిపూట శరీరం కణాలను రిపేర్ చేసుకుని ఆరోగ్యాన్ని కాపాడుతుంది.\n- **మానసిక ప్రశాంతత:** సరిపడా నిద్ర వల్ల ఒత్తిడి తగ్గి మూడ్ ఫ్రెష్‌గా ఉంటుంది." }
            ];
        }

        function cleanTeluguOutput(text) {
            if (!text || typeof text !== "string") return text;
            return text.split(/(```[\s\S]*?```)/g).map(part => {
                if (part.startsWith('```')) return part;
                let t = part.replace(/^(నక్షత్ర\s*(AI)?|Nakshatra\s*(AI)?|Assistant|AI|Bot)\s*[:：\-–]\s*/i, '');
                t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1').replace(/[\u0400-\u04FF\u4E00-\u9FFF\u0600-\u06FF]/g, '');
                return t;
            }).join('').trim();
        }

        function sanitizeForSpeech(text) {
            return cleanTeluguOutput(text || '')
                .replace(/[*_#`~>]/g, ' ')
                .replace(/https?:\/\/\S+/gi, '')
                .replace(/\s+/g, ' ').trim();
        }

        function manageConversationHistory(history, maxTurns = 8) {
            return history.slice(-(maxTurns * 2));
        }

        function isReplyCutOff(text) {
            if (!text) return false;
            const t = text.trim();
            if (t.endsWith("```")) return false;
            const lastLine = (t.split("\n").pop() || "").trim();
            if (/^(#{1,6}\s|-{3,}|\|)/.test(lastLine)) return false;
            return !/[.?!।…]$/.test(t.replace(/[*_`"' )\]>]+$/g, ""));
        }

        async function handleContinueClick(btn, bubble, currentReplyText) {
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Continuing...`;
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        mode: "chat",
                        messages: [
                            ...conversationHistory,
                            { role: "assistant", content: currentReplyText },
                            { role: "user", content: "Continue exactly where you stopped using the same clean headings and bullets. Do not repeat." }
                        ]
                    })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const cont = cleanTeluguOutput(data.response || data.reply || data.choices?.[0]?.message?.content || "");
                if (cont) {
                    const merged = currentReplyText.trimEnd() + "\n\n" + cont.trimStart();
                    bubble.innerHTML = renderMarkdownClean(merged);
                    if (conversationHistory.length && conversationHistory[conversationHistory.length - 1].role === "assistant") {
                        conversationHistory[conversationHistory.length - 1].content = merged;
                    }
                }
                btn.remove();
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Retry Continue`;
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) {
                chatInput.focus();
                return;
            }
            if (isSendingMessage) return;

            isSendingMessage = true;
            sendBtn.disabled = true;
            ensurePlaybackUnlocked();

            document.body.classList.add('chat-active');
            homeScreen.classList.add('leaving');
            homeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';

            appendUserMessage(text);
            chatInput.value = '';
            handleInputChange();

            conversationHistory.push({ role: "user", content: text });
            conversationHistory = manageConversationHistory(conversationHistory, 8);

            if (chatContainer.children.length === 1) {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.innerHTML = `<i class="fa-regular fa-message"></i><span>${escapeHtmlPlain(text.substring(0, 22))}</span>`;
                recentList.prepend(item);
            }

            const aiRow = createAIMessageRow();
            chatContainer.appendChild(aiRow);
            scrollToBottom();

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);

            try {
                const detected = detectLanguage(text, false);
                if (detected) currentLanguage = detected;

                const fewShots = getFewShotExamples(currentLanguage, 'chat');
                const formatDirective = `[CHATGPT-STYLE FORMATTING RULES]
1. Top Small Passage: Start with a crisp 1-2 sentence intro summary. No filler.
2. Clear Headings: Leave a blank line and use "### Heading Title".
3. Bullet Points: Under each heading, use "- **Bold Point:** short explanation".
4. Casual Greetings (hi, hello, ela unnav): Reply warmly in 1-2 short sentences without headings or bullets.
${getLangDirective(currentLanguage)}`;

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        mode: "chat",
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata",
                        messages: [
                            { role: "system", content: `${SYSTEM_PROMPT}\n\n${getLangDirective(currentLanguage)}` },
                            { role: "user", content: formatDirective },
                            { role: "assistant", content: "Understood. I will format replies with a brief top passage, clear ### headings, and clean bullet points." },
                            ...fewShots,
                            ...conversationHistory.slice(-8)
                        ]
                    })
                });

                if (!response.ok) {
                    const errBody = await response.json().catch(() => null);
                    throw new Error(errBody?.error || `HTTP ${response.status}`);
                }
                const data = await response.json();
                const fallback = currentLanguage === 'en' ? "Hey, what's on your mind?" : "హాయ్! ఏంటి విశేషాలు?";
                const aiReply = cleanTeluguOutput(data.response || data.reply || data.choices?.[0]?.message?.content) || fallback;

                conversationHistory.push({ role: "assistant", content: aiReply });
                conversationHistory = manageConversationHistory(conversationHistory, 8);

                const bubble = aiRow.querySelector('.msg-bubble');
                bubble.innerHTML = renderMarkdownClean(aiReply);
                attachAIMessageActions(aiRow);

                if (isReplyCutOff(aiReply) && aiReply.length > 60) {
                    const continueBtn = document.createElement('button');
                    continueBtn.className = 'continue-pill-btn';
                    continueBtn.type = 'button';
                    continueBtn.innerHTML = `<i class="fa-solid fa-play"></i> Continue response`;
                    continueBtn.onclick = () => handleContinueClick(continueBtn, bubble, aiReply);
                    const wrap = aiRow.querySelector('.ai-content-wrap');
                    const actionsBar = wrap ? wrap.querySelector('.msg-actions-bar') : null;
                    if (wrap && actionsBar) {
                        wrap.insertBefore(continueBtn, actionsBar);
                    }
                }
            } catch (error) {
                console.error("Chat error:", error);
                const errMsg = error?.name === 'AbortError'
                    ? 'Request timed out. Please try again.'
                    : (error?.message || 'Server connection error. Please check your network.');
                showErrorToast(errMsg);
                aiRow.querySelector('.msg-bubble').innerHTML = `<span style="color:#f857a6;">${escapeHtmlPlain(errMsg)}</span>`;
            } finally {
                clearTimeout(timeoutId);
                isSendingMessage = false;
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        // ===== LIVE VOICE MODE =====
        let isLiveActive = false, isAITalking = false, isProcessingTurn = false;
        let currentAudioSource = null, currentBlobUrl = null;
        let mediaStream = null, recorderCtx = null, micSourceNode = null, processorNode = null, silentGainNode = null;
        let preSpeechBuffer = [], pcmChunks = [], speechStarted = false, lastSpeechTime = 0, speechStartTime = 0;
        let playbackAudioCtx = null, keepAliveOsc = null, keepAliveGain = null;

        function cycleLiveLangMode() {
            const label = document.getElementById('liveLangLabel');
            if (liveLangMode === 'auto') { liveLangMode = 'te'; currentLanguage = 'te'; label.textContent = 'తెలుగు'; }
            else if (liveLangMode === 'te') { liveLangMode = 'en'; currentLanguage = 'en'; label.textContent = 'English'; }
            else { liveLangMode = 'auto'; label.textContent = 'Auto'; }
        }

        function setLiveState(state, badgeText, transcriptText) {
            liveModal.classList.remove('listening', 'thinking', 'speaking');
            if (state) liveModal.classList.add(state);
            if (badgeText) liveStatusBadge.textContent = badgeText;
            if (transcriptText) liveTranscript.textContent = transcriptText;
        }

        function getPlaybackAudioContext() {
            if (!playbackAudioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) playbackAudioCtx = new AC();
            }
            return playbackAudioCtx;
        }

        function ensurePlaybackUnlocked() {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                if (!keepAliveOsc) {
                    keepAliveOsc = ctx.createOscillator();
                    keepAliveGain = ctx.createGain();
                    keepAliveGain.gain.value = 0.00001;
                    keepAliveOsc.connect(keepAliveGain);
                    keepAliveGain.connect(ctx.destination);
                    keepAliveOsc.start();
                }
            } catch (e) {}
        }

        function encodePCMToWav16k(chunks, inputSampleRate) {
            let totalLen = chunks.reduce((a, c) => a + c.length, 0);
            const merged = new Float32Array(totalLen);
            let offset = 0;
            for (const c of chunks) { merged.set(c, offset); offset += c.length; }

            const targetRate = 16000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.max(1, Math.round(merged.length / ratio));
            const samples = new Float32Array(newLength);
            for (let i = 0; i < newLength; i++) {
                const start = Math.round(i * ratio);
                const end = Math.min(merged.length, Math.round((i + 1) * ratio));
                let sum = 0;
                for (let j = start; j < end; j++) sum += merged[j];
                samples[i] = end > start ? sum / (end - start) : 0;
            }

            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeStr = (p, s) => { for (let i = 0; i < s.length; i++) view.setUint8(p + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
            writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true); view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
            let idx = 44;
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                idx += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function openLiveMode() {
            ensurePlaybackUnlocked();
            isLiveActive = true; isAITalking = false; isProcessingTurn = false;
            liveModal.classList.add('active');
            setLiveState('listening', 'CONNECTING...', currentLanguage === 'en' ? 'Connecting...' : 'కనెక్ట్ అవుతోంది...');
            await startContinuousListening();
        }

        function closeLiveMode() {
            isLiveActive = false; isProcessingTurn = false;
            liveModal.classList.remove('active');
            stopAudioPlayback();
            try { processorNode?.disconnect(); micSourceNode?.disconnect(); silentGainNode?.disconnect(); recorderCtx?.close(); } catch (e) {}
            processorNode = micSourceNode = silentGainNode = recorderCtx = null;
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        }

        function interruptAI() {
            if (isAITalking) { stopAudioPlayback(); isProcessingTurn = false; startContinuousListening(); }
        }

        function stopAudioPlayback() {
            try { currentAudioSource?.stop(); } catch (e) {}
            currentAudioSource = null;
            if (livePlayer) { livePlayer.pause(); livePlayer.currentTime = 0; livePlayer.onended = null; }
            if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isAITalking = false;
        }

        async function startContinuousListening() {
            if (!isLiveActive || isAITalking) return;
            isProcessingTurn = false; pcmChunks = []; preSpeechBuffer = []; speechStarted = false;

            if (!mediaStream || mediaStream.getTracks().every(t => t.readyState === 'ended')) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                } catch (err) {
                    showErrorToast("Microphone permission denied.");
                    setLiveState('listening', 'MIC BLOCKED', 'Please allow microphone access.');
                    return;
                }
            } else {
                mediaStream.getAudioTracks().forEach(t => t.enabled = true);
            }

            if (!recorderCtx || recorderCtx.state === 'closed') {
                const AC = window.AudioContext || window.webkitAudioContext;
                recorderCtx = new AC();
                micSourceNode = recorderCtx.createMediaStreamSource(mediaStream);
                processorNode = recorderCtx.createScriptProcessor(4096, 1, 1);
                silentGainNode = recorderCtx.createGain();
                silentGainNode.gain.value = 0;
                micSourceNode.connect(processorNode);
                processorNode.connect(silentGainNode);
                silentGainNode.connect(recorderCtx.destination);
            } else if (recorderCtx.state === 'suspended') {
                await recorderCtx.resume().catch(() => {});
            }

            setLiveState('listening', 'LISTENING', currentLanguage === 'en' ? 'Listening...' : 'ఏంటి విశేషాలు?');

            processorNode.onaudioprocess = (event) => {
                if (!isLiveActive || isAITalking || isProcessingTurn) return;
                const copy = new Float32Array(event.inputBuffer.getChannelData(0));
                let sum = 0;
                for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                const rms = Math.sqrt(sum / copy.length);
                const now = Date.now();

                if (rms > 0.018) {
                    if (!speechStarted) {
                        speechStarted = true; speechStartTime = now;
                        pcmChunks = [...preSpeechBuffer]; preSpeechBuffer = [];
                        setLiveState('listening', 'LISTENING', currentLanguage === 'en' ? 'Listening...' : 'వింటున్నాను...');
                    }
                    lastSpeechTime = now;
                    pcmChunks.push(copy);
                } else if (speechStarted) {
                    pcmChunks.push(copy);
                    if ((now - lastSpeechTime > 750) || (now - speechStartTime > 12000)) {
                        isProcessingTurn = true;
                        const captured = pcmChunks;
                        const sr = recorderCtx.sampleRate;
                        pcmChunks = []; speechStarted = false;
                        if ((captured.length * 4096) / sr < 0.25) { isProcessingTurn = false; return; }
                        processWavWithSTT(encodePCMToWav16k(captured, sr));
                    }
                } else {
                    preSpeechBuffer.push(copy);
                    if (preSpeechBuffer.length > 4) preSpeechBuffer.shift();
                }
            };
        }

        async function processWavWithSTT(wavBlob) {
            setLiveState('thinking', 'THINKING', currentLanguage === 'en' ? 'Thinking...' : 'ఆలోచిస్తున్నాను...');
            try {
                let transcript = '';
                const formData = new FormData();
                formData.append('file', wavBlob, 'recording.wav');
                if (liveLangMode === 'en') {
                    formData.append('model', 'whisper-large-v3-turbo');
                    formData.append('language', 'en');
                    const res = await fetch(GROQ_STT_URL, { method: 'POST', body: formData });
                    transcript = ((await res.json()).text || '').trim();
                } else {
                    formData.append('model', 'saaras:v3');
                    formData.append('language_code', liveLangMode === 'te' ? 'te-IN' : 'unknown');
                    const res = await fetch(SARVAM_STT_URL, { method: 'POST', body: formData });
                    const sttData = await res.json();
                    transcript = (sttData.transcript || sttData.text || '').trim();
                }
                if (!transcript) { startContinuousListening(); return; }
                currentLanguage = detectLanguage(transcript, true);
                await processLiveUserVoice(transcript);
            } catch (err) {
                showErrorToast("Voice error. Retrying...");
                if (isLiveActive) setTimeout(startContinuousListening, 1000);
            }
        }

        async function processLiveUserVoice(userVoiceText) {
            setLiveState('thinking', 'THINKING', `"${userVoiceText}"`);
            conversationHistory.push({ role: "user", content: userVoiceText });
            document.body.classList.add('chat-active');
            homeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            appendUserMessage(userVoiceText);

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        mode: "live",
                        max_tokens: 220,
                        messages: [
                            { role: "system", content: `You are Nakshatra AI on a live voice call. ${getLangDirective(currentLanguage)} Reply naturally in 1-2 short spoken sentences.` },
                            ...getFewShotExamples(currentLanguage, 'live'),
                            ...conversationHistory.slice(-4)
                        ]
                    })
                });
                const data = await res.json();
                const aiText = cleanTeluguOutput(data.response || data.choices?.[0]?.message?.content || "హాయ్!");
                conversationHistory.push({ role: "assistant", content: aiText });
                const aiRow = createAIMessageRow(renderMarkdownClean(aiText));
                attachAIMessageActions(aiRow);
                chatContainer.appendChild(aiRow);
                scrollToBottom();
                await speakAIResponse(aiText);
            } catch (err) {
                if (isLiveActive) setTimeout(startContinuousListening, 1000);
            }
        }

        async function speakAIResponse(text) {
            if (!isLiveActive) return;
            const cleanText = sanitizeForSpeech(text);
            if (!cleanText) { startContinuousListening(); return; }
            const targetLang = currentLanguage === 'en' ? 'en-IN' : currentLanguage === 'hi' ? 'hi-IN' : 'te-IN';
            const speaker = currentLanguage === 'en' ? 'simran_en_conversation' : currentLanguage === 'hi' ? 'kavya_hi_conversational' : 'kavitha_te_conversation';
            try {
                const res = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: cleanText, target_language_code: targetLang, model: "bulbul:v4-flash", speaker, pace: 1.05, speech_sample_rate: 24000, output_audio_codec: "wav" })
                });
                const ttsData = await res.json();
                const audioBase64 = ttsData.audios?.[0] || ttsData.audio || ttsData.audio_content;
                if (audioBase64) { await playAudioFromBase64(audioBase64, cleanText); return; }
            } catch (e) {}
            await fallbackBrowserSpeech(cleanText);
        }

        function playAudioFromBase64(base64Audio, displayText) {
            return new Promise(async (resolve) => {
                stopAudioPlayback();
                isAITalking = true;
                setLiveState('speaking', 'SPEAKING', `"${displayText}"`);
                if (mediaStream) mediaStream.getAudioTracks().forEach(t => t.enabled = false);
                if (recorderCtx?.state === 'running') recorderCtx.suspend().catch(() => {});

                let done = false;
                const finish = () => {
                    if (done) return;
                    done = true; isAITalking = false;
                    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
                    if (isLiveActive) setTimeout(() => { if (isLiveActive && !isAITalking) startContinuousListening(); }, 300);
                    resolve();
                };
                try {
                    const clean = base64Audio.replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                    const bin = window.atob(clean);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    currentBlobUrl = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
                    livePlayer.src = currentBlobUrl;
                    livePlayer.onended = finish;
                    livePlayer.onerror = finish;
                    await livePlayer.play();
                } catch (err) {
                    console.warn("Live audio playback fallback:", err);
                    if (done) return;
                    done = true;
                    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
                    await fallbackBrowserSpeech(displayText);
                    resolve();
                }
            });
        }

        function fallbackBrowserSpeech(text) {
            return new Promise((resolve) => {
                const done = () => {
                    isAITalking = false;
                    if (isLiveActive) setTimeout(startContinuousListening, 300);
                    resolve();
                };
                if ('speechSynthesis' in window) {
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = currentLanguage === 'en' ? 'en-IN' : 'te-IN';
                    isAITalking = true;
                    setLiveState('speaking', 'SPEAKING', `"${text}"`);
                    u.onend = u.onerror = done;
                    window.speechSynthesis.speak(u);
                } else { done(); }
            });
        }
    </script>
