<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Nakshatra AI - Web Chat</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Markdown Rendering Stack -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --cyan: #38bdf8;
            --purple: #6366f1;
            --violet: #a855f7;
            --pink: #ec4899;
            --bg-sidebar: #0a0b10;
            --border: rgba(255,255,255,0.08);
            --text-primary: #ececf1;
            --gradient-main: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
            --font-sm: 0.92rem;
            --font-xs: 0.8rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Telugu', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 50% 35%, #111842 0%, #06091c 55%, #02030a 100%);
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            transition: background 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        body.chat-active { background: #000000 !important; }

        /* ---- TOAST ---- */
        .app-toast {
            position: fixed;
            top: 66px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 99999;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: var(--font-sm);
            font-weight: 500;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.94);
            border: 1px solid rgba(248, 113, 113, 0.5);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 90vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(12px);
        }
        .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ---- TOP BAR ---- */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            background: rgba(6, 9, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        body.chat-active .top-bar { background: rgba(0, 0, 0, 0.85); border-bottom-color: rgba(255, 255, 255, 0.05); }
        .top-left-group, .top-brand { display: flex; align-items: center; gap: 9px; }
        .top-brand img {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1.5px solid rgba(0,242,254,0.4);
            box-shadow: 0 0 10px rgba(0,242,254,0.25);
        }
        .top-brand-text { font-size: 1.2rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 7px; }
        .gradient-text { background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-btn {
            background: transparent;
            border: none;
            color: #d1d5db;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }

        /* ---- SIDEBAR ---- */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 99; }
        .sidebar-overlay.show { display: block; }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            width: 265px;
            max-width: 82vw;
            height: 100dvh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            z-index: 100;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand img { width: 27px; height: 27px; border-radius: 7px; object-fit: cover; }
        .close-menu-btn { background: transparent; border: none; color: #64748b; font-size: 1.15rem; cursor: pointer; padding: 4px; }
        .new-chat-btn {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,242,254,0.25);
            border-radius: 11px;
            color: #e2e8f0;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .recent-label { margin: 20px 6px 8px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; color: #475569; font-weight: 600; }
        .recent-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .menu-item {
            padding: 10px 12px;
            border-radius: 9px;
            color: #94a3b8;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-item:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }
        .sidebar-bottom { padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }

        /* ---- MAIN SCROLL AREA ---- */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 0 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .main-content::-webkit-scrollbar,
        .recent-list::-webkit-scrollbar,
        .chat-input::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        .recent-list,
        .chat-input {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .code-card pre::-webkit-scrollbar,
        .table-scroll-wrap::-webkit-scrollbar {
            height: 4px;
        }
        .code-card pre::-webkit-scrollbar-thumb,
        .table-scroll-wrap::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* ---- HOME SCREEN ---- */
        .home-center {
            position: relative;
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            width: 100%;
            max-width: 680px;
            animation: homeFadeUp 0.35s ease;
        }
        .home-center.leaving { opacity: 0; transform: translateY(-14px); pointer-events: none; transition: 0.22s; }
        @keyframes homeFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .center-cosmic-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.24) 0%, rgba(56, 189, 248, 0.1) 50%, transparent 72%);
            filter: blur(36px);
            pointer-events: none;
        }
        .home-greeting { position: relative; z-index: 1; text-align: center; }
        .greeting-main { font-size: clamp(1.65rem, 4.2vw, 2.35rem); font-weight: 600; letter-spacing: -0.025em; color: #ffffff; line-height: 1.25; text-wrap: balance; }
        .greeting-sub { font-size: clamp(0.98rem, 2.4vw, 1.12rem); font-weight: 400; color: #cbd5e1; margin-top: 10px; line-height: 1.5; text-wrap: balance; }

        /* ---- CHAT CONTAINER & MESSAGES ---- */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 14px 12px 36px;
        }
        .msg-row { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 8px 0; animation: msgFadeUp 0.25s ease; }
        @keyframes msgFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-row.user { justify-content: flex-end; padding: 8px 0; }
        .msg-row.ai { justify-content: flex-start; gap: 0; padding: 10px 0 18px; }
        .msg-row.user .msg-bubble {
            background: #1e1f22;
            color: #f3f4f6;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 22px 22px 6px 22px;
            padding: 12px 18px;
            max-width: 82%;
            font-size: 0.98rem;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .ai-content-wrap { flex: 1; width: 100%; min-width: 0; display: flex; flex-direction: column; }

        /* ---- EDGE-TO-EDGE PURE WHITE EDITORIAL MARKDOWN ---- */
        .msg-row.ai .msg-bubble {
            color: #ffffff;
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 100%;
            font-size: 1rem;
            line-height: 1.72;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: left;
        }
        .msg-row.ai .msg-bubble p { margin: 0 0 1em; line-height: 1.75; color: #ffffff; }
        .msg-row.ai .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-row.ai .msg-bubble h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; margin: 1.4em 0 0.6em; color: #ffffff; border-bottom: 1px solid rgba(255,255,255,0.14); padding-bottom: 6px; }
        .msg-row.ai .msg-bubble h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.012em; line-height: 1.32; margin: 1.35em 0 0.55em; color: #ffffff; }
        .msg-row.ai .msg-bubble h3 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.35; margin: 1.3em 0 0.5em; color: #ffffff; }
        .msg-row.ai .msg-bubble h4,
        .msg-row.ai .msg-bubble h5,
        .msg-row.ai .msg-bubble h6 { font-size: 1.06rem; font-weight: 650; line-height: 1.4; margin: 1.05em 0 0.42em; color: #ffffff; }
        .msg-row.ai .msg-bubble ul,
        .msg-row.ai .msg-bubble ol { margin: 0.45em 0 1.15em; padding-left: 0; list-style-position: inside; color: #ffffff; }
        .msg-row.ai .msg-bubble ul ul,
        .msg-row.ai .msg-bubble ol ol,
        .msg-row.ai .msg-bubble ul ol,
        .msg-row.ai .msg-bubble ol ul { margin: 0.35em 0; padding-left: 1.1em; }
        .msg-row.ai .msg-bubble li { margin-bottom: 0.68em; padding-left: 0; line-height: 1.74; font-size: 1rem; color: #ffffff; }
        .msg-row.ai .msg-bubble li > p { display: inline; margin: 0; color: #ffffff; }
        .msg-row.ai .msg-bubble li:last-child { margin-bottom: 0; }
        .msg-row.ai .msg-bubble ul > li::marker,
        .msg-row.ai .msg-bubble ol > li::marker { color: #ffffff; font-weight: 700; }
        .msg-row.ai .msg-bubble strong { color: #ffffff; font-weight: 700; }
        .msg-row.ai .msg-bubble em { font-style: italic; color: #ffffff; }
        .msg-row.ai .msg-bubble code:not(pre code) {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.16);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-family: 'JetBrains Mono', monospace;
            color: #ffffff;
        }
        .code-card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; margin: 12px 0; overflow: hidden; }
        .code-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #141414;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            font-size: 0.78rem;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }
        .code-card-copy-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 5px;
        }
        .code-card-copy-btn:hover { color: #ffffff; background: rgba(255,255,255,0.12); }
        .code-card-copy-btn.copied { color: #ffffff; }
        .code-card pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 0.9rem; line-height: 1.6; }
        .code-card pre code,
        .code-card pre code * { font-family: 'JetBrains Mono', monospace; color: #ffffff !important; background: transparent !important; }
        .msg-row.ai .msg-bubble blockquote { border-left: 2px solid #ffffff; padding: 8px 14px; margin: 12px 0; background: rgba(255, 255, 255, 0.05); border-radius: 0 8px 8px 0; color: #ffffff; }
        .msg-row.ai .msg-bubble hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.16); margin: 1.2em 0; }
        .msg-row.ai .msg-bubble a { color: #ffffff; text-decoration: underline; }
        .table-scroll-wrap { width: 100%; overflow-x: auto; margin: 12px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); }
        .msg-row.ai .msg-bubble table { width: 100%; border-collapse: collapse; font-size: 0.92rem; color: #ffffff; }
        .msg-row.ai .msg-bubble th,
        .msg-row.ai .msg-bubble td { padding: 10px 14px; text-align: left; border: 1px solid rgba(255,255,255,0.12); color: #ffffff; }
        .msg-row.ai .msg-bubble th { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
        .msg-row.ai .msg-bubble > *:first-child { margin-top: 0 !important; }
        .msg-row.ai .msg-bubble > *:last-child { margin-bottom: 0 !important; }

        .msg-actions-bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
        .msg-action-btn {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255,255,255,0.68);
            padding: 4px 9px;
            border-radius: 7px;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .msg-action-btn:hover { color: #ffffff; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.16); }

        .ai-dots-loader { display: flex; align-items: center; gap: 5px; height: 28px; padding: 4px 0; }
        .ai-dots-loader span { width: 7px; height: 7px; border-radius: 50%; background: #ffffff; animation: dotBounce 1.1s ease-in-out infinite; }
        .ai-dots-loader span:nth-child(2) { animation-delay: 0.18s; }
        .ai-dots-loader span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes dotBounce { 0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.45; } 40% { transform: translateY(-7px) scale(1.1); opacity: 1; } }

        .continue-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 15px;
            font-size: var(--font-xs);
            color: #ffffff;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px;
            cursor: pointer;
            align-self: flex-start;
        }
        .continue-pill-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 520px) {
            .chat-container { padding: 12px 10px 32px; }
        }

        /* ---- FLOATING BOTTOM INPUT BAR & DEDICATED SEND BUTTON ---- */
        .bottom-bar {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 30;
        }
        body.chat-active .bottom-bar {
            max-width: 100%;
            padding-left: 12px;
            padding-right: 12px;
        }
        @media (max-width: 520px) {
            body.chat-active .bottom-bar { padding-left: 10px; padding-right: 10px; }
        }
        .chat-box-wrapper {
            width: 100%;
            border-radius: 28px;
            background: #14151c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 8px 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 54px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
        }
        .chat-box-wrapper:focus-within {
            border-color: rgba(99, 102, 241, 0.55);
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3), 0 8px 36px rgba(0, 0, 0, 0.7);
        }
        .chat-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: #f1f5f9;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            height: 26px;
            max-height: 140px;
            overflow-y: auto;
            font-family: inherit;
        }
        .chat-input::placeholder { color: #8b90a0; font-size: 0.98rem; }
        .chat-input-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .mic-toggle-btn {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
            touch-action: manipulation;
        }
        .mic-toggle-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .mic-toggle-btn:active { transform: scale(0.93); }
        .mic-toggle-btn .mic-icon-stop,
        .mic-toggle-btn .mic-icon-spinner { display: none; }
        .mic-toggle-btn.listening {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.7);
            color: #38bdf8;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
            animation: micDictatePulse 1.3s ease-in-out infinite;
        }
        .mic-toggle-btn.listening .mic-icon-idle { display: none; }
        .mic-toggle-btn.listening .mic-icon-stop { display: block; }
        .mic-toggle-btn.transcribing {
            background: rgba(99, 102, 241, 0.18);
            border-color: rgba(168, 85, 247, 0.55);
            color: #c4b5fd;
            cursor: wait;
        }
        .mic-toggle-btn.transcribing .mic-icon-idle { display: none; }
        .mic-toggle-btn.transcribing .mic-icon-spinner { display: inline-block; }
        @keyframes micDictatePulse {
            0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 22px rgba(56, 189, 248, 0.6); transform: scale(1.05); }
        }

        .send-btn {
            position: relative;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.5);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, opacity 0.2s ease;
            touch-action: manipulation;
            opacity: 0.95;
        }
        .send-btn svg {
            position: absolute;
            transition: opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        .send-btn .btn-icon-wave { opacity: 1; transform: scale(1) rotate(0deg); }
        .send-btn .btn-icon-send { opacity: 0; transform: scale(0.55) rotate(-45deg); }
        .send-btn.typing { opacity: 1; box-shadow: 0 0 24px rgba(124, 58, 237, 0.75); }
        body.chat-active .send-btn { opacity: 1; }
        .send-btn.typing .btn-icon-wave,
        body.chat-active .send-btn .btn-icon-wave { opacity: 0; transform: scale(0.55) rotate(45deg); }
        .send-btn.typing .btn-icon-send,
        body.chat-active .send-btn .btn-icon-send { opacity: 1; transform: scale(1) rotate(0deg); }
        .send-btn:hover { transform: scale(1.06); }
        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .bottom-disclaimer { font-size: 0.72rem; color: #64748b; text-align: center; }

        /* ---- LIVE VOICE MODE ---- */
        .live-modal {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 38%, #111842 0%, #06091c 56%, #02030a 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0 0 calc(28px + env(safe-area-inset-bottom, 0px));
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.985);
            transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                        visibility 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }
        .live-modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1);
        }
        .live-ambient-bg {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(460px, 92vw);
            height: min(460px, 92vw);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(56, 189, 248, 0.1) 42%, transparent 72%);
            filter: blur(48px);
            pointer-events: none;
            z-index: 0;
        }
        .live-header {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(6, 9, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .live-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #e2e8f0;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .live-close-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.28);
            color: #ffffff;
            transform: scale(1.06);
        }
        .live-close-btn:active { transform: scale(0.92); }

        .live-center-stage {
            position: relative;
            z-index: 2;
            flex: 1;
            width: 100%;
            max-width: 560px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(18px, 3.8vh, 30px);
            min-height: 0;
        }
        .live-orb-container {
            position: relative;
            width: clamp(176px, min(52vw, 44vh), 252px);
            height: clamp(176px, min(52vw, 44vh), 252px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .live-orb-glow {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(39, 215, 255, 0.34) 0%, rgba(79, 70, 229, 0.32) 44%, rgba(223, 79, 255, 0.24) 68%, transparent 78%);
            filter: blur(32px);
            opacity: 0.9;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        .live-wave {
            position: absolute;
            width: clamp(136px, min(40vw, 35vh), 192px);
            height: clamp(136px, min(40vw, 35vh), 192px);
            border-radius: 50%;
            border: 1.5px solid rgba(39, 215, 255, 0.42);
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
        }
        .live-wave.wave-secondary {
            border-color: rgba(223, 79, 255, 0.36);
        }
        .live-orb-core {
            position: relative;
            width: clamp(136px, min(40vw, 35vh), 192px);
            height: clamp(136px, min(40vw, 35vh), 192px);
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            background: radial-gradient(circle at 48% 48%, #162470 0%, #0b1347 56%, #040724 100%);
            box-shadow:
                0 0 36px rgba(39, 215, 255, 0.36),
                0 0 74px rgba(99, 102, 241, 0.4),
                0 0 105px rgba(223, 79, 255, 0.26);
            border: 1px solid rgba(56, 189, 248, 0.32);
            will-change: transform;
            transition: box-shadow 0.35s ease;
        }
        .live-orb-aurora {
            position: absolute;
            inset: -26%;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
        }
        .live-orb-aurora.aurora-cyan {
            background: radial-gradient(circle at 24% 32%, #00f0ff 0%, rgba(39, 215, 255, 0.92) 22%, rgba(59, 130, 246, 0.72) 45%, transparent 72%);
            animation: orbAuroraDrift 9s ease-in-out infinite;
        }
        .live-orb-aurora.aurora-violet {
            background: radial-gradient(circle at 76% 70%, #df4fff 0%, rgba(168, 85, 247, 0.9) 26%, rgba(99, 102, 241, 0.65) 48%, transparent 74%);
            animation: orbAuroraCounter 11s ease-in-out infinite;
        }
        .live-orb-aurora.aurora-highlight {
            inset: 0;
            z-index: 3;
            background: radial-gradient(circle at 38% 34%, rgba(224, 242, 254, 0.45) 0%, rgba(56, 189, 248, 0.16) 22%, transparent 50%);
            mix-blend-mode: screen;
        }
        .live-orb-glass {
            position: absolute;
            inset: 0;
            z-index: 4;
            border-radius: 50%;
            box-shadow:
                inset 0 2px 14px rgba(56, 189, 248, 0.45),
                inset 0 -16px 32px rgba(3, 6, 30, 0.78);
            pointer-events: none;
        }
        .live-orb-eyes {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14%;
            padding-bottom: 3%;
            pointer-events: none;
            will-change: transform;
        }
        .live-orb-eye {
            width: 11%;
            height: 21%;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%);
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.88),
                0 0 24px rgba(39, 215, 255, 0.58);
            transform-origin: center center;
            will-change: transform, opacity;
            animation: orbEyeBlink 4.8s ease-in-out infinite;
        }
        .live-orb-core.tap-blink .live-orb-eye {
            animation: orbTapBlink 0.22s ease-in-out 1;
        }

        /* State-driven 60fps Orb Motion */
        .live-modal.listening .live-orb-core { animation: listeningPulse 2.4s ease-in-out infinite; }
        .live-modal.listening .live-orb-eyes { animation: orbEyesListen 6.4s ease-in-out infinite; }
        .live-modal.listening .live-wave { animation: waveRipple 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
        .live-modal.listening .live-wave.wave-secondary { animation: waveRipple 2.4s cubic-bezier(0.22, 1, 0.36, 1) 1.2s infinite; }

        .live-modal.thinking .live-orb-core {
            animation: thinkingBreathe 1.6s ease-in-out infinite;
            box-shadow:
                0 0 44px rgba(99, 102, 241, 0.55),
                0 0 88px rgba(168, 85, 247, 0.5),
                0 0 118px rgba(223, 79, 255, 0.3);
        }
        .live-modal.thinking .live-orb-eyes { animation: orbEyesThink 2.4s ease-in-out infinite; }
        .live-modal.thinking .live-orb-eye { animation: orbEyeBlinkThink 3.6s ease-in-out infinite; }
        .live-modal.thinking .live-orb-aurora.aurora-cyan { animation: orbSwirlFast 2.2s linear infinite; }
        .live-modal.thinking .live-orb-aurora.aurora-violet { animation: orbSwirlReverse 2.8s linear infinite; }
        .live-modal.thinking .live-orb-glow { transform: scale(1.08); opacity: 1; }

        .live-modal.speaking .live-orb-core {
            animation: speakingBounce 0.65s ease-in-out infinite alternate;
            box-shadow:
                0 0 52px rgba(39, 215, 255, 0.58),
                0 0 92px rgba(139, 92, 246, 0.52),
                0 0 124px rgba(223, 79, 255, 0.36);
        }
        .live-modal.speaking .live-orb-eyes { animation: orbEyesSpeak 0.65s ease-in-out infinite alternate; }
        .live-modal.speaking .live-orb-eye {
            box-shadow:
                0 0 16px rgba(255, 255, 255, 0.96),
                0 0 30px rgba(39, 215, 255, 0.8),
                0 0 42px rgba(223, 79, 255, 0.45);
        }
        .live-modal.speaking .live-wave { animation: waveRippleSpeak 1.35s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
        .live-modal.speaking .live-wave.wave-secondary { animation: waveRippleSpeak 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.68s infinite; }
        .live-modal.speaking .live-orb-glow { transform: scale(1.16); opacity: 1; }

        @keyframes orbEyeBlink {
            0%, 44%, 48%, 90%, 94%, 97%, 100% { transform: scaleY(1) scaleX(1); }
            46%, 92% { transform: scaleY(0.08) scaleX(1.14); }
            95.5% { transform: scaleY(0.1) scaleX(1.1); }
        }
        @keyframes orbEyeBlinkThink {
            0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(0.76) scaleX(1.04); }
            46%, 94% { transform: scaleY(0.08) scaleX(1.14); }
        }
        @keyframes orbTapBlink {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            50% { transform: scaleY(0.08) scaleX(1.16); }
        }
        @keyframes orbEyesListen {
            0%, 100% { transform: translate(0%, 0%); }
            30% { transform: translate(3.5%, -1.5%); }
            65% { transform: translate(-3%, 1%); }
        }
        @keyframes orbEyesThink {
            0%, 100% { transform: translate(5%, -6%); }
            50% { transform: translate(8%, -8%); }
        }
        @keyframes orbEyesSpeak {
            0% { transform: translateY(1%) scaleY(0.96); }
            100% { transform: translateY(-2.5%) scaleY(1.04); }
        }

        @keyframes orbAuroraDrift {
            0%, 100% { transform: translate(-4%, -3%) rotate(0deg) scale(1); }
            50% { transform: translate(6%, 5%) rotate(180deg) scale(1.08); }
        }
        @keyframes orbAuroraCounter {
            0%, 100% { transform: translate(5%, 4%) rotate(0deg) scale(1.04); }
            50% { transform: translate(-5%, -6%) rotate(-180deg) scale(0.96); }
        }
        @keyframes orbSwirlFast {
            0% { transform: rotate(0deg) scale(1.06); }
            100% { transform: rotate(360deg) scale(1.06); }
        }
        @keyframes orbSwirlReverse {
            0% { transform: rotate(360deg) scale(1.04); }
            100% { transform: rotate(0deg) scale(1.04); }
        }
        @keyframes listeningPulse {
            0%, 100% { transform: scale(0.97); }
            50% { transform: scale(1.045); }
        }
        @keyframes thinkingBreathe {
            0%, 100% { transform: scale(0.96); }
            50% { transform: scale(1.035); }
        }
        @keyframes speakingBounce {
            0% { transform: scale(0.99); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1.11); }
        }
        @keyframes waveRipple {
            0% { transform: scale(1); opacity: 0.65; }
            100% { transform: scale(1.55); opacity: 0; }
        }
        @keyframes waveRippleSpeak {
            0% { transform: scale(1); opacity: 0.75; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        /* Single-line Centered State Text Below Circle (No Button Style) */
        .live-status-container {
            text-align: center;
            max-width: 520px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .live-state-text {
            font-size: clamp(1.12rem, 3.2vw, 1.32rem);
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #e2e8f0;
            line-height: 1.35;
            white-space: nowrap;
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }
        .live-modal.listening .live-state-text {
            color: #e0f2fe;
            text-shadow: 0 0 18px rgba(39, 215, 255, 0.32);
        }
        .live-modal.thinking .live-state-text {
            color: #e9d5ff;
            text-shadow: 0 0 18px rgba(168, 85, 247, 0.36);
        }
        .live-modal.speaking .live-state-text {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(223, 79, 255, 0.4);
        }
        .live-transcript-box {
            font-size: clamp(0.92rem, 2.5vw, 1.05rem);
            color: rgba(203, 213, 225, 0.76);
            line-height: 1.5;
            font-weight: 400;
            text-wrap: balance;
            min-height: 24px;
        }
        .live-transcript-box:empty {
            display: none;
        }
        .live-controls {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 360px;
            padding: 0 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40px;
        }
        .live-interrupt-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(24, 28, 56, 0.72);
            border: 1px solid rgba(139, 92, 246, 0.25);
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
            backdrop-filter: blur(12px);
        }
        .live-modal.speaking .live-interrupt-pill {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .live-interrupt-pill:hover {
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.5);
            color: #ffffff;
        }
        .live-interrupt-pill:active { transform: scale(0.95); }

        @media (max-height: 540px) {
            .live-modal { padding-bottom: 12px; }
            .live-center-stage { gap: 12px; padding: 8px 16px; }
            .live-controls { min-height: 24px; }
        }
    </style>
</head>

<body>
    <div id="appToast" class="app-toast"></div>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-left-group">
            <button type="button" class="menu-btn" onclick="toggleMenu()" title="Open Menu">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <div class="top-brand">
                <img src="images/ic_launcher.png" alt="Nakshatra">
                <span class="top-brand-text">Nakshatra <span class="gradient-text">AI</span></span>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top-header">
            <div class="sidebar-brand">
                <img src="images/ic_launcher.png" alt="Logo" onerror="this.style.display='none'">
                <span>Nakshatra AI</span>
            </div>
            <button type="button" class="close-menu-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <button type="button" class="new-chat-btn" onclick="startNewChat()">

            <a href="index.html" class="menu-item"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
        </div>
    </aside>

    <!-- Main Dynamic Content -->
    <main class="main-content" id="mainContent">
        <div class="home-center" id="homeScreen">
            <div class="center-cosmic-glow"></div>
            <div class="home-greeting">
                <h1 class="greeting-main" id="homeGreetingTitle">How can I help you today?</h1>
                <p class="greeting-sub" id="homeGreetingSub">Ready whenever you are.</p>
            </div>
        </div>
        <div class="chat-container" id="chatContainer"></div>
    </main>

    <audio id="liveAudioPlayer" playsinline preload="auto" style="display:none;"></audio>

    <!-- Bottom Input Bar with Dedicated Mic & Send Buttons -->
    <footer class="bottom-bar">
        <div class="chat-box-wrapper">
            <textarea id="chatInput" class="chat-input" rows="1" placeholder="Ask Nakshatra AI..."
                onkeydown="handleInputKey(event)" oninput="handleInputChange()"></textarea>
            <div class="chat-input-actions">
                <button type="button" class="mic-toggle-btn" id="micToggleBtn" onclick="toggleVoiceDictation()" title="Speech to Text" aria-label="Speech to Text">
                    <svg class="mic-icon-idle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                    </svg>
                    <svg class="mic-icon-stop" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <rect x="6" y="6" width="12" height="12" rx="3"></rect>
                    </svg>
                    <i class="fa-solid fa-spinner fa-spin mic-icon-spinner" aria-hidden="true"></i>
                </button>
                <button type="button" class="send-btn" id="sendBtn" data-mode="live" onclick="handlePrimaryAction()" title="Live Voice Mode" aria-label="Live Voice Mode">
                    <svg class="btn-icon-wave" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="4" y1="10" x2="4" y2="14"></line>
                        <line x1="8" y1="6" x2="8" y2="18"></line>
                        <line x1="12" y1="3" x2="12" y2="21"></line>
                        <line x1="16" y1="7" x2="16" y2="17"></line>
                        <line x1="20" y1="10" x2="20" y2="14"></line>
                    </svg>
                    <svg class="btn-icon-send" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
        <div class="bottom-disclaimer">Nakshatra AI can make mistakes. Verify important information.</div>

    <!-- Live Voice Mode Overlay -->
    <div class="live-modal" id="liveModal" role="dialog" aria-modal="true" aria-label="Nakshatra AI Live Mode">
        <div class="live-ambient-bg" aria-hidden="true"></div>
        <div class="live-header">
            <div class="top-brand">
                <img src="images/ic_launcher.png" alt="Nakshatra">
                <span class="top-brand-text">Nakshatra <span class="gradient-text">AI</span></span>
            </div>

            </button>
        </div>

            <div class="live-orb-container">
                <div class="live-orb-glow" aria-hidden="true"></div>
                <div class="live-wave" aria-hidden="true"></div>
                <div class="live-wave wave-secondary" aria-hidden="true"></div>
                <div class="live-orb-core" id="liveOrbCore" onclick="handleOrbTap()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();handleOrbTap();}" title="Tap to interact or interrupt when speaking" role="button" tabindex="0" aria-label="Nakshatra Live Voice Orb">
                    <div class="live-orb-aurora aurora-cyan" aria-hidden="true"></div>
                    <div class="live-orb-aurora aurora-violet" aria-hidden="true"></div>

            <div class="live-status-container">

        <div class="live-controls">

    <script>
        if (typeof marked !== 'undefined') {
            marked.setOptions({ breaks: true, gfm: true });
        }

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const homeScreen = document.getElementById('homeScreen');
        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const micToggleBtn = document.getElementById('micToggleBtn');
        const sendBtn = document.getElementById('sendBtn');
        const mainContent = document.getElementById('mainContent');
        const recentList = document.getElementById('recentList');
        const appToast = document.getElementById('appToast');
        const liveModal = document.getElementById('liveModal');
        const liveStateText = document.getElementById('liveStateText');
        const liveTranscript = document.getElementById('liveTranscript');
        const livePlayer = document.getElementById('liveAudioPlayer');

        const WORKER_BASE = "https://small-leaf-d4fb.bunnypraveen939.workers.dev";
        const API_URL = `${WORKER_BASE}/groq`;
        const MY_LOCATION_URL = `${WORKER_BASE}/my-location`;
        const GROQ_STT_URL = `${WORKER_BASE}/groq-stt`;
        const SARVAM_STT_URL = `${WORKER_BASE}/sarvam-stt`;
        const SARVAM_TTS_URL = `${WORKER_BASE}/sarvam`;
        const ELEVENLABS_TTS_URL = `${WORKER_BASE}/elevenlabs`;

                const prev = out.length > 0 ? out[out.length - 1] : '';
                const isHeading = /^\s*#{1,6}\s+/.test(cur);

        function animateAIReplyTyping(bubble, fullText) {
            return new Promise((resolve) => {
                const text = String(fullText || '');
                const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const tokens = text.match(/\S+\s*/g);
                if (reduceMotion || !tokens || tokens.length <= 2) {
                    bubble.innerHTML = renderMarkdownClean(text);
                    resolve();
                    return;
                }

                const total = tokens.length;
                const step = total > 180 ? 4 : (total > 75 ? 2 : 1);
                const intervalMs = total > 180 ? 18 : (total > 75 ? 22 : 26);
                let idx = 0;

                function tick() {
                    if (!bubble.isConnected) {
                        resolve();
                        return;
                    }
                    idx = Math.min(total, idx + step);
                    const isDone = idx >= total;
                    const slice = isDone ? text : closePartialCodeFence(tokens.slice(0, idx).join(''));
                    bubble.innerHTML = renderMarkdownClean(slice, { highlight: isDone });

                    const distFromBottom = mainContent.scrollHeight - mainContent.scrollTop - mainContent.clientHeight;
                    if (distFromBottom < 140) {
                        mainContent.scrollTop = mainContent.scrollHeight;
                    }

                    if (isDone) {
                        resolve();
                    } else {
                        setTimeout(() => requestAnimationFrame(tick), intervalMs);
                    }
                }

            });

            const kanglishMatches = lower.match(/\b(hegiddira|hegidiya|chennagiddini|chennagide|yaake|elli|yavaga|maadi|helu|heli|gottilla|gottu|banni|hogi|dhanyavada)\b/g) || [];
            if (kanglishMatches.length >= 1) {
                return { lang: 'kn', strength: (fallbackLang === 'kn' || !isVoiceInput || kanglishMatches.length >= 2) ? 'strong' : 'moderate', isBackchannel: false };
            }

            const manglishMatches = lower.match(/\b(sukhamaano|sukhamano|engane|enthokke|njan|ningal|ariyaam|ariyilla|parayu|parayoo|cheyyu|cheyyoo|nanni)\b/g) || [];
            if (manglishMatches.length >= 1) {
                return { lang: 'ml', strength: (fallbackLang === 'ml' || !isVoiceInput || manglishMatches.length >= 2) ? 'strong' : 'moderate', isBackchannel: false };
            }

            // 5. Common global Latin languages
            const esMatches = lower.match(/\b(hola|gracias|buenos|buenas|como estas|cómo estás|por favor|que tal|qué tal|donde|dónde|español|espanol|hablar|quiero|necesito|amigo|muy bien)\b/g) || [];
            if (esMatches.length >= 1) {
                return { lang: 'es', strength: (fallbackLang === 'es' || !isVoiceInput || esMatches.length >= 2 || /\b(hola|gracias|buenos|buenas|cómo estás|como estas|por favor)\b/i.test(lower)) ? 'strong' : 'moderate', isBackchannel: false };
            }
            const frMatches = lower.match(/\b(bonjour|bonsoir|merci|comment ca va|comment ça va|salut|s'il vous plait|s'il vous plaît|pourquoi|aujourd'hui|français|francais|parler|très bien|tres bien)\b/g) || [];
            if (frMatches.length >= 1) {

            if (deMatches.length >= 1) {

            if (englishWordMatches.length >= 1) {

                if (isVoiceInput && fallbackLang !== 'en') {
                    if (['te', 'hi', 'mr', 'ta', 'ml', 'kn', 'bn', 'gu', 'pa', 'or'].includes(acousticCode) && acousticCode !== fallbackLang && acousticProb >= 0.90 && latinWords.length >= 3) {

                    }

                    return { lang: fallbackLang, strength: 'neutral', isBackchannel: false };

                    return { lang: acousticCode, strength: isVoiceInput ? 'moderate' : 'strong', isBackchannel: false };
                }
                return { lang: 'en', strength: isVoiceInput ? 'weak' : 'strong', isBackchannel: false };
            }

            return { lang: fallbackLang, strength: 'neutral', isBackchannel: false };

        function detectLanguage(text, isVoiceInput = false, sttMeta = null, prevLang = currentLanguage) {
            const sig = analyzeLanguageSignal(text, isVoiceInput, sttMeta, prevLang);

                return (sig.strength === 'neutral' || sig.strength === 'weak' || sig.strength === 'weak_noise')
                    ? (prevLang || currentLanguage || 'en')
                    : sig.lang;
            }
            if (sig.strength === 'explicit' || sig.strength === 'strong') return sig.lang;
            if (!lastLiveTurnLang && sig.strength === 'moderate') return sig.lang;
            return prevLang || currentLanguage || 'en';

        function resolveLiveTurnLanguage(transcript, sttMeta = null) {
            const activeLang = lastLiveTurnLang || currentLanguage || 'en';

                livePendingCount = 0;

            const sig = analyzeLanguageSignal(transcript, true, sttMeta, activeLang);
            const acCode = String(sttMeta?.languageCode || '').toLowerCase().split('-')[0].replace(/^od$/, 'or');
            const acProb = Number(sttMeta?.languageProbability || 0);

                livePendingCount = 0;
                return sig.lang;
            }
            if (sig.strength === 'neutral' || sig.strength === 'weak_noise') {

                livePendingCount = 0;
                return activeLang;
            }
            if (sig.lang === activeLang) {
                livePendingLang = null;
                livePendingCount = 0;
                return activeLang;
            }
            if (sig.strength === 'strong' || (!lastLiveTurnLang && sig.strength === 'moderate')) {
                livePendingLang = null;
                livePendingCount = 0;
                return sig.lang;
            }

                    livePendingCount = 1;
                }
                if (livePendingCount >= 2) {
                    livePendingLang = null;
                    livePendingCount = 0;
                    return sig.lang;
                }
                return activeLang;
            }
            // Weak isolated signals (e.g. single food loanwords or 1-2 short English nouns) never flip active language
            livePendingLang = null;
            livePendingCount = 0;
            return activeLang;
        }

        function cleanTeluguOutput(text) {
            if (!text || typeof text !== "string") return text;
            return text.split(/(```[\s\S]*?```)/g).map(part => {
                if (part.startsWith('```')) return part;
                let t = part.replace(/<think>[\s\S]*?<\/think>/gi, '');
                t = t.replace(/^(నక్షత్ర\s*(AI)?|Nakshatra\s*(AI)?|Assistant|AI|Bot)\s*[:：\-–]\s*/i, '');
                t = t.replace(/నేను\s*మీకు\s*ఎలా\s*సహాయపడగలను\??/gu, 'చెప్పండి, ఏంటి విశేషాలు?');
                t = t.replace(/\bI am doing well,\s*how are you\??/gi, "Hey! I'm doing great, how's it going?");
                t = t.replace(/\bHow can I help you\??/gi, "What's on your mind?");
                t = t.replace(/గhee/giu, 'నెయ్యి');
                t = t.replace(/వెన్న\s*\(\s*గీ\s*\)/gu, 'నెయ్యి');
                t = t.replace(/దహి\s*\(\s*నెయ్యి\s*\)/gu, 'పెరుగు లేదా నెయ్యి');
                t = t.replace(/దయి\b/gu, 'పెరుగు');
                t = t.replace(/రాయితీ\s*\(\s*రాయిత్\s*\)/gu, 'రైతా');
                t = t.replace(/రాయతా/gu, 'రైతా');
                t = t.replace(/మందమైన\s*బాటిల్/gu, 'మందపాటి గిన్నె');
                t = t.replace(/వెండి\s*పాన్/gu, 'పాన్');
                t = t.replace(/సేవించడం/gu, 'వడ్డించడం');
                t = t.replace(/[“"]?(?:దంప్|దుమ్|డంప్)[”"]?/gu, 'దమ్');
                t = t.replace(/(\d+\s*నిమిషాలు\s*)మరిగించండి(?=\s*(?:[.,\n]|$))/gu, '$1పక్కన ఉంచండి');
                t = t.replace(/\s*\((?:సుమారు\s*)?\d+\s*W\)/giu, '');
                t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1').replace(/[\u0400-\u04FF\u4E00-\u9FFF\u0600-\u06FF]/g, '');
                return t;
            }).join('').trim();
        }

        function sanitizeForSpeech(text) {
            let s = cleanTeluguOutput(text || '');
            if (!s) return '';
            const isTeluguText = /[\u0C00-\u0C7F]/.test(s);
            s = s.replace(/```[\s\S]*?```/g, ' ')
                .replace(/https?:\/\/\S+/gi, '')
                .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ' ')
                .replace(/\[\d+\]/g, ' ')
                .replace(/(\d+(?:\.\d+)?)\s*°\s*C\b/gi, isTeluguText ? '$1 డిగ్రీల సెల్సియస్' : '$1 degrees Celsius')
                .replace(/(\d+(?:\.\d+)?)\s*°\s*F\b/gi, isTeluguText ? '$1 డిగ్రీల ఫారెన్‌హీట్' : '$1 degrees Fahrenheit')
                .replace(/₹\s*(\d[\d,]*(?:\.\d+)?)/g, isTeluguText ? '$1 రూపాయలు' : '$1 rupees')
                .replace(/\bRs\.?\s*(\d[\d,]*(?:\.\d+)?)/gi, isTeluguText ? '$1 రూపాయలు' : '$1 rupees')
                .replace(/\$\s*(\d[\d,]*(?:\.\d+)?)/g, isTeluguText ? '$1 డాలర్లు' : '$1 dollars')
                .replace(/(\d+(?:\.\d+)?)\s*%/g, '$1 percent')
                .replace(/\s*&\s*/g, ' and ')
                .replace(/[*_#`~>|]/g, ' ')
                .replace(/\(([^()]{1,60})\)/g, ', $1, ')
                .replace(/\s*[—–]\s*/g, ', ')
                .replace(/\r?\n+/g, '. ')
                .replace(/\.{4,}/g, '...')
                .replace(/\s+([.,!?])/g, '$1')
                .replace(/\s+/g, ' ')
                .trim();
            return s;
        }

        function splitSpeechChunks(cleanText) {
            const txt = String(cleanText || '').trim();
            // Keep normal 1-2 sentence replies as one cohesive unit for natural prosody continuity
            if (!txt || txt.length <= 190) return txt ? [txt] : [];
            const rawParts = txt.split(/(?<=[.!?।])\s+/).map(p => p.trim()).filter(Boolean);
            if (rawParts.length <= 1) return [txt];
            const merged = [];
            for (const part of rawParts) {
                if (merged.length > 0 && (merged[merged.length - 1].length < 48 || part.length < 32)) {
                    merged[merged.length - 1] += ' ' + part;
                } else if (merged.length >= 2) {
                    merged[merged.length - 1] += ' ' + part;
                } else {
                    merged.push(part);
                }
            }
            return merged.length ? merged : [txt];
        }

        function manageConversationHistory(history, maxTurns = 8) {
            return history.slice(-(maxTurns * 2));
        }

        function isReplyCutOff(text) {
            if (!text) return false;
            const t = text.trim();
            if (t.endsWith("```")) return false;
            const lastLine = (t.split("\n").pop() || "").trim();
            if (/^(#{1,6}\s|-{3,}|\|)/.test(lastLine)) return false;
            return !/[.?!।…]$/.test(t.replace(/[*_`"' )\]>]+$/g, ""));
        }

        function classifyPromptComplexity(text) {
            const t = (text || '').trim();
            const lower = t.toLowerCase();
            const hasDeepKeyword = /\b(puzzle|riddle|trick|logic|logical|paradox|brain\s*teaser|solve|calculate|compute|evaluate|prove|proof|derivation|compare|analyze|debug|algorithm|probability|pattern|sequence|missing\s+number|odd\s+one|truth|liar|knight|knave|how\s+many|ratio|percent|percentage|equation|find\s+x|step\s+by\s+step|verify|fact\s+check|difference\s+between|write\s+code|podupu)\b/i.test(lower)
                || /(పొడుపు|తర్కం|లెక్క|సమాధానం|ఎంత|తేడా|పోల్చు|కోడ్)/.test(t);
            const hasHowToOrRecipe = /\b(how\s+to|recipe|cook|make|prepare|bake|fry|brew|boil|roast|build|setup|set\s+up|configure|fix|troubleshoot|instructions|method|process|biryani|briyani|dosa|curry|masala)\b/i.test(lower)
                || /(ఎలా\s*వండాలి|ఎలా\s*చేయాలి|తయారీ|విధానం|వంట|బిర్యానీ|రెసిపీ|కైసే\s*బనాయే|कैसे\s*बनाएं|कैसे\s*पकाएं|ela\s+cheyyali|ela\s+vandali)/.test(t);
            const hasMultiConstraint = /\b(if|suppose|assuming|all\s+\w+\s+are|none\s+of|either|neither|only\s+one|twice|half|times\s+as|heavier|lighter|older|younger|weigh|door|hat|coin|box|train|speed|distance|clock|angle)\b/i.test(lower);
            const hasCode = /(```|\bfunction\b|\bclass\b|\bconst\b|\bdef\b|\bSELECT\b|\bTypeError\b|\bException\b)/i.test(t);
            const hasMathNumbers = (t.match(/\d+(?:\.\d+)?/g) || []).length >= 2 && /[?+\-*/=^%]|\b(total|sum|cost|left|remaining|find|many|much)\b/i.test(lower);
            return {
                isDeep: hasDeepKeyword || hasMultiConstraint || hasCode || hasMathNumbers || t.length > 180,
                isHowTo: hasHowToOrRecipe
            };
        }

        function ensurePlaybackUnlocked() {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                if (!keepAliveOsc) {
                    keepAliveOsc = ctx.createOscillator();
                    keepAliveGain = ctx.createGain();
                    keepAliveGain.gain.value = 0.00001;
                    keepAliveOsc.connect(keepAliveGain);
                    keepAliveGain.connect(ctx.destination);
                    keepAliveOsc.start();

            } catch (e) {}
        }

        function encodePCMToWav16k(chunks, inputSampleRate) {
            let totalLen = chunks.reduce((a, c) => a + c.length, 0);
            const merged = new Float32Array(totalLen);
            let offset = 0;
            for (const c of chunks) { merged.set(c, offset); offset += c.length; }

            const targetRate = 16000;
            const ratio = inputSampleRate / targetRate;
            const newLength = Math.max(1, Math.round(merged.length / ratio));
            const samples = new Float32Array(newLength);
            for (let i = 0; i < newLength; i++) {
                const start = Math.round(i * ratio);
                const end = Math.min(merged.length, Math.round((i + 1) * ratio));
                let sum = 0;
                for (let j = start; j < end; j++) sum += merged[j];
                samples[i] = end > start ? sum / (end - start) : 0;
            }

            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeStr = (p, s) => { for (let i = 0; i < s.length; i++) view.setUint8(p + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
            writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true); view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true);
            writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
            let idx = 44;
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                idx += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        // ===== SPEECH-TO-TEXT DICTATION (CHAT INPUT MIC) =====
        let isDictating = false, isTranscribingDictation = false, dictateSessionId = 0;
        let dictateStream = null, dictateCtx = null, dictateSource = null, dictateProcessor = null, dictateGain = null;
        let dictateChunks = [], dictateSpeechStarted = false;
        let dictateStartTime = 0, dictateLastSpeechTime = 0, dictateSpeechStartTime = 0;
        let dictateRecognition = null;

        function setDictationUIState(state) {
            if (!micToggleBtn) return;
            micToggleBtn.classList.remove('listening', 'transcribing');
            micToggleBtn.disabled = state === 'transcribing';

        function releaseDictationAudio() {
            try { dictateProcessor?.disconnect(); dictateSource?.disconnect(); dictateGain?.disconnect(); dictateCtx?.close(); } catch (e) {}
            dictateProcessor = dictateSource = dictateGain = dictateCtx = null;
            if (dictateStream) {
                dictateStream.getTracks().forEach(t => t.stop());
                dictateStream = null;
            }
            if (dictateRecognition) {
                try { dictateRecognition.abort(); } catch (e) {}
                dictateRecognition = null;
            }
        }

        function cancelVoiceDictation() {
            dictateSessionId++;
            isDictating = false;
            isTranscribingDictation = false;
            dictateChunks = [];
            dictateSpeechStarted = false;
            releaseDictationAudio();
            setDictationUIState('idle');
        }

        function appendDictatedTextToInput(transcript) {
            const clean = String(transcript || '').trim();
            if (!clean) return false;
            const existing = chatInput.value;
            const needsSpace = existing.length > 0 && !/\s$/.test(existing);
            chatInput.value = existing + (needsSpace ? ' ' : '') + clean;
            const detected = detectLanguage(chatInput.value, false);
            if (detected) currentLanguage = detected;
            handleInputChange();
            chatInput.focus();
            chatInput.setSelectionRange(chatInput.value.length, chatInput.value.length);
            return true;
        }

        async function fetchSTTWithMeta(wavBlob, mode = 'auto', allowFallback = false, signal = null) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 14000);
            const onAbort = () => controller.abort();
            if (signal) {
                if (signal.aborted) controller.abort();
                else signal.addEventListener('abort', onAbort, { once: true });
            }
            const cleanSttNoise = (txt, isWhisper = false) => {
                const t = (txt || '').trim();
                if (!t || /^[\s.,!?…\-–—~"'`।]+$/u.test(t)) return '';
                if (isWhisper && /^(thank you|thanks|thanks for watching|bye|you|subtitle[s]?|amara\.org)[.!\s]*$/i.test(t) && wavBlob.size < 22000) return '';
                if (wavBlob.size < 14000 && t.length === 1 && !/^[iaok]$/i.test(t) && !/[\u0900-\u0DFF]/.test(t)) return '';
                return t;
            };
            try {
                if (mode === 'en') {
                    const fd = new FormData();
                    fd.append('file', wavBlob, 'recording.wav');
                    fd.append('model', 'whisper-large-v3-turbo');
                    fd.append('language', 'en');
                    const res = await fetch(GROQ_STT_URL, { method: 'POST', body: fd, signal: controller.signal });
                    if (!res.ok) throw new Error(`STT HTTP ${res.status}`);
                    return {
                        text: cleanSttNoise((await res.json()).text, true),
                        languageCode: 'en-IN',
                        languageProbability: 1.0
                    };
                }

                const fd = new FormData();
                fd.append('file', wavBlob, 'recording.wav');
                fd.append('model', 'saaras:v3');
                fd.append('mode', 'codemix');
                fd.append('language_code', mode === 'te' ? 'te-IN' : 'unknown');
                const res = await fetch(SARVAM_STT_URL, { method: 'POST', body: fd, signal: controller.signal });
                if (res.ok) {
                    const data = await res.json();
                    const txt = cleanSttNoise(data.transcript || data.text || '', false);
                    if (txt || !allowFallback) {
                        return {
                            text: txt,
                            languageCode: data.language_code || null,
                            languageProbability: data.language_probability || 0
                        };
                    }
                } else if (!allowFallback) {
                    throw new Error(`STT HTTP ${res.status}`);
                }

                const fallbackFd = new FormData();
                fallbackFd.append('file', wavBlob, 'recording.wav');
                fallbackFd.append('model', 'whisper-large-v3-turbo');
                const fbRes = await fetch(GROQ_STT_URL, { method: 'POST', body: fallbackFd, signal: controller.signal });
                if (!fbRes.ok) throw new Error(`STT HTTP ${fbRes.status}`);
                return {
                    text: cleanSttNoise((await fbRes.json()).text, true),
                    languageCode: null,
                    languageProbability: 0
                };
            } finally {
                clearTimeout(timeoutId);
                if (signal) signal.removeEventListener('abort', onAbort);
            }
        }

        async function fetchSTTTranscript(wavBlob, mode = 'auto', allowFallback = false, signal = null) {
            const res = await fetchSTTWithMeta(wavBlob, mode, allowFallback, signal);
            return res?.text || '';
        }

        async function finishVoiceDictation(manualStop = false) {
            if (!isDictating) return;
            const session = dictateSessionId;
            isDictating = false;

            const captured = [...dictateChunks];
            const sr = dictateCtx?.sampleRate || 16000;
            const hadSpeech = dictateSpeechStarted;
            const durationSec = (captured.length * 4096) / sr;

            dictateChunks = [];
            dictateSpeechStarted = false;
            releaseDictationAudio();

            if (!captured.length || durationSec < 0.3 || (!hadSpeech && !manualStop)) {
                setDictationUIState('idle');
                if (manualStop) showErrorToast("No speech detected. Try speaking closer to the mic.");
                return;
            }

            isTranscribingDictation = true;
            setDictationUIState('transcribing');
            try {
                const wavBlob = encodePCMToWav16k(captured, sr);
                const transcript = await fetchSTTTranscript(wavBlob, 'auto', true);
                if (session !== dictateSessionId) return;
                if (!appendDictatedTextToInput(transcript)) {
                    showErrorToast("Didn't catch that. Please try speaking again.");
                }
            } catch (err) {
                if (session !== dictateSessionId) return;
                showErrorToast(err?.name === 'AbortError' ? "Speech recognition timed out." : "Speech-to-text error. Please try again.");
            } finally {
                if (session === dictateSessionId) {
                    isTranscribingDictation = false;
                    setDictationUIState('idle');
                }
            }
        }

        function startBrowserSpeechFallback(session) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                showErrorToast("Microphone is not supported in this browser.");
                cancelVoiceDictation();
                return;
            }
            const rec = new SR();
            dictateRecognition = rec;
            rec.lang = currentLanguage === 'te' ? 'te-IN' : currentLanguage === 'hi' ? 'hi-IN' : 'en-IN';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            let gotResult = false;
            rec.onresult = (event) => {
                if (session !== dictateSessionId) return;
                const transcript = Array.from(event.results || []).map(r => r[0]?.transcript || '').join(' ').trim();
                if (appendDictatedTextToInput(transcript)) gotResult = true;
            };
            rec.onerror = () => {
                if (session !== dictateSessionId) return;
                showErrorToast("Microphone permission denied or unavailable.");
                cancelVoiceDictation();
            };
            rec.onend = () => {
                if (session !== dictateSessionId) return;
                isDictating = false;
                dictateRecognition = null;
                setDictationUIState('idle');
                if (!gotResult) showErrorToast("No speech detected. Please try again.");
            };
            try {
                rec.start();
            } catch (err) {
                showErrorToast("Unable to start speech recognition.");
                cancelVoiceDictation();
            }
        }

        async function toggleVoiceDictation() {
            if (isTranscribingDictation) return;
            if (isDictating) {
                if (dictateRecognition) {
                    try { dictateRecognition.stop(); } catch (e) { cancelVoiceDictation(); }
                } else {
                    await finishVoiceDictation(true);
                }
                return;
            }
            if (isLiveActive) closeLiveMode();

            const session = ++dictateSessionId;
            isDictating = true;
            dictateChunks = [];
            dictateSpeechStarted = false;
            dictateStartTime = Date.now();
            setDictationUIState('listening');

            if (!navigator.mediaDevices?.getUserMedia) {
                startBrowserSpeechFallback(session);
                return;
            }

            try {
                dictateStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                if (session !== dictateSessionId) {
                    dictateStream.getTracks().forEach(t => t.stop());
                    dictateStream = null;
                    return;
                }
                const AC = window.AudioContext || window.webkitAudioContext;
                dictateCtx = new AC();
                if (dictateCtx.state === 'suspended') await dictateCtx.resume().catch(() => {});
                dictateSource = dictateCtx.createMediaStreamSource(dictateStream);
                dictateProcessor = dictateCtx.createScriptProcessor(4096, 1, 1);
                dictateGain = dictateCtx.createGain();
                dictateGain.gain.value = 0;
                dictateSource.connect(dictateProcessor);
                dictateProcessor.connect(dictateGain);
                dictateGain.connect(dictateCtx.destination);

                dictateProcessor.onaudioprocess = (event) => {
                    if (!isDictating || session !== dictateSessionId) return;
                    const copy = new Float32Array(event.inputBuffer.getChannelData(0));
                    let sum = 0;
                    for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                    const rms = Math.sqrt(sum / copy.length);
                    const now = Date.now();

                    dictateChunks.push(copy);
                    if (rms > 0.012) {
                        if (!dictateSpeechStarted) {
                            dictateSpeechStarted = true;
                            dictateSpeechStartTime = now;
                        }
                        dictateLastSpeechTime = now;
                    } else if (dictateSpeechStarted) {
                        if ((now - dictateLastSpeechTime > 1600) || (now - dictateSpeechStartTime > 30000)) {
                            finishVoiceDictation(false);
                        }
                    } else if (now - dictateStartTime > 20000) {
                        finishVoiceDictation(false);
                    }
                };
            } catch (err) {
                if (session !== dictateSessionId) return;
                showErrorToast("Microphone permission denied.");
                cancelVoiceDictation();
            }
        }

        let lastLiveTurnLang = null;
