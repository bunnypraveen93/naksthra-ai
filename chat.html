<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Nakshatra AI - Web Chat</title>
    <link rel="icon" type="image/png" href="images/ic_launcher.png">

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Marked.js for Clean Markdown Output -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --cyan: #00f2fe;
            --purple: #8a2be2;
            --pink: #f857a6;
            --bg: #0d0d12;
            --bg-surface: #17171f;
            --bg-sidebar: #101016;
            --bg-input: #1a1a24;
            --bg-user-bubble: #282834;
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.18);
            --text-primary: #f0f0f6;
            --text-secondary: #9aa0b0;
            --text-muted: #626274;
            --gradient-main: linear-gradient(135deg, #00f2fe 0%, #4facfe 40%, #9b51e0 80%, #f857a6 100%);
            --gradient-send: linear-gradient(135deg, #4facfe 0%, #8b5cf6 55%, #c084fc 100%);
            --radius-bubble: 20px;
            --radius-card: 14px;
            --font-base: 1.05rem; /* ~16.8px - larger, crisp, highly readable like ChatGPT */
            --font-sm: 0.92rem;
            --font-xs: 0.8rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Sans Telugu', 'Noto Sans Devanagari', 'Noto Sans Tamil', 'Noto Sans Malayalam', 'Noto Sans Kannada', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            overscroll-behavior: none;
        }

        body {
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* ---- TOAST ---- */
        .app-toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-16px);
            z-index: 99999;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: var(--font-sm);
            font-weight: 500;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.94);
            border: 1px solid rgba(248, 113, 113, 0.5);
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            max-width: 90vw;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            backdrop-filter: blur(12px);
        }
        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- TOP BAR ---- */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
            background: rgba(13,13,18,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }
        .top-left-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .top-brand img {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(0,242,254,0.3);
        }
        .top-brand-text {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gradient-text {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 7px #22c55e;
            display: inline-block;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 13px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #cbd5e1;
            font-size: var(--font-sm);
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.18s ease;
        }
        .top-action-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(255,255,255,0.2);
        }
        @media (max-width: 520px) {
            .hide-mobile { display: none; }
            .top-action-btn { padding: 7px 10px; }
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.18s;
        }
        .menu-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.08);
        }

        /* ---- SIDEBAR ---- */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            z-index: 99;
            opacity: 0;
            transition: opacity 0.22s ease;
        }
        .sidebar-overlay.show { display: block; opacity: 1; }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            width: 265px;
            max-width: 82vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            will-change: transform;
            z-index: 100;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-brand img {
            width: 27px;
            height: 27px;
            border-radius: 7px;
            object-fit: cover;
        }
        .close-menu-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.15rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: 0.15s;
        }
        .close-menu-btn:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .new-chat-btn {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,242,254,0.25);
            border-radius: 11px;
            color: #e2e8f0;
            font-size: var(--font-sm);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.22s;
        }
        .new-chat-btn:hover {
            background: rgba(0,242,254,0.1);
            border-color: rgba(0,242,254,0.5);
            color: #fff;
        }
        .recent-label {
            margin: 20px 6px 8px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #475569;
            font-weight: 600;
        }
        .recent-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .menu-item {
            padding: 10px 12px;
            border-radius: 9px;
            color: #94a3b8;
            font-size: var(--font-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.18s;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-item:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }
        .sidebar-bottom {
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* ---- MAIN SCROLL AREA ---- */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 0 12px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }

        /* ---- HOME SCREEN & PROMPT SUGGESTIONS ---- */
        .home-center {
            margin: auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 20px;
            width: 100%;
            max-width: 720px;
            animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .center-logo {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            animation: floatGlow 3.5s ease-in-out infinite alternate;
            box-shadow: 0 0 32px rgba(0,242,254,0.25), 0 0 64px rgba(138,43,226,0.18);
        }
        .center-logo img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes floatGlow {
            0% { transform: translateY(0px); box-shadow: 0 0 24px rgba(0,242,254,0.2); }
            100% { transform: translateY(-7px); box-shadow: 0 0 44px rgba(0,242,254,0.4); }
        }
        .home-title {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 700;
            letter-spacing: 0.3px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }
        .home-help-text {
            font-size: clamp(1.05rem, 3.2vw, 1.25rem);
            font-weight: 400;
            color: var(--text-secondary);
        }

        .home-suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 22px;
        }
        @media (max-width: 600px) {
            .home-suggestions {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
        .suggestion-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-card);
            padding: 13px 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .suggestion-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(0,242,254,0.35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .suggestion-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(0,242,254,0.1);
            color: var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .suggestion-card:nth-child(2) .suggestion-icon {
            background: rgba(138,43,226,0.12);
            color: #c084fc;
        }
        .suggestion-card:nth-child(3) .suggestion-icon {
            background: rgba(248,87,166,0.12);
            color: #f472b6;
        }
        .suggestion-card:nth-child(4) .suggestion-icon {
            background: rgba(34,197,94,0.12);
            color: #4ade80;
        }
        .suggestion-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 2px;
        }
        .suggestion-desc {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.35;
        }

        /* ---- CHAT CONTAINER & MESSAGES ---- */
        .chat-container {
            display: none;
            flex-direction: column;
            gap: 4px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 18px 30px;
        }

        .msg-row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            width: 100%;
            padding: 12px 0;
            animation: fadeUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user {
            justify-content: flex-end;
            padding: 8px 0;
        }
        .msg-row.ai {
            justify-content: flex-start;
            padding: 14px 0 16px;
        }

        .ai-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid rgba(0,242,254,0.35);
            background: #111118;
            margin-top: 2px;
            object-fit: cover;
            box-shadow: 0 0 12px rgba(0,242,254,0.2);
        }

        /* USER bubble */
        .msg-row.user .msg-bubble {
            background: var(--bg-user-bubble);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px 20px 4px 20px;
            padding: 12px 18px;
            max-width: 80%;
            font-size: var(--font-base);
            line-height: 1.65;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        @media (max-width: 520px) {
            .msg-row.user .msg-bubble { max-width: 92%; }
        }

        /* AI content wrap */
        .ai-content-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        /* AI bubble — no box, full width, breathing room like ChatGPT & Claude */
        .msg-row.ai .msg-bubble {
            background: transparent;
            color: var(--text-primary);
            padding: 2px 0 4px 0;
            width: 100%;
            font-size: var(--font-base);
            line-height: 1.75;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* ---- AI REPLY MARKDOWN — CLEAN CHATGPT / CLAUDE STYLE ---- */
        .msg-bubble p {
            margin-bottom: 14px;
            line-height: 1.78;
            font-size: var(--font-base);
            color: #e4e4f0;
        }
        .msg-bubble p:last-child { margin-bottom: 0; }

        .msg-bubble ul, .msg-bubble ol {
            margin: 10px 0 16px 0;
            padding-left: 24px;
        }
        .msg-bubble li {
            margin-bottom: 8px;
            line-height: 1.72;
            font-size: var(--font-base);
            color: #dcdcea;
        }
        .msg-bubble ul li::marker { color: var(--cyan); }
        .msg-bubble ol li::marker { color: var(--cyan); font-weight: 600; }

        .msg-bubble h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin: 22px 0 12px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 6px;
        }
        .msg-bubble h2 {
            font-size: 1.25rem;
            font-weight: 650;
            margin: 18px 0 10px;
            color: #f1f5f9;
        }
        .msg-bubble h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 14px 0 8px;
            color: #c4b5fd;
        }

        .msg-bubble strong { color: #ffffff; font-weight: 650; }
        .msg-bubble em { font-style: italic; color: #cbd5e1; }

        .msg-bubble code:not(pre code) {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            color: #f472b6;
        }

        /* Code Card (ChatGPT / Claude style) */
        .code-card {
            background: #14141c;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            margin: 16px 0;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .code-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #1e1e28;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.78rem;
            color: #94a3b8;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .code-card-copy-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 5px;
            transition: all 0.16s ease;
        }
        .code-card-copy-btn:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.1);
        }
        .code-card-copy-btn.copied {
            color: #22c55e;
        }
        .code-card pre {
            margin: 0;
            padding: 14px 16px;
            background: transparent;
            border: none;
            overflow-x: auto;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .code-card pre code {
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            background: transparent;
            padding: 0;
            border: none;
            color: #e2e8f0;
        }

        .msg-bubble blockquote {
            border-left: 3px solid var(--purple);
            padding: 8px 16px;
            margin: 14px 0;
            background: rgba(138,43,226,0.07);
            border-radius: 0 8px 8px 0;
            color: #c4b5fd;
            font-style: italic;
        }
        .msg-bubble a {
            color: #38bdf8;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .msg-bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 0.92rem;
        }
        .msg-bubble th, .msg-bubble td {
            padding: 10px 14px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .msg-bubble th {
            background: rgba(0,242,254,0.08);
            color: var(--cyan);
            font-weight: 600;
        }
        .msg-bubble > *:first-child { margin-top: 0 !important; }
        .msg-bubble > *:last-child { margin-bottom: 0 !important; }

        /* Message Action Buttons (Copy, Listen) */
        .msg-actions-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding-left: 2px;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }
        .msg-row.ai:hover .msg-actions-bar { opacity: 1; }
        .msg-action-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #8e8ea0;
            padding: 4px 9px;
            border-radius: 7px;
            font-size: 0.78rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.16s ease;
        }
        .msg-action-btn:hover {
            color: #ececf1;
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }

        /* ---- DOTS LOADER ---- */
        .ai-dots-loader {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 4px 2px;
        }
        .ai-dots-loader span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: dotBounce 1.1s ease-in-out infinite;
        }
        .ai-dots-loader span:nth-child(1) { background: var(--cyan); animation-delay: 0s; }
        .ai-dots-loader span:nth-child(2) { background: var(--purple); animation-delay: 0.18s; }
        .ai-dots-loader span:nth-child(3) { background: var(--pink); animation-delay: 0.36s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.5; }
            40% { transform: translateY(-7px) scale(1.1); opacity: 1; }
        }

        /* ---- CONTINUE BUTTON ---- */
        .continue-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 6px 15px;
            font-size: var(--font-xs);
            font-weight: 500;
            color: var(--cyan);
            background: rgba(0,242,254,0.07);
            border: 1px solid rgba(0,242,254,0.25);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .continue-pill-btn:hover {
            background: rgba(0,242,254,0.16);

                marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function (code, lang) {
                if (window.hljs) {
                    try {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    } catch (e) {
                        return code;
                    }
                }
                return code;
            }
        });

        function renderMarkdownClean(text) {
            if (!text) return '';
            try {
                const rawHtml = marked.parse(text);
                const temp = document.createElement('div');
                temp.innerHTML = rawHtml;

                // Enhance code blocks into ChatGPT/Claude style cards
                temp.querySelectorAll('pre').forEach(pre => {
                    const code = pre.querySelector('code');
                    let lang = 'code';
                    if (code) {
                        const classes = Array.from(code.classList);
                        const langClass = classes.find(c => c.startsWith('language-'));
                        if (langClass) lang = langClass.replace('language-', '');
                    }

                    const card = document.createElement('div');
                    card.className = 'code-card';
                    card.innerHTML = `
                        <div class="code-card-header">
                            <span>${lang}</span>
                            <button class="code-card-copy-btn" onclick="copyCodeFromCard(this)" title="Copy Code">
                                <i class="fa-regular fa-copy"></i> <span>Copy</span>
                            </button>
                        </div>
                    `;
                    pre.parentNode.insertBefore(card, pre);
                    card.appendChild(pre);
                });

                return temp.innerHTML;
            } catch (err) {
                console.error("Markdown parse error:", err);
                return text;
            }
        }

        function copyCodeFromCard(btn) {
            const card = btn.closest('.code-card');
            const code = card ? card.querySelector('pre code') : null;
            if (!code) return;
            navigator.clipboard.writeText(code.innerText).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Copied!</span>`;
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i> <span>Copy</span>`;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }

        function copyReplyText(btn) {
            const aiRow = btn.closest('.msg-row.ai');
            const bubble = aiRow ? aiRow.querySelector('.msg-bubble') : null;
            if (!bubble) return;
            navigator.clipboard.writeText(bubble.innerText).then(() => {
                btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>Copied!</span>`;
                setTimeout(() => {
                    btn.innerHTML = `<i class="fa-regular fa-copy"></i> <span>Copy</span>`;
                }, 2000);
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }

        function speakMessageBubble(btn) {
            const aiRow = btn.closest('.msg-row.ai');
            const bubble = aiRow ? aiRow.querySelector('.msg-bubble') : null;
            if (!bubble) return;
            const text = bubble.innerText;
            if (!text) return;

            if (window.speechSynthesis) {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>Listen</span>`;
                    return;
                }
                const utter = new SpeechSynthesisUtterance(text);
                if (currentLanguage === 'te') utter.lang = 'te-IN';
                else if (currentLanguage === 'hi') utter.lang = 'hi-IN';
                else if (currentLanguage === 'ta') utter.lang = 'ta-IN';
                else utter.lang = 'en-US';

                utter.onend = () => {
                    btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>Listen</span>`;
                };
                utter.onerror = () => {
                    btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>Listen</span>`;
                };
                btn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i> <span>Stop</span>`;
                window.speechSynthesis.speak(utter);
            }
        }

        function detectLanguage(text, isVoiceInput = false) {
            if (!text || typeof text !== "string") return currentLanguage;
            const t = text.trim();

            if (isVoiceInput && liveLangMode === 'te') return 'te';
            if (isVoiceInput && liveLangMode === 'en') return 'en';

            // Explicit language switch commands
            if (/\b(english|speak in english|talk in english|in english|switch to english|english lo|english lo matladu|english lo cheppu)\b/i.test(t) ||
                /ఇంగ్లీష్|ఇంగ్లిష్/.test(t)) return 'en';
            if (/\b(telugu|speak in telugu|talk in telugu|in telugu|switch to telugu|telugu lo|telugu lo matladu|telugu lo cheppu)\b/i.test(t) ||
                /తెలుగు|తెలుగులో/.test(t)) return 'te';
            if (/\b(hindi|speak in hindi|hindi me|hindi lo)\b/i.test(t) || /హిందీ|हिंदी में/.test(t)) return 'hi';
            if (/\b(speak in tamil|talk in tamil|tamil lo matladu|tamil pesu)\b/i.test(t)) return 'ta';
            if (/\b(speak in kannada|talk in kannada|kannada lo matladu)\b/i.test(t)) return 'kn';
            if (/\b(malayalam|speak in malayalam|in malayalam|switch to malayalam|malayalam lo|malayalam parayu|respond in malayalam)\b/i.test(t) ||
                /మలయాళం|മലയാളം/.test(t)) return 'ml';

            // 1. Indic Unicode scripts (definitive)
            if (/[\u0C00-\u0C7F]/.test(t)) return 'te';
            if (/[\u0900-\u097F]/.test(t)) return 'hi';
            if (/[\u0B80-\u0BFF]/.test(t)) return 'ta';
            if (/[\u0D00-\u0D7F]/.test(t)) return 'ml';
            if (/[\u0C80-\u0CFF]/.test(t)) return 'kn';

            // 2. Transliterated / Romanized Indic words
            const tenglishPattern = /\b(nuvvu|nuvu|nenu|ela|elaga|unnav|unnaru|em|enti|entii|chesthuv|chesthunn|cheppandi|cheppu|thinnava|thinara|bagunnava|bagunnanu|bava|mawa|kadh|kadha|avuna|eeroju|kavali|ledu|undhi|ekkada|chudu|matladu|namaskaram|ayyo|nijama|emiti|chesav|chala|kani|aithe|enduku|gurinchi|ippudu|kuda|chey|cheyyi|avunu|vaddu|randi|ikkada|akkada|manchi|baagundi|super ra)\b/i;
            if (tenglishPattern.test(t)) return 'te';

            const hinglishPattern = /\b(kaise|kaisa|kya|kyu|kyun|kar|rahe|raha|rahi|ho|batao|theek|theek hai|kuch|nahi|aaj|kaha|apna|naam|accha|achha|namaste|shukriya)\b/i;
            if (hinglishPattern.test(t)) return 'hi';

            const manglishPattern = /\b(nanni|sugamano|entha|evide|varum|kando|ariyilla|namaskaram|enthoke|vishesham)\b/i;
            if (manglishPattern.test(t)) return 'ml';

            const tanglishPattern = /\b(eppadi|irukenga|irukka|enna|solreenga|solunga|pannreenga|sapteengala|vanakkam|nandri)\b/i;
            if (tanglishPattern.test(t)) return 'ta';

            // 3. Conversational continuation neutral words
            const neutralWords = /^(ok|okay|k|hmm|ha|haa|bye|super|cool|thanks|thank you|yes|no|yo)[!.,?\s]*$/i;
            if (neutralWords.test(t) && conversationHistory.length > 0) return currentLanguage;

            // 4. English greetings & conversational tokens
            const englishGreetings = /^(hi|hello|hey|good morning|good evening|good afternoon|good night|gm|gn|what's up|sup)[!.,?\s]*$/i;
            if (englishGreetings.test(t)) return 'en';

            // 5. English / Latin queries (e.g. "who are you", "what is this", "tell me about...")
            const englishPattern = /\b(what|how|why|who|when|where|which|can you|could you|will you|would you|tell me|explain|describe|write|create|solve|are you|is it|do you|did you|i am|i'm|i want|help me|your name|your developer|your creator|today|weather|meaning|difference|about|please|sorry|really|awesome|great|hi|hello|hey)\b/i;
            if (englishPattern.test(t)) return 'en';

            if (/^[a-zA-Z0-9\s.,!?'"~@#$%^&*()_\-+=/<>:;]+$/.test(t)) return 'en';

            return currentLanguage;
        }

        function cleanTeluguOutput(text) {
            if (!text || typeof text !== "string") return text;
            
            // Protect markdown code blocks completely
            const codeBlockRegex = /(```[\s\S]*?```)/g;
            const parts = text.split(codeBlockRegex);

            return parts.map(part => {
                if (part.startsWith('```')) return part;
                return cleanTeluguSegment(part);
            }).join('');
        }

        function cleanTeluguSegment(text) {
            let t = text;
            t = t.replace(/^(నక్షత్ర\s*(AI)?|Nakshatra\s*(AI)?|Assistant|AI|Bot)\s*[:：\-–]\s*/i, '');
            t = t.replace(/\b(nenu|nenu\s+super\s+ga)\s+thinava\b/gi, "Ha thinnanu! Meeru thinnara?");
            t = t.replace(/\bbagunav[!.]*/gi, "bagunnanu!");
            t = t.replace(/\bNenu bagundhi\b/gi, "Nenu bagunnanu");
            t = t.replace(/\bcoffee\s+thintunna\w*/gi, "coffee taaguthunna");
            t = t.replace(/\btea\s+thintunna\w*/gi, "tea taaguthunna");
            t = t.replace(/\b(చెప్పండి|చెప్పు|వింటున్నాను|బాగున్నాను|హలో|హాయ్)\s*[,.]*\s*(హా|హ|మరి|సరే)?\s*[,.]*\s*\1\b/giu, '$1');
            t = t.replace(/చెప్పండి,?\s*నేను\s*వింటున్నాను[!.]*/giu, 'ఏం విశేషాలు?');
            t = t.replace(/నేను\s*వింటున్నాను[!.]*/giu, 'చెప్పండి.');
            t = t.replace(/మీ\s*రోజు\s*ఎలా\s*(సాగుతోంది|నడుస్తోంది|ఉంది)\??/giu, 'ఏం విశేషాలు?');
            t = t.replace(/నేను\s*మీకు\s*ఎలా\s*సహాయపడగలను\??/giu, 'ఏం కావాలి?');
            t = t.replace(/\bచెప్పు\s+రా\b/gi, "చెప్పండి");
            t = t.replace(/\s+రా([.,!?]*)$/i, '$1');
            t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1');
            t = t.replace(/(ఆ|ఈ|ఊ|ఏ|ఓ)\1+/gu, '$1');
            t = t.replace(/([ా-ౌ])(ఆ|ఈ|ఊ|ఏ|ఓ)/gu, '$1');
            t = t.replace(/[\u0400-\u04FF\u4E00-\u9FFF\u0600-\u06FF]/g, '');
            t = t.replace(/([a-zA-Z])\1{2,}/g, '$1');
            t = t.replace(/\.{2,}/g, '. ');

            // PRESERVE NEWLINES: Process line by line so markdown paragraphs, lists & headers stay intact!
            const lines = t.split('\n');
            const cleanedLines = lines.map(line => {
                if (!line.trim() || /^(\s*[-*+]|\s*\d+\.|\s*#|\s*>|\s*\|)/.test(line)) {
                    return line;
                }
                const words = line.split(/[^\S\r\n]+/);
                const deduplicated = [];
                for (let i = 0; i < words.length; i++) {
                    const curClean = words[i].replace(/[.,!?;:()"'`~]/g, '').toLowerCase();
                    const prevClean = (i > 0) ? words[i - 1].replace(/[.,!?;:()"'`~]/g, '').toLowerCase() : '';
                    if (curClean && curClean === prevClean) continue;
                    deduplicated.push(words[i]);
                }
                return deduplicated.join(' ');
            });

            let res = cleanedLines.join('\n').trim();
            res = res.replace(/[,;:\-\s]+$/, '');
            if (res && !/[.!?।`#\->|]$/.test(res)) res += '.';
            return res.trim();
        }

        function sanitizeForSpeech(text) {
            if (!text || typeof text !== "string") return "";
            let t = cleanTeluguOutput(text);
            t = t.replace(/[*_#`~>]/g, ' ');
            t = t.replace(/https?:\/\/\S+/gi, '');
            t = t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
            t = t.replace(/!+/g, '.');
            t = t.replace(/\.{2,}/g, ', ');
            t = t.replace(/[—–\-;]/g, ' ');
            t = t.replace(/\b(చెప్పం|చూడం|చేయం|మాట్లాడం|వినం)డీ+\b/gu, '$1డి');
            t = t.replace(/([\u0C3E-\u0C4C])\1+/gu, '$1');
            t = t.replace(/(ఆ|ఈ|ఊ|ఏ|ఓ)\1+/gu, '$1');
            t = t.replace(/([ా-ౌ])(ఆ|ఈ|ఊ|ఏ|ఓ)/gu, '$1');
            t = t.replace(/(^|\s)(ఆహ్+|ఓహ్+|హమ్మ్+|ఉమ్మ్+|ఆ{2,}|ఓ{2,}|aaa+|ooo+|ahh+|ohh+|umm+|hmm+)(\s|$|[.,!?])/giu, '$1$3');
            return t.replace(/\s+/g, ' ').trim();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' });
            });
        }

        function manageConversationHistory(history, maxTurns = 8) {
            const maxMsgs = maxTurns * 2;
            let trimmed = history.slice(-maxMsgs);
            let assistantCount = 0;
            for (let i = trimmed.length - 1; i >= 0; i--) {
                if (trimmed[i].role === "assistant") {
                    assistantCount++;
                    if (assistantCount > 2) {
                        const sentences = trimmed[i].content.match(/[^.!?।]+[.!?।]+|[^.!?।]+$/g) || [trimmed[i].content];
                        if (sentences.length > 3) {
                            trimmed[i].content = sentences.slice(0, 3).join(" ").trim() + "...";
                        }
                    }
                }
            }
            return trimmed;
        }

        function mergeContinuationText(original, continuation, maxOverlap = 80) {
            if (!continuation) return original;
            const o = original.trimEnd();
            const c = continuation.trimStart();
            for (let len = Math.min(maxOverlap, o.length, c.length); len > 3; len--) {
                const endSlice = o.slice(-len);
                const startSlice = c.slice(0, len);
                if (endSlice === startSlice) {
                    return o + c.slice(len);
                }
            }
            return o + " " + c;
        }

        function isReplyCutOff(text) {
            if (!text || typeof text !== "string") return false;
            const t = text.trim();
            if (t.endsWith("```")) return false;
            return !/[.?!।]$/.test(t);
        }

        async function handleContinueClick(btn, bubble, currentReplyText) {
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Continuing...`;

            try {
                const payloadMessages = [
                    ...conversationHistory,
                    { role: "assistant", content: currentReplyText },
                    { role: "user", content: "Continue exactly where you stopped. Do not repeat." }
                ];

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: payloadMessages,
                        mode: "chat",
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata"
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const continuation = cleanTeluguOutput(data.response || data.reply || data.choices?.[0]?.message?.content || "");

                if (continuation) {
                    const merged = mergeContinuationText(currentReplyText, continuation);
                    bubble.innerHTML = renderMarkdownClean(merged);

                    if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === "assistant") {
                        conversationHistory[conversationHistory.length - 1].content = merged;
                    }

                    const stillCut = (data.meta && data.meta.finish_reason === "length") || isReplyCutOff(merged);
                    if (stillCut) {
                        btn.disabled = false;
                        btn.innerHTML = `<i class="fa-solid fa-play"></i> Continue again`;
                        btn.onclick = () => handleContinueClick(btn, bubble, merged);
                    } else {
                        btn.remove();
                    }
                } else {
                    btn.remove();
                }
            } catch (err) {
                console.error("Continue failed:", err);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Retry Continue`;
            }
        }

            chatContainer.appendChild(aiRow);

            try {
                const detected = detectLanguage(text, false);
                if (detected) currentLanguage = detected;

                const fewShots = getFewShotExamples(currentLanguage);

                const response = await fetch(API_URL, {
                    method: 'POST',

                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",

                            { role: "system", content: `${SYSTEM_PROMPT}\n\n${getLangDirective(currentLanguage)}` },
                            ...fewShots,
                            ...recentHistory
                        ]
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const fallbackGreeting = (currentLanguage === 'en') ? "Hey, what's on your mind?" : "హాయ్! ఏంటి విశేషాలు?";
                const aiReply = cleanTeluguOutput(data.response || data.reply || data.choices?.[0]?.message?.content) || fallbackGreeting;

                conversationHistory.push({ role: "assistant", content: aiReply });
                conversationHistory = manageConversationHistory(conversationHistory, 8);

                // Render clean Markdown (Pure text chat - Gemini Chat mode)
                const bubble = aiRow.querySelector('.msg-bubble');
                bubble.innerHTML = marked.parse(aiReply);

                // UI Safety Net: Continue button if cut-off or length limit hit (Section 9 & 14)
                const isCut = (data.meta && data.meta.finish_reason === "length") || isReplyCutOff(aiReply);
                if (isCut && aiReply.length > 50) {
                    const continueBtn = document.createElement('button');
                    continueBtn.className = 'continue-pill-btn';
                    continueBtn.innerHTML = `<i class="fa-solid fa-play"></i> Continue response`;
                    continueBtn.onclick = () => handleContinueClick(continueBtn, bubble, aiReply);
                    aiRow.appendChild(continueBtn);
                }
            } catch (error) {
                console.error("Chat error:", error);
                showErrorToast("Connection error. Please try again.");
                aiRow.querySelector('.msg-bubble').innerHTML = `<span style="color: #f857a6;">Server connection error. Please check your network.</span>`;
            }

            scrollToBottom();
        }

        let speechStarted = false;
        let lastSpeechTime = 0;
        let speechStartTime = 0;
        const RMS_THRESHOLD = 0.018;
        const SILENCE_TIMEOUT_MS = 750;
        const MAX_TURN_MS = 12000;

        let playbackAudioCtx = null;
        let keepAliveOsc = null;
        let keepAliveGain = null;

        function setLiveState(state, badgeText, transcriptText) {
            liveModal.classList.remove('listening', 'thinking', 'speaking');
            if (state) liveModal.classList.add(state);
            if (badgeText) liveStatusBadge.textContent = badgeText;
            if (transcriptText) liveTranscript.textContent = transcriptText;
        }

        function getPlaybackAudioContext() {
            if (!playbackAudioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) playbackAudioCtx = new AudioContextClass();
            }
            return playbackAudioCtx;
        }

        function ensurePlaybackUnlocked() {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                if (!keepAliveOsc) {
                    keepAliveOsc = ctx.createOscillator();
                    keepAliveGain = ctx.createGain();
                    keepAliveGain.gain.value = 0.00001;
                    keepAliveOsc.connect(keepAliveGain);
                    keepAliveGain.connect(ctx.destination);
                    keepAliveOsc.start();
                }
            } catch (e) {}
        }

        ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'].forEach(evt => {
            window.addEventListener(evt, () => ensurePlaybackUnlocked(), { passive: true });
        });

        function encodePCMToWav16k(chunks, inputSampleRate) {
            let totalLen = 0;
            for (let i = 0; i < chunks.length; i++) totalLen += chunks[i].length;
            const merged = new Float32Array(totalLen);
            let offset = 0;
            for (let i = 0; i < chunks.length; i++) {
                merged.set(chunks[i], offset);
                offset += chunks[i].length;
            }

            const targetRate = 16000;
            let samples;
            if (inputSampleRate === targetRate) {
                samples = merged;
            } else {
                const ratio = inputSampleRate / targetRate;
                const newLength = Math.max(1, Math.round(merged.length / ratio));
                samples = new Float32Array(newLength);
                let offsetResult = 0;
                let offsetBuffer = 0;
                while (offsetResult < newLength) {
                    const nextOffsetBuffer = Math.min(merged.length, Math.round((offsetResult + 1) * ratio));
                    let accum = 0, count = 0;
                    for (let i = offsetBuffer; i < nextOffsetBuffer; i++) {
                        accum += merged[i];
                        count++;
                    }
                    samples[offsetResult] = count > 0 ? accum / count : 0;
                    offsetResult++;
                    offsetBuffer = nextOffsetBuffer;
                }
            }

            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeStr = (pos, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(pos + i, str.charCodeAt(i));
            };

            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetRate, true);
            view.setUint32(28, targetRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, samples.length * 2, true);

            let idx = 44;
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                view.setInt16(idx, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                idx += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function openLiveMode() {
            ensurePlaybackUnlocked();

            if (livePlayer) {
                try {
                    livePlayer.muted = false;
                    livePlayer.volume = 1.0;
                    livePlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
                    await livePlayer.play();
                    livePlayer.pause();
                    livePlayer.currentTime = 0;
                } catch (e) {}
            }

            isLiveActive = true;
            isAITalking = false;
            isProcessingTurn = false;
            liveModal.classList.add('active');
            setLiveState('listening', 'CONNECTING...', (currentLanguage === 'en' ? 'Connecting...' : 'కనెక్ట్ అవుతోంది...'));

            await startContinuousListening();
        }

        function teardownWavRecorder() {
            if (processorNode) {
                try { processorNode.disconnect(); } catch (e) {}
                processorNode.onaudioprocess = null;
                processorNode = null;
            }
            if (micSourceNode) {
                try { micSourceNode.disconnect(); } catch (e) {}
                micSourceNode = null;
            }
            if (silentGainNode) {
                try { silentGainNode.disconnect(); } catch (e) {}
                silentGainNode = null;
            }
            if (recorderCtx) {
                try { recorderCtx.close(); } catch (e) {}
                recorderCtx = null;
            }
        }

        function closeLiveMode() {
            isLiveActive = false;
            isProcessingTurn = false;
            liveModal.classList.remove('active');
            stopAudioPlayback();
            teardownWavRecorder();
            if (mediaStream) {
                try { mediaStream.getTracks().forEach(track => track.stop()); } catch (e) {}
                mediaStream = null;
            }
            if (keepAliveOsc) {
                try { keepAliveOsc.stop(); } catch (e) {}
                keepAliveOsc = null;
                keepAliveGain = null;
            }
        }

        function interruptAI() {
            if (isAITalking) {
                stopAudioPlayback();
                isProcessingTurn = false;
                startContinuousListening();
            }
        }

        function stopAudioPlayback() {
            if (currentAudioSource) {
                try { currentAudioSource.stop(); } catch (e) {}
                currentAudioSource = null;
            }
            if (livePlayer) {
                try {
                    livePlayer.pause();
                    livePlayer.currentTime = 0;
                    livePlayer.onended = null;
                    livePlayer.onerror = null;
                } catch (e) {}
            }
            if (currentBlobUrl) {
                try { URL.revokeObjectURL(currentBlobUrl); } catch (e) {}
                currentBlobUrl = null;
            }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isAITalking = false;
        }

        async function startContinuousListening() {
            if (!isLiveActive || isAITalking) return;

            isProcessingTurn = false;
            pcmChunks = [];
            preSpeechBuffer = [];
            speechStarted = false;
            lastSpeechTime = 0;
            speechStartTime = 0;

            if (!mediaStream || mediaStream.getTracks().every(t => t.readyState === 'ended')) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                } catch (err) {
                    showErrorToast("Microphone permission denied.");
                    setLiveState('listening', 'MIC BLOCKED', 'Please allow microphone access.');
                    return;
                }
            } else {
                mediaStream.getAudioTracks().forEach(track => { track.enabled = true; });
            }

            if (!recorderCtx || recorderCtx.state === 'closed') {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                recorderCtx = new AudioContextClass();
                micSourceNode = recorderCtx.createMediaStreamSource(mediaStream);
                processorNode = recorderCtx.createScriptProcessor(4096, 1, 1);
                silentGainNode = recorderCtx.createGain();
                silentGainNode.gain.value = 0;

                micSourceNode.connect(processorNode);
                processorNode.connect(silentGainNode);
                silentGainNode.connect(recorderCtx.destination);
            } else if (recorderCtx.state === 'suspended') {
                await recorderCtx.resume().catch(() => {});
            }

            setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'ఏంటి విశేషాలు?'));

            processorNode.onaudioprocess = (event) => {
                if (!isLiveActive || isAITalking || isProcessingTurn) return;

                const input = event.inputBuffer.getChannelData(0);
                const copy = new Float32Array(input.length);
                copy.set(input);

                let sum = 0;
                for (let i = 0; i < copy.length; i++) sum += copy[i] * copy[i];
                const rms = Math.sqrt(sum / copy.length);
                const now = Date.now();

                if (rms > RMS_THRESHOLD) {
                    if (!speechStarted) {
                        speechStarted = true;
                        speechStartTime = now;
                        pcmChunks = [...preSpeechBuffer];
                        preSpeechBuffer = [];
                        setLiveState('listening', 'LISTENING', (currentLanguage === 'en' ? 'Listening...' : 'వింటున్నాను...'));
                    }
                    lastSpeechTime = now;
                    pcmChunks.push(copy);
                } else if (speechStarted) {
                    pcmChunks.push(copy);
                    if ((now - lastSpeechTime > SILENCE_TIMEOUT_MS) || (now - speechStartTime > MAX_TURN_MS)) {
                        isProcessingTurn = true;
                        const captured = pcmChunks;
                        const sampleRate = recorderCtx.sampleRate;
                        pcmChunks = [];
                        speechStarted = false;

                        const durationSec = (captured.length * 4096) / sampleRate;
                        if (durationSec < 0.25) {
                            isProcessingTurn = false;
                            return;
                        }

                        const wavBlob = encodePCMToWav16k(captured, sampleRate);
                        processWavWithSTT(wavBlob);
                    }
                } else {
                    preSpeechBuffer.push(copy);
                    if (preSpeechBuffer.length > 4) preSpeechBuffer.shift();
                }
            };
        }

        async function callSarvamSTT(wavBlob, modelName, langCode) {
            const formData = new FormData();
            formData.append('file', wavBlob, 'recording.wav');
            formData.append('model', modelName);
            formData.append('language_code', langCode);

            const res = await fetch(SARVAM_STT_URL, { method: 'POST', body: formData });
            if (!res.ok) {
                const errTxt = await res.text();
                throw new Error(`Sarvam ${res.status}: ${errTxt.slice(0, 80)}`);
            }
            return await res.json();
        }

        async function processWavWithSTT(wavBlob) {
            setLiveState('thinking', 'THINKING', (currentLanguage === 'en' ? 'Thinking...' : 'ఆలోచిస్తున్నాను...'));

            try {
                let transcript = '';

                if (liveLangMode === 'en') {
                    const formData = new FormData();
                    formData.append('file', wavBlob, 'recording.wav');
                    formData.append('model', 'whisper-large-v3-turbo');
                    formData.append('language', 'en');

                    const sttRes = await fetch(GROQ_STT_URL, { method: 'POST', body: formData });
                    if (!sttRes.ok) throw new Error(`Whisper ${sttRes.status}`);
                    const sttData = await sttRes.json();
                    transcript = (sttData.text || '').trim();
                } else {
                    let sttData;
                    const langParam = liveLangMode === 'te' ? 'te-IN' : 'unknown';
                    try {
                        sttData = await callSarvamSTT(wavBlob, 'saaras:v3', langParam);
                    } catch (e1) {
                        console.warn('saaras:v3 failed, falling back to saarika:v2.5:', e1);
                        sttData = await callSarvamSTT(wavBlob, 'saarika:v2.5', 'te-IN');
                    }

                    transcript = (sttData.transcript || sttData.text || '').trim();

                    if (liveLangMode === 'auto' && sttData.language_code) {
                        if (sttData.language_code.startsWith('te')) currentLanguage = 'te';
                        else if (sttData.language_code.startsWith('en')) currentLanguage = 'en';
                    }
                }

                const noiseHallucinations = /^(thank you\.?|thanks for watching\.?|subtitles by.*|you\.?|\.+|\s*)$/i;
                if (!transcript || noiseHallucinations.test(transcript)) {
                    if (isLiveActive && !isAITalking) {
                        startContinuousListening();
                    }
                    return;
                }

                const detected = detectLanguage(transcript, true);
                if (detected) currentLanguage = detected;

                await processLiveUserVoice(transcript);
            } catch (err) {
                console.error("STT Error:", err);
                showErrorToast(`Voice Error: ${err.message}`, 4500);
                if (isLiveActive && !isAITalking) {
                    setTimeout(() => startContinuousListening(), 1000);
                }
            }
        }

        async function processLiveUserVoice(userVoiceText) {
            if (!userVoiceText) return;

            const detected = detectLanguage(userVoiceText, true);
            if (detected) currentLanguage = detected;

            setLiveState('thinking', 'THINKING', `"${userVoiceText}"`);

            conversationHistory.push({ role: "user", content: userVoiceText });
            if (conversationHistory.length > 6) conversationHistory = conversationHistory.slice(-6);

            document.body.classList.add('chat-active');
            homeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            appendUserMessage(userVoiceText);

            try {
                const LIVE_PROMPT = `You are Nakshatra AI (created by Bunny / Praveen) on a live voice call.
${getLangDirective(currentLanguage)}

STYLE & VIBE:
- Talk like a warm, caring, witty friend—smooth and natural.
- Match the user's language: speak English if the user speaks English; speak clean, grammatically correct everyday spoken Telugu if the user speaks Telugu ("నేను బాగున్నాను", "మీరు ఏం చేస్తున్నారు"). Never produce broken half-Telugu sentences or archaic 90s textbook words like "నివాసం", "సమయం", "సమాచారం".
- Match the user's energy: caring when they are tired/low, playful when they are casual.

HIGH-IQ LOGIC:
- Think carefully step-by-step internally before replying so your logic, math, riddles, and movie/general facts are 100% accurate. Never guess or mix up facts.
- Speak in 1 to 2 smooth, flowing, complete sentences.
- Only mention Bunny if asked who created you.`;

                const fewShots = getFewShotExamples(currentLanguage);
                const recentHistory = conversationHistory.slice(-4);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        mode: "live",
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata",
                        max_tokens: 220,
                        messages: [
                            { role: "system", content: LIVE_PROMPT },
                            ...fewShots,
                            ...recentHistory
                        ]
                    })
                });

                if (!response.ok) throw new Error(`AI HTTP ${response.status}`);

                const data = await response.json();
                const fallbackLiveGreeting = (currentLanguage === 'en') ? "Hey, what's on your mind?" : "హాయ్! ఏంటి విశేషాలు?";
                let rawReply = data.response || data.reply || data.choices?.[0]?.message?.content || fallbackLiveGreeting;
                let aiText = cleanTeluguOutput(rawReply);

                // Add to history (4 turns for live voice mode)
                conversationHistory.push({ role: "assistant", content: aiText });
                conversationHistory = manageConversationHistory(conversationHistory, 4);

                const aiRow = document.createElement('div');
                aiRow.className = 'msg-row ai';
                aiRow.innerHTML = `
                    <img src="images/ic_launcher.png" class="ai-avatar" alt="Nakshatra">
                    <div class="msg-bubble">${marked.parse(aiText)}</div>
                `;
                chatContainer.appendChild(aiRow);
                scrollToBottom();

                await speakAIResponse(aiText);

            } catch (err) {
                console.error("Live AI error:", err);
                showErrorToast("Connection issue. Retrying...");
                if (isLiveActive && !isAITalking) {
                    setTimeout(() => { if (isLiveActive) startContinuousListening(); }, 1000);
                }
            }
        }

        async function speakAIResponse(textToSpeak) {
            if (!isLiveActive) return;

            let cleanSpeechText = sanitizeForSpeech(textToSpeak) || textToSpeak;
            if (!cleanSpeechText) {
                if (isLiveActive) startContinuousListening();
                return;
            }

            setLiveState('thinking', 'THINKING', `"${cleanSpeechText}"`);

            // Primary: Smooth, natural, caring bulbul:v4-flash ('kavitha_te_conversation')
            let targetLang = "te-IN";
            let speakerName = "kavitha_te_conversation";
            let ttsModel = "bulbul:v4-flash";

            if (currentLanguage === 'en') {
                targetLang = "en-IN";
                speakerName = "simran_en_conversation";
            } else if (currentLanguage === 'hi') {
                targetLang = "hi-IN";
                speakerName = "kavya_hi_conversational";
            } else if (currentLanguage === 'ta') {
                targetLang = "ta-IN";
                speakerName = "gokul_ta_narration";
            } else if (currentLanguage === 'ml' || /[\u0D00-\u0D7F]/.test(cleanSpeechText)) {
                targetLang = "ml-IN";
                speakerName = "sangeetha_ml_conversational";
            } else if (currentLanguage === 'kn' || /[\u0C80-\u0CFF]/.test(cleanSpeechText)) {
                targetLang = "kn-IN";
                speakerName = "chaitra_kn_conversation";
            }

            try {
                ensurePlaybackUnlocked();

                const ttsResponse = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: cleanSpeechText,
                        target_language_code: targetLang,
                        model: ttsModel,
                        speaker: speakerName,
                        pace: 1.05,
                        speech_sample_rate: 24000,
                        output_audio_codec: "wav"
                    })
                });

                if (!ttsResponse.ok) {
                    await fallbackTTSBulbulV3(cleanSpeechText, targetLang, cleanSpeechText);
                    return;
                }

                const ttsData = await ttsResponse.json();
                const audioBase64 = (ttsData.audios && ttsData.audios[0]) || ttsData.audio || ttsData.audio_content;
                if (audioBase64) {
                    await playAudioFromBase64(audioBase64, cleanSpeechText);
                } else {
                    await fallbackTTSBulbulV3(cleanSpeechText, targetLang, cleanSpeechText);
                }
            } catch (ttsErr) {
                await fallbackBrowserSpeech(cleanSpeechText);
            }
        }

        async function fallbackTTSBulbulV3(cleanSpeechText, targetLang, originalText) {
            if (!isLiveActive) return;
            try {
                const fallbackSpeaker = targetLang === "en-IN" ? "simran"
                    : targetLang === "hi-IN" ? "kavya"
                    : "kavitha";

                const ttsResponse = await fetch(SARVAM_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: cleanSpeechText,
                        target_language_code: targetLang,
                        model: "bulbul:v3",
                        speaker: fallbackSpeaker,
                        pace: 1.05,
                        speech_sample_rate: 24000,
                        output_audio_codec: "wav"
                    })
                });

                if (!ttsResponse.ok) {
                    await fallbackBrowserSpeech(cleanSpeechText);
                    return;
                }
                const ttsData = await ttsResponse.json();
                const audioBase64 = (ttsData.audios && ttsData.audios[0]) || ttsData.audio || ttsData.audio_content;
                if (audioBase64) {
                    await playAudioFromBase64(audioBase64, originalText);
                } else {
                    await fallbackBrowserSpeech(cleanSpeechText);
                }
            } catch (e) {
                await fallbackBrowserSpeech(cleanSpeechText);
            }
        }

        function playAudioFromBase64(base64Audio, displayText) {
            return new Promise(async (resolve) => {
                stopAudioPlayback();
                isAITalking = true;
                setLiveState('speaking', 'SPEAKING', `"${displayText}"`);

                if (mediaStream) {
                    try { mediaStream.getAudioTracks().forEach(t => { t.enabled = false; }); } catch (e) {}
                }

                // Suspend mic AudioContext while AI speaks so playback never stutters
                if (recorderCtx && recorderCtx.state === 'running') {
                    recorderCtx.suspend().catch(() => {});
                }

                let finished = false;
                const finishTurn = () => {
                    if (finished) return;
                    finished = true;
                    isAITalking = false;
                    currentAudioSource = null;

                    if (currentBlobUrl) {
                        try { URL.revokeObjectURL(currentBlobUrl); } catch (e) {}
                        currentBlobUrl = null;
                    }

                    if (isLiveActive) {
                        setTimeout(() => {
                            if (isLiveActive && !isAITalking) startContinuousListening();
                        }, 300);
                    }
                    resolve();
                };

                try {
                    const cleanBase64 = (base64Audio || '').replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                    const binaryString = window.atob(cleanBase64);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

                    const blob = new Blob([bytes], { type: 'audio/wav' });
                    currentBlobUrl = URL.createObjectURL(blob);

                    if (livePlayer) {
                        livePlayer.muted = false;
                        livePlayer.volume = 1.0;
                        livePlayer.src = currentBlobUrl;
                        livePlayer.onended = finishTurn;
                        livePlayer.onerror = () => playViaWebAudio(bytes, finishTurn);
                        await livePlayer.play();
                    } else {
                        playViaWebAudio(bytes, finishTurn);
                    }
                } catch (err) {
                    try {
                        const cleanBase64 = (base64Audio || '').replace(/^data:audio\/\w+;base64,/, '').replace(/[\r\n\s]/g, '');
                        const binaryString = window.atob(cleanBase64);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                        playViaWebAudio(bytes, finishTurn);
                    } catch (e2) {
                        finishTurn();
                    }
                }
            });
        }

        async function playViaWebAudio(bytes, onDone) {
            try {
                const ctx = getPlaybackAudioContext();
                if (!ctx) { onDone(); return; }
                if (ctx.state === 'suspended') await ctx.resume();
                ctx.decodeAudioData(bytes.buffer.slice(0), function (buffer) {
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(ctx.destination);
                    currentAudioSource = source;
                    source.onended = onDone;
                    source.start(0);
                }, () => onDone());
            } catch (e) {
                onDone();
            }
        }

        function fallbackBrowserSpeech(text) {
            return new Promise((resolve) => {
                const cleanup = () => {
                    isAITalking = false;
                    if (isLiveActive) {
                        setTimeout(() => {
                            if (isLiveActive && !isAITalking) startContinuousListening();
                        }, 300);
                    }
                    resolve();
                };

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = { en: 'en-IN', hi: 'hi-IN', ta: 'ta-IN', kn: 'kn-IN' }[currentLanguage] || 'te-IN';
                    isAITalking = true;
                    setLiveState('speaking', 'SPEAKING', `"${text}"`);
                    utterance.onend = cleanup;
                    utterance.onerror = cleanup;
                    window.speechSynthesis.speak(utterance);
                } else {
                    cleanup();
                }
            });
        }
